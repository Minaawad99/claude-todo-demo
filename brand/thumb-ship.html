<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Reel cover — ship</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<style>
  /* 540×960 at 2x = 1080×1920 reel cover. Instagram's grid shows the middle 3:4 (y 120–840);
     the bottom ~200px sits under the reel's caption and buttons. Everything that matters lives in 120–740. */
  body { margin: 0; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: var(--font-sans); color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(to right, var(--paper-grid) 1px, transparent 1px), linear-gradient(to bottom, var(--paper-grid) 1px, transparent 1px);
    background-size: 36px 36px; background-position: 18px 12px; }
  .cover > svg { position: absolute; inset: 0; }
  .t { position: absolute; left: 0; right: 0; text-align: center; margin: 0; }
  .brand { top: 136px; display: flex; justify-content: center; align-items: center; gap: 8px; font: 600 17px/1 var(--font-sans); }
  .l1 { top: 182px; font: 800 52px/1.2 var(--font-sans); }
  .l1 b { color: var(--heat); }
  .l2 { top: 556px; font: 800 44px/1.25 var(--font-sans); }
  .l2 .n { font: 700 84px/1 var(--font-numeral); color: var(--heat); vertical-align: -8px; }
  .l2 .ok { color: var(--water); }
  .pill { top: 728px; display: flex; justify-content: center; }
  .pill span { font: 700 26px/1 var(--font-sans); padding: 12px 26px; background: var(--heat); color: var(--on-heat); border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  .lit { fill: var(--paper-raised); } .steel { fill: #5f5a52; }
  .water { fill: var(--water-body); } .water-line { fill: none; stroke: var(--water); stroke-width: 3; }
  .air-fill { fill: color-mix(in srgb, var(--olive) 45%, var(--paper)); }
  .glass { fill: none; stroke: var(--ink); stroke-width: 4; }
  .x { fill: none; stroke: var(--heat); stroke-width: 9; stroke-linecap: round; }
  .ok-s { fill: none; stroke: var(--olive-text); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .arrow { fill: var(--water); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .box1 { fill: var(--heat); } .box2 { fill: var(--water); } .box3 { fill: var(--olive); } .box4 { fill: var(--khaki); }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 540 960" width="540" height="960" aria-hidden="true">
    <defs>
      <g id="ship">
        <path class="tz-f-deep tz-ink" d="M10 86 L330 86 L316 122 L36 122 Z"/>
        <path class="tz-f-heat" d="M22 110 L324 110 L316 122 L36 122 Z"/>
        <path class="tz-pat-hatch" d="M10 86 L330 86 L326 96 L14 96 Z"/>
        <path class="tz-ink" style="fill:none" d="M10 86 L330 86 L316 122 L36 122 Z M22 110 H324"/>
        <path class="lit tz-ink" d="M260 26 L300 26 L300 86 L260 86 Z"/>
        <path class="tz-f-water tz-ink" d="M264 34 H296 V42 H264 Z"/><path class="tz-ink" style="fill:none" d="M264 54 H296 M264 66 H296"/>
        <path class="tz-f-deep tz-ink" d="M276 6 L288 6 L290 26 L274 26 Z"/>
      </g>
      <g id="boxes" class="tz-ink" style="stroke-width:1.2">
        <rect class="box1" x="40" y="66" width="34" height="20"/><rect class="box2" x="74" y="66" width="34" height="20"/><rect class="box3" x="108" y="66" width="34" height="20"/><rect class="box4" x="142" y="66" width="34" height="20"/><rect class="box2" x="176" y="66" width="34" height="20"/><rect class="box1" x="210" y="66" width="34" height="20"/>
      </g>
      <path id="wave" d="M-20 0 Q0 -6 20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0 T340 0 T380 0"/>
    </defs>

    <!-- frame -->
    <rect x="22" y="22" width="496" height="916" style="fill:none;stroke:var(--ink);stroke-width:3"/>
    <rect x="30" y="30" width="480" height="900" style="fill:none;stroke:var(--ink);stroke-width:1.2"/>

    <!-- right: glass with the sinking nail -->
    <g transform="translate(330 300)">
      <rect class="water" x="12" y="70" width="136" height="150"/>
      <use href="#wave" class="water-line" transform="translate(12 70) scale(.36 .8)"/>
      <path class="glass" d="M4 10 L12 226 Q12 238 24 238 L136 238 Q148 238 148 226 L156 10"/>
      <g transform="translate(78 168) rotate(18) scale(1.4)"><rect class="steel tz-ink" x="-2" y="0" width="5" height="40"/><rect class="steel tz-ink" x="-9" y="-4" width="19" height="5"/><path class="steel tz-ink" d="M-2 40 L0.5 47 L3 40 Z"/></g>
      <g style="fill:none;stroke:var(--water);stroke-width:2"><circle cx="66" cy="140" r="4"/><circle cx="86" cy="118" r="3"/><circle cx="72" cy="96" r="2.5"/></g>
      <path class="x" d="M54 -28 L104 22 M104 -28 L54 22"/>
    </g>

    <!-- "vs" divider -->
    <path d="M300 300 V530" style="stroke:var(--line-soft);stroke-width:2;stroke-dasharray:6 6"/>
    <circle cx="300" cy="414" r="24" class="lit" style="stroke:var(--ink);stroke-width:2.5"/>
    <text x="300" y="422" text-anchor="middle" style="font:800 20px var(--font-sans);fill:var(--ink)">ضد</text>

    <!-- left: container ship floating, air inside -->
    <g transform="translate(36 302)">
      <rect class="water" x="0" y="148" width="246" height="82"/>
      <g transform="translate(-2 60) scale(.74)">
        <use href="#boxes"/><use href="#boxes" transform="translate(0 -20)"/><use href="#boxes" transform="translate(30 -40)"/>
        <use href="#ship"/>
        <path class="air-fill tz-ink" d="M22 92 L322 92 L313 108 L34 108 Z"/>
      </g>
      <use href="#wave" class="water-line" transform="translate(0 148) scale(.66 1)"/>
      <path class="arrow" d="M112 226 V196 H102 L122 172 L142 196 H132 V226 Z"/>
      <path class="ok-s" d="M96 0 L118 22 L156 -18"/>
    </g>
  </svg>

  <div class="t brand"><svg width="22" height="25" viewBox="0 0 48 54"><rect x="20" y="0" width="8" height="3" style="fill:var(--ink)"/><rect x="23" y="3" width="2" height="4" style="fill:var(--ink)"/><circle cx="24" cy="30" r="20" style="fill:none;stroke:var(--heat);stroke-width:4"/><circle cx="24" cy="30" r="6" style="fill:var(--heat)"/></svg>طب إزاي؟</div>
  <p class="t l1">مسمار <b>بيغرق</b>...</p>
  <p class="t l2">وسفينة <span class="n">200</span> ألف طن<br><span class="ok">بتعوم!</span></p>
  <div class="t pill"><span>طب إزاي؟</span></div>
</div>
<script src="../design-system/components/bundle.js"></script>
<script>TebEzay.patterns();</script>
</body>
</html>
