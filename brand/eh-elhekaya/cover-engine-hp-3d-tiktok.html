<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — engine horsepower (3D)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover in 3D (three.js, served over http: `python3 -m http.server` from the repo root, then shoot it), full bleed
     540×960 at 2x: the tunnel-cover palette (near black top and bottom, a warm glow behind the subject) with two identical
     2.0 L inline-four engines on a workshop floor, the right one with a glowing turbo. Text stays inside y 120–840 and away
     from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 540px !important; height: 960px !important; }
  .fade { position: absolute; left: 0; right: 0; pointer-events: none; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  #over { position: absolute; inset: 0; width: 540px; height: 960px; }
  .tag { font-family: "Noto Serif", serif; font-weight: 800; fill: #fff; }
  .unit { font-family: "Noto Sans Arabic", sans-serif; font-weight: 800; fill: #fff; }
</style></head><body>
<div class="cover">
  <div id="gl"></div>
  <div class="fade" style="top:0;height:300px;background:linear-gradient(#000f,#0009 70%,#0000)"></div>
  <div class="fade" style="top:660px;height:300px;background:linear-gradient(#0000,#000b 30%,#000f)"></div>
  <svg id="over" viewBox="0 0 540 960">
    <g transform="translate(145 640) rotate(-4)"><rect x="-62" y="-30" width="124" height="54" rx="7" fill="#626b3b"/><text y="13" text-anchor="middle" class="tag" style="font-size:34px">150</text><text x="0" y="46" text-anchor="middle" class="unit" style="font-size:15px">حصان</text></g>
    <g transform="translate(375 640) rotate(4)"><rect x="-66" y="-32" width="132" height="58" rx="7" fill="#bd522b"/><text y="14" text-anchor="middle" class="tag" style="font-size:38px">400</text><text x="0" y="50" text-anchor="middle" class="unit" style="font-size:15px">حصان</text></g>
  </svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:158px;font:900 38px/1.2 'Noto Sans Arabic';color:#fff">نفس الموتور…<br>أحصنة مختلفة؟</p>
  <p class="t" style="top:258px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230"><span style="direction:ltr;unicode-bidi:isolate">2000 cc</span> للاتنين!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">السر مش في <span style="color:#f2c230">البنزين</span><br><span style="font-size:24px;color:#d9d4c8">السر في الهوا!</span></p>
</div>
<script type="importmap">{ "imports": { "three": "../../remotion/node_modules/three/build/three.module.js", "three/addons/": "../../remotion/node_modules/three/examples/jsm/" } }</script>
<script type="module">
  import * as THREE from "three";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
  const W = 540, H = 960, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(2); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.9; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById("gl").appendChild(r.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#0b0e13"); scene.fog = new THREE.Fog("#0b0e13", 8, 15);
  scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100); cam.position.set(0.0, 3.2, 9.3); cam.lookAt(0.0, 0.55, 0);
  const canvasTex = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d")); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

  // materials
  const castAlu = new THREE.MeshStandardMaterial({ color: "#a9aeb3", metalness: 0.75, roughness: 0.48 });
  const iron = new THREE.MeshStandardMaterial({ color: "#5d6166", metalness: 0.7, roughness: 0.55 });
  const blackPl = new THREE.MeshPhysicalMaterial({ color: "#16181b", roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.4 });
  const chrome = new THREE.MeshStandardMaterial({ color: "#dfe3e7", metalness: 1, roughness: 0.16 });
  const steel = new THREE.MeshStandardMaterial({ color: "#8c8f92", metalness: 0.9, roughness: 0.35 });
  const red = new THREE.MeshStandardMaterial({ color: "#b52a20", roughness: 0.45 });
  const rubber = new THREE.MeshStandardMaterial({ color: "#121212", roughness: 0.8 });
  const hot = new THREE.MeshStandardMaterial({ color: "#3a1b10", emissive: "#ff5a12", emissiveIntensity: 1.6, metalness: 0.6, roughness: 0.45 });
  const add = (m, x, y, z, parent, sh = true) => { m.position.set(x, y, z); m.castShadow = sh; m.receiveShadow = true; (parent || scene).add(m); return m; };
  const tube = (pts, rad, mat, parent) => add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), 40, rad, 16, false), mat), 0, 0, 0, parent);

  // one inline-four engine; crank axis along x, intake on +z, exhaust on −z; turbo adds a glowing turbo and a hot manifold
  function engine(turbo) {
    const g = new THREE.Group();
    add(new THREE.Mesh(new RoundedBoxGeometry(1.0, 0.5, 0.52, 4, 0.03), iron), 0, 0.25, 0, g);                       // block
    for (let i = 0; i < 5; i++) add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.42, 0.04), iron), -0.4 + i * 0.2, 0.24, 0.27, g);   // ribs
    add(new THREE.Mesh(new RoundedBoxGeometry(1.06, 0.12, 0.48, 3, 0.02), iron), 0, -0.04, 0, g);                     // oil pan lip
    add(new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.18, 0.42, 3, 0.04), steel), 0, -0.17, 0, g);                     // oil pan
    add(new THREE.Mesh(new RoundedBoxGeometry(1.02, 0.18, 0.46, 3, 0.02), castAlu), 0, 0.59, 0, g);                   // head
    add(new THREE.Mesh(new RoundedBoxGeometry(0.96, 0.13, 0.36, 4, 0.05), blackPl), 0, 0.745, 0, g);                  // valve cover
    for (let i = 0; i < 4; i++) {                                                                                      // coil packs
      add(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.1, 24), blackPl), -0.33 + i * 0.22, 0.85, 0, g);
      add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.035, 0.09), red), -0.33 + i * 0.22, 0.905, 0.02, g);
    }
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.04, 24), chrome), 0.36, 0.83, -0.12, g);               // oil cap
    // intake: 4 curved runners from the head over to a plenum on the +z side
    const plen = add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.98, 32), castAlu), 0, 0.42, 0.52, g); plen.rotation.z = Math.PI / 2;
    for (let i = 0; i < 4; i++) { const x = -0.33 + i * 0.22; tube([[x, 0.6, 0.22], [x, 0.7, 0.36], [x, 0.66, 0.5], [x, 0.5, 0.56], [x, 0.44, 0.52]], 0.034, castAlu, g); }
    const tb = add(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.1, 32), chrome), -0.54, 0.42, 0.52, g); tb.rotation.z = Math.PI / 2;  // throttle body
    // exhaust manifold on −z
    for (let i = 0; i < 4; i++) { const x = -0.33 + i * 0.22; tube([[x, 0.56, -0.22], [x, 0.54, -0.34], [x * 0.5, 0.42, -0.42], [0.1, 0.36, -0.44]], 0.04, turbo ? hot : steel, g); }
    // front: timing cover, pulleys, belt
    add(new THREE.Mesh(new RoundedBoxGeometry(0.05, 0.62, 0.4, 3, 0.02), blackPl), 0.53, 0.42, 0, g);
    [[0.0, 0.06, 0.12], [0.3, 0.12, 0.08], [0.6, -0.1, 0.07]].forEach(([y, z, rr]) => { const p = add(new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 0.06, 40), chrome), 0.58, y + 0.02, z, g); p.rotation.z = Math.PI / 2; });
    const belt = tube([[0.6, 0.15, 0.12], [0.6, 0.0, 0.2], [0.6, -0.1, 0.06], [0.6, 0.02, -0.08], [0.6, 0.32, 0.0], [0.6, 0.62, -0.18], [0.6, 0.64, 0.0], [0.6, 0.15, 0.12]], 0.012, rubber, g);
    // back: flywheel
    const fw = add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 48), steel), -0.54, 0.2, 0, g); fw.rotation.z = Math.PI / 2;
    if (turbo) {   // the turbo on the exhaust side: hot turbine housing + aluminium compressor snail, an intercooler pipe over the top
      const tH = add(new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.07, 24, 48), hot), 0.18, 0.3, -0.56, g); tH.rotation.y = Math.PI / 2;
      add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.16, 24), steel), 0.32, 0.3, -0.56, g).rotation.z = Math.PI / 2;
      const cH = add(new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.075, 24, 48), castAlu), 0.46, 0.3, -0.56, g); cH.rotation.y = Math.PI / 2;
      add(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 32), chrome), 0.56, 0.3, -0.56, g).rotation.z = Math.PI / 2;
      tube([[0.46, 0.42, -0.56], [0.46, 0.95, -0.4], [0.2, 1.0, 0.1], [-0.2, 0.85, 0.5], [-0.54, 0.5, 0.52]], 0.05, new THREE.MeshStandardMaterial({ color: "#2b5fa8", metalness: 0.6, roughness: 0.3 }), g);
      const gl = new THREE.PointLight("#ff6a1a", 6, 1.6, 1.6); gl.position.set(0.2, 0.35, -0.7); g.add(gl);
    }
    return g;
  }
  const e1 = engine(false); e1.position.set(-0.7, 0.25, 0.1); e1.rotation.y = -0.55; scene.add(e1);
  const e2 = engine(true); e2.position.set(0.82, 0.25, -0.1); e2.rotation.y = Math.PI + 0.55; scene.add(e2);

  // the workshop floor: dark concrete, a little glossy
  const conc = canvasTex(1024, 1024, g => { g.fillStyle = "#24272b"; g.fillRect(0, 0, 1024, 1024); for (let i = 0; i < 9000; i++) { const v = 26 + Math.random() * 22; g.fillStyle = `rgba(${v},${v + 2},${v + 5},.5)`; g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); } g.strokeStyle = "#1a1c1f"; g.lineWidth = 4; [256, 768].forEach(p => { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 1024); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(1024, p); g.stroke(); }); });
  conc.wrapS = conc.wrapT = THREE.RepeatWrapping; conc.repeat.set(3, 3);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: conc, roughness: 0.55, metalness: 0.15 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // stands under the engines
  [e1, e2].forEach(e => { add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.5), new THREE.MeshStandardMaterial({ color: "#7a1f18", roughness: 0.5, metalness: 0.4 })), e.position.x, 0.03, e.position.z); });
  // sparks near the hot turbo
  const sparkM = new THREE.MeshBasicMaterial({ color: "#ffc35a" });
  for (let i = 0; i < 26; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.008 + Math.random() * 0.01, 8, 8), sparkM); const a = Math.random() * 6.28, rr = 0.2 + Math.random() * 0.7; s.position.set(1.0 + Math.cos(a) * rr * 0.6, 0.5 + Math.random() * 0.9, -0.6 + Math.sin(a) * rr * 0.3); scene.add(s); }
  // lights: a warm glow behind the turbo engine, a cool key from the front left, a rim from behind, a soft fill
  const halo = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshBasicMaterial({ map: canvasTex(256, 256, g => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, "rgba(255,200,90,.9)"); gr.addColorStop(0.45, "rgba(255,150,50,.35)"); gr.addColorStop(1, "rgba(255,140,40,0)"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }), transparent: true, depthWrite: false }));
  halo.position.set(0.85, 1.0, -2.0); scene.add(halo);
  const glow = new THREE.PointLight("#ffb050", 18, 5, 1.6); glow.position.set(0.9, 1.0, -0.9); scene.add(glow);
  const key = new THREE.SpotLight("#f1f5ff", 60, 16, 0.55, 0.6, 1.2); key.position.set(-2.6, 3.6, 3.8); key.target.position.set(0, 0.4, 0); scene.add(key.target); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
  const rim = new THREE.SpotLight("#ffd29a", 30, 12, 0.6, 0.7, 1.2); rim.position.set(2.5, 2.6, -3); rim.target.position.set(0.3, 0.4, 0); scene.add(rim.target); scene.add(rim);
  scene.add(new THREE.HemisphereLight("#9fb8d0", "#1a1410", 0.45));
  r.render(scene, cam); window.READY = true;
</script>
</body></html>
