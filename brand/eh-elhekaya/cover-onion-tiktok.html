<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — onion (sketch style)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover for «ليه البصل بيعيّطك؟» («اسكتش» style), full bleed 540×960 (1080×1920 at 2x): the tunnel-cover palette
     (near black top and bottom, one warm glow behind the subject) with the episode's own drawings (scenes.js).
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">ليه البصل بيعيّطك؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">وإنت ما لمستش عينك أصلًا!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">البصلة بتضرب <span style="color:#f2c230">غاز</span> على عينك<br><span style="font-size:24px;color:#d9d4c8">أول ما السكينة تلمسها!</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .07 0"/></filter>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".35" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity=".97"/></linearGradient>
</defs></svg>
<script src="../../videos/onion/timing.js"></script>
<script src="../../videos/onion/sketch/scenes.js"></script>
<script>
  (function () {
    var t = 20.3, s = "";
    s += '<rect width="540" height="960" fill="#1d1b17"/><rect width="540" height="960" fill="url(#grid)" opacity=".12"/>';
    s += '<circle cx="250" cy="520" r="250" fill="#ffd27a" opacity=".33" filter="url(#soft)"/><circle cx="250" cy="540" r="140" fill="#ffe08a" opacity=".3" filter="url(#soft)"/>';
    // the board, the onion cut in half, the knife that just went through
    s += '<rect x="20" y="652" width="470" height="28" rx="6" fill="#c9a274" stroke="#2a2016" stroke-width="2.4"/><rect x="30" y="680" width="450" height="9" fill="#9a7348" stroke="#2a2016" stroke-width="2"/>';
    s += onionHalf(160, 530, 1.2, t, { roots: false, rot: -5 }) + onionHalf(345, 530, 1.2, t, { roots: false, rot: 5 });
    s += blade(400, 650, 190, 0);
    // the gas rising from the cut into the eye
    s += plume(250, 470, 290, 345, t, 1, 22, 1.5);
    // the watering eye, front view, above the onion
    s += '<g transform="translate(300 315) scale(.62)">' + glandFront(t, 0, 0) + '</g>';
    s += tearDrop(200, 380, 1.1) + tearDrop(186, 440, .85);
    s += label(232, 432, 150, 520, "غاز الدموع", "#e8743c", 1, 24);
    s += '<g transform="translate(90 600)"><rect x="-52" y="-24" width="104" height="38" rx="5" fill="#c4532c"/><text x="0" y="4" text-anchor="middle" style="font:800 21px Noto Sans Arabic;fill:#fff">في ثواني</text></g>';
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
