<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — plasma donation (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the plasma reel cover on a Gemini illustration (plasma-gemini-art.jpg; prompt in videos/plasma/refs/gemini-cover-prompt.txt), full bleed 540×960 (1080×1920 at 2x).
     Text in our fonts and colours; everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 19px 'Noto Sans Arabic'; color: #fff; background: #4a6f8a; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.pl { background: linear-gradient(90deg, #ffe27a, #f2a43a 45%, #e8743c 75%, #ffd35a); -webkit-background-clip: text; background-clip: text; color: transparent;
         text-shadow: none; filter: drop-shadow(0 3px 8px rgba(0,0,0,.7)) drop-shadow(0 0 14px rgba(255,190,80,.45)); padding: 0 4px; }
</style></head><body>
<div class="cover">
  <img class="art" src="plasma-gemini-art.jpg">
  <div class="fade" style="top:0;height:250px;background:linear-gradient(#000e 0%,#0008 70%,#0000)"></div>
  <div class="fade" style="top:700px;height:260px;background:linear-gradient(#0000,#000b 35%,#000f)"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:164px;font:900 44px/1.15 'Noto Sans Arabic';color:#fff"><span class="pl">البلازما</span> اللي في دمك<br><span style="font-size:34px">بيتبرعوا بيها إزاي؟</span></p>
  <p class="t" style="top:272px;font:800 23px/1.3 'Noto Sans Arabic';color:#f2c230">الجهاز بياخد دمك… ويرجّعهولك!</p>
  <div class="tag" style="left:262px;top:585px;background:#c4532c;display:flex;flex-direction:row;direction:ltr;gap:8px"><span>دي البلازما</span><span>→</span></div>
  <p class="t" style="top:770px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">55%</span> من دمك <span class="pl">بلازما</span><br><span style="font-size:24px;color:#d9d4c8">وجسمك بيعوّضها في يوم أو اتنين</span></p>
</div>
</body></html>
