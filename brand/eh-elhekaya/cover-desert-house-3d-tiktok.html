  add(new THREE.BoxGeometry(0.5, 0.6, 0.5), std("#8a8a84", { metalness: 0.4, roughness: 0.5 }), 9.6, 0.3, 7.0);
  const sp = add(new THREE.BoxGeometry(1.0, 0.04, 0.8), std("#ffffff", { map: pv, metalness: 0.5, roughness: 0.25 }), 9.5, 1.3, 9.1); sp.rotation.x = -0.6;
