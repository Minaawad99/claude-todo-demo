<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Cover — ATM (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* photo cover, 540×960 at 2x, full bleed. Background: Canva AI image (photos/atm-canva.jpg).
     Titles stay inside the 3:4 profile crop (y 120–840) and away from the right-hand TikTok buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000 url(photos/atm-canva.jpg) center/cover; }
  .patch { position: absolute; left: 257px; top: 270px; width: 60px; height: 17px; border-radius: 3px; background: #1b1d20; }
  .fade { position: absolute; inset: 0; background:
    linear-gradient(#000e 0, #000b 150px, #0000 300px, #0000 640px, #000a 790px, #000e 960px); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 4px 14px rgba(0,0,0,.9); }
</style></head><body>
<div class="cover">
  <div class="patch"></div>
  <div class="fade"></div>
  <p class="t" style="top:112px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:134px;font:700 42px/1.2 'Aref Ruqaa',serif;color:#fff">إيه اللي جوه مكنة الفلوس؟!</p>
  <p class="t" style="top:196px;font:700 26px/1.2 'Aref Ruqaa',serif;color:#f2c230">ومين بيعدّ الفلوس؟</p>
  <p class="t" style="top:772px;font:800 30px/1.3 'Noto Sans Arabic';color:#fff">الرقم السري <span style="color:#f2c230">4 أرقام</span><br><span style="font-size:22px;color:#d9d4c8">بسبب مرات المخترع!</span></p>
</div>
</body></html>
