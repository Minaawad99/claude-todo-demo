<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Instagram + Facebook reel cover — Chernobyl</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* Reel cover shared by Instagram and Facebook: 9:16 upload, but the Instagram grid shows the 3:4 middle and the
     Facebook feed the 4:5 middle (y 142–818 at 540×960). Every word sits inside the 4:5 box, centred, so all three
     crops read the same. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  .art { position: absolute; left: 0; top: 0; width: 540px; height: 960px; object-fit: cover; object-position: 50% 50%; }
  .fT { position: absolute; left: 0; right: 0; top: 0; height: 360px; background: linear-gradient(rgba(0,0,0,.92), rgba(0,0,0,.7) 45%, rgba(0,0,0,0)); }
  .fB { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6) 35%, rgba(0,0,0,.92)); }
  .t { position: absolute; left: 30px; right: 30px; margin: 0; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.8); }
  .chip { display: inline-block; padding: 3px 14px; border-radius: 20px; background: rgba(242,194,48,.95); color: #141414; text-shadow: none; }
</style></head><body>
<div class="cover">
  <img class="art" src="chernobyl-cover-art.jpg">
  <div class="fT"></div><div class="fB"></div>
  <p class="t" style="top:160px"><span class="chip" style="font:800 14px 'Noto Sans Arabic'">إيه الحكاية؟</span></p>
  <p class="t" style="top:190px;font:900 54px/1.2 'Noto Sans Arabic';color:#fff">تشيرنوبل</p>
  <p class="t" style="top:262px;font:800 24px/1.2 'Noto Sans Arabic';color:#f2c230">الساعة 1:23 بالليل</p>
  <p class="t" style="top:672px;font:800 32px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">زرار الأمان</span>… هو اللي فجّره<br><span style="font-size:22px;color:#e6e0d4">والمدينة نامت وهي مش عارفة</span></p>
</div>
</body></html>
