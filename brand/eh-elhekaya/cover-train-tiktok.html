<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — train</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover, full bleed at TikTok's 1080×1920 (540×960 at 2x), drawn with the «اسكتش» episode's own drawings
     (videos/train/sketch/scenes.js): a night scene, the locomotive cut open in a warm glow, the coaches trailing off left.
     Everything that matters stays inside the 3:4 profile-grid crop (y 120–840) and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">عربية واحدة بتجرهم؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">ولما يقف… كلهم بيقفوا مع بعض!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">1.5</span> كيلو عشان يقف!<br><span style="font-size:24px;color:#d9d4c8">والفرامل شغالة بالهوا</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2a2016" stroke-width="1" opacity=".15"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#e1d5ba" stroke-width="1.3" fill="none"/></pattern>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset=".55" stop-color="#22334f"/><stop offset="1" stop-color="#2c3b52"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3630"/><stop offset="1" stop-color="#0c0b09"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".75"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
</defs></svg>
<script src="../../videos/train/timing.js"></script>
<script src="../../videos/train/sketch/scenes.js"></script>
<script>
  (function () {
    var t = 3.2, s = "", X = 522, Y = 590, S = 1.22;
    s += '<rect width="540" height="960" fill="url(#night)"/>';
    for (var i = 0; i < 40; i++) s += '<circle cx="' + (hash(i) * 540).toFixed(1) + '" cy="' + (90 + hash(i + 50) * 300).toFixed(1) + '" r="' + (0.6 + hash(i + 9) * 1.2).toFixed(1) + '" fill="#e8e2d0" opacity="' + (0.3 + hash(i + 3) * 0.5).toFixed(2) + '"/>';
    s += '<rect y="' + (Y + 8) + '" width="540" height="' + (960 - Y) + '" fill="url(#ground)"/>';
    // one warm glow behind the locomotive so it pops
    s += '<ellipse cx="300" cy="' + (Y - 80) + '" rx="260" ry="150" fill="#f2b84a" opacity=".55" filter="url(#soft)"/>';
    s += '<path d="M' + (X - 6) + ' ' + (Y - 64) + ' L560 ' + (Y - 120) + ' L560 ' + (Y + 10) + ' Z" fill="url(#beam)"/>';
    s += place(X, Y, S, function () {
      return trackSide(-1400, 120, 0) + train({ n: 2, lo: { cut: 1, diesel: 1, gen: 1, genRot: 1, motors: 1, cur: 1, rot: .4, t: t, puff: true, driver: true }, co: { rot: .4 } });
    });
    // tags with the key numbers
    function tagD(txt, x, y, rot, col) { var w = txt.length * 13 + 30; return '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ')"><rect x="' + (-w / 2) + '" y="-22" width="' + w + '" height="40" rx="4" fill="' + (col || "#f2c230") + '" stroke="#2a2016" stroke-width="2.4"/><text x="0" y="8" text-anchor="middle" style="font:800 23px Noto Sans Arabic;fill:#2a2016">' + txt + '</text></g>'; }
    s += tagD("+100 طن", 360, 410, -4) + tagD("10 عربيات وراه!", 130, 660, 3, "#e8e2d0");
    s += '<path d="M110 632 Q80 610 40 ' + (Y - 40) + '" fill="none" stroke="#e8e2d0" stroke-width="3" stroke-dasharray="6 5"/>';
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#grain)"/>';
  })();
</script>
</body></html>
