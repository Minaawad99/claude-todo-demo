<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — mosquito</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* the reel cover, full bleed at TikTok's 1080×1920 (540×960 at 2x): a night room, one warm glow behind the mosquito,
     the titles on dark fades. Everything that matters stays inside the 3:4 crop (y 120–840) and off the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:158px;font:900 36px/1.3 'Noto Sans Arabic';color:#fff">بيشوفك إزاي في الضلمة؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">وليه بيقرصك إنت بالذات؟</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">مغري ليه <span style="color:#f2c230">100</span> مرة أكتر<br><span style="font-size:24px;color:#d9d4c8">والسر في ريحة جلدك، مش في دمك</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset=".45" stop-color="#1a2a40"/><stop offset=".7" stop-color="#16202f"/><stop offset="1" stop-color="#05070b"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd76a" stop-opacity=".95"/><stop offset=".55" stop-color="#f2a53a" stop-opacity=".55"/><stop offset="1" stop-color="#f2a53a" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".72"/><stop offset="1" stop-color="#000" stop-opacity=".96"/></linearGradient>
</defs></svg>
<script src="../../videos/mosquito/timing.js"></script>
<script src="../../videos/mosquito/sketch/scenes.js"></script>
<script>
  (function () {
    var t = 0.31, s = '<rect width="540" height="960" fill="url(#night)"/>', i;
    // a window with the moon far back, then the warm glow, smell rising off the skin, the mosquito feeding
    s += '<g opacity=".5"><rect x="40" y="300" width="120" height="150" fill="#2c4563" stroke="#0a0f18" stroke-width="5"/><path d="M100 300 V450 M40 375 H160" stroke="#0a0f18" stroke-width="4"/><circle cx="128" cy="336" r="16" fill="#d9dfe6"/></g>';
    s += '<circle cx="285" cy="470" r="250" fill="url(#warm)"/>';
    s += G("translate(-40 0)", fumes(310, 640, 520, 8, 300, t, "#f2c230", 1, 7), .5);
    s += skin(-60, 652, 700, 330, t, { hair: 30 });
    s += '<circle cx="197" cy="660" r="30" fill="none" stroke="#f2c230" stroke-width="4" stroke-dasharray="9 7"/>';
    s += mosq(300, 482, 2.65, t, { fly: false, bite: true, fed: .85 });
    for (i = 0; i < 3; i++) s += mosq([70, 455, 440][i], [540, 330, 590][i], [.5, .42, .36][i], t + i, { flip: i === 0, ph: i, op: .75 });
    var tag = function (txt, x, y, r, sz, col) { var w = txt.length * sz * .58 + 30; return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ')"><rect x="' + (-w / 2) + '" y="' + (-sz * .95) + '" width="' + w + '" height="' + (sz * 1.6) + '" rx="8" fill="' + (col || "#f2c230") + '" stroke="#2b2016" stroke-width="2.5"/><text y="' + (sz * .3) + '" text-anchor="middle" style="font:800 ' + sz + 'px Noto Sans Arabic;fill:#2b2016">' + txt + '</text></g>'; };
    s += tag("إنت بس!", 118, 600, -6, 22) + tag("أنثى بس اللي بتقرص", 330, 320, 4, 18, "#f4ecdb");
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#grain)"/>';
  })();
</script>
</body></html>
