<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — Warraq Ring Road fire (sketch style)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for the «اسكتش» choking video, full bleed 540×960 (1080×1920 at 2x): the tunnel-cover palette (near
     black top and bottom, one warm glow behind the subject) with the diagram look (the episode's own drawings: the overturned tanker burning on the Ring Road over the underpass, a man walking away into the wind; an inset of the engine bay where the creeping vapour meets a spark).
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:160px;font:900 41px/1.2 'Noto Sans Arabic';color:#fff">حريق دائري الوراق</p>
  <p class="t" style="top:216px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">إزاي النار مسكت في 20 عربية؟</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">لو حصل قدامك: <span style="color:#f2c230">ابعد واتصل</span><br><span style="font-size:24px;color:#d9d4c8">ومتقفش تصوّر</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="hatchW" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#fff" stroke-width="1" opacity=".25"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e2"/><stop offset=".5" stop-color="#d3d6d1"/><stop offset="1" stop-color="#c7cbc5"/></linearGradient>
  <radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
  <linearGradient id="rayCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8cc" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8cc" stop-opacity=".08"/></linearGradient>
</defs></svg>
<script src="../../videos/warraq-fire/timing.js"></script>
<script src="../../videos/_templates/people/person.js"></script>
<script src="../../videos/warraq-fire/sketch/draw.js"></script>
<script src="../../videos/warraq-fire/sketch/scenes.js"></script>
<script>
  (function () {
    var t = 60.3, s = "";
    window.__t = t;
    s += '<rect width="540" height="960" fill="#1b1d22"/><rect width="540" height="960" fill="url(#grid)" opacity=".18"/>';
    s += '<circle cx="300" cy="470" r="250" fill="#ffd27a" opacity=".32" filter="url(#soft)"/><circle cx="330" cy="500" r="150" fill="#ffe08a" opacity=".28" filter="url(#soft)"/>';
    // the Ring Road deck over the underpass, the overturned tanker burning, the smoke; a man walking away, into the wind
    var w = PERSON.walkPose(1.3, 1), po = { x: 20, s: .62, dir: -1, legs: w.legs, arms: w.arms, outfit: DRV, face: { eyes: 1, brows: "worried" } };
    po.y = PERSON.sideHipY(po, RD);
    s += '<g transform="translate(270 560) scale(.44) translate(-420 -430)">' + deckSide(RD, { lx: 160, tx: 330, x0: -300, x1: 1500 }) + place(380, RD, TLS, tankerLying({})) +
         glow(620, RD - 80, 380, 1) + smoke(620, RD - 160, 520, 420, t, 1, 18, 14) + fireRow(330, 990, RD, 120, t, 1) + fireRow(420, 900, RD - 250 * TLS, 90, t, 1) + '</g>';
    s += '<g transform="translate(270 560) scale(.44) translate(-420 -430)">' + PERSON.side(Object.assign({ breath: .5 }, po)).svg.replace('translate(96', 'translate(96') + '</g>';
    s += '<g transform="translate(270 560) scale(.44) translate(-420 -430)">' + windArrows(t, 300) + '</g>';
    // inset: the engine bay, the vapour under it and the spark
    var ix = 110, iy = 360;
    s += '<circle cx="' + ix + '" cy="' + iy + '" r="96" fill="#ffd27a" opacity=".25" filter="url(#soft)"/>' + inset(ix, iy, 82, '<g transform="scale(.3)">' + bayClose(t, 1, 1) + '</g>', 1);
    s += '<circle cx="' + ix + '" cy="' + iy + '" r="84" fill="none" stroke="#c4532c" stroke-width="4"/>';
    s += '<g transform="translate(110 470)"><rect x="-58" y="-20" width="116" height="34" rx="5" fill="#c4532c"/><text x="0" y="5" text-anchor="middle" style="font:800 19px Noto Sans Arabic;fill:#fff">البخار + شرارة</text></g>';
    s += '<g transform="translate(436 340)"><rect x="-66" y="-22" width="132" height="38" rx="5" fill="#f4ecdb" stroke="#2a2016" stroke-width="2"/><text x="-30" y="6" text-anchor="middle" style="font:800 22px Noto Serif;fill:#c4532c">180</text><text x="28" y="5" text-anchor="middle" style="font:800 15px Noto Sans Arabic;fill:#2a2016">المطافي</text></g>';
    s += '<g transform="translate(436 394)"><rect x="-66" y="-22" width="132" height="38" rx="5" fill="#f4ecdb" stroke="#2a2016" stroke-width="2"/><text x="-30" y="6" text-anchor="middle" style="font:800 22px Noto Serif;fill:#4a6f8a">123</text><text x="28" y="5" text-anchor="middle" style="font:800 15px Noto Sans Arabic;fill:#2a2016">الإسعاف</text></g>';
    s += '<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
         '<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient></defs>';
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
