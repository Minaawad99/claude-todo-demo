<!doctype html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8"><title>TikTok cover — TGV 320 km/h (diagram style, French)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@600;700;800;900&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
  /* the reel cover for the French «دايجرام» TGV video, full bleed 540×960 (1080×1920 at 2x): the video's own diagram look
     (cream graph paper, a ruled card, an isometric scene with hatching and leader-line labels, as the user asked) (the isometric TGV under its catenary, hatching, leader labels).
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #eee5d0; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #eee5d0; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:700 15px 'Noto Sans';color:#8a8070">Comment ça marche ?</p>
  <p class="t" style="top:156px;font:900 36px/1.15 'Noto Sans';color:#2b2b2b">Comment le TGV roule à <span style="color:#c4532c">320&nbsp;km/h</span>&nbsp;?</p>
  <p class="t" style="top:248px;font:800 22px/1.3 'Noto Sans';color:#6b7d3c">Sans quitter les rails !</p>
  <p class="t" style="top:726px;font:800 32px/1.35 'Noto Sans';color:#2b2b2b">Record : <span style="color:#c4532c">574,8</span> km/h<br><span style="font-size:21px;color:#6a6458">sur des rails en acier tout bêtes !</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="hatchW" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#fff" stroke-width="1" opacity=".25"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e2"/><stop offset=".5" stop-color="#d3d6d1"/><stop offset="1" stop-color="#c7cbc5"/></linearGradient>
  <radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
  <linearGradient id="rayCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8cc" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8cc" stop-opacity=".08"/></linearGradient>
</defs></svg>
<script src="../../videos/tgv-fr/timing.js"></script>
<script>window.CAPS = [];</script>
<script src="../../videos/tgv-fr/diagram/scenes.js"></script>
<script>
  (function () {
    var P = window.__parts, t = 20.4, s = "", INK = "#2b2b2b", PAPER = "#eee5d0";
    function lab(px, py, lx, ly, text, col, anchor) { return '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4.5" fill="' + col + '" stroke="' + INK + '" stroke-width="1.4"/><path d="M' + px.toFixed(1) + ' ' + py.toFixed(1) + ' L' + lx + ' ' + ly + '" stroke="' + INK + '" stroke-width="1.4"/>' +
      '<text x="' + (lx + (anchor === "end" ? -6 : anchor === "middle" ? 0 : 6)) + '" y="' + (anchor === "middle" ? ly - 10 : ly + 7) + '" text-anchor="' + anchor + '" style="font:800 21px Noto Sans;fill:' + col + '">' + text + '</text>'; }
    s += '<rect width="540" height="960" fill="' + PAPER + '"/><rect width="540" height="960" fill="url(#grid)"/>';
    s += '<clipPath id="sc"><rect x="0" y="300" width="540" height="404"/></clipPath><g clip-path="url(#sc)">';
    P.isoAt(118, 436, 0.95);
    // the line as a scale model on the table: a ground slab with hatched edges, fields, poplars, then the TGV under its catenary
    s += P.isoBox(-320, -80, -14, 900, 170, 14, ["#c5cb9e", "#b4b08e", "#a8a283"]);
    [[-40, -62], [60, -66], [470, 70], [300, 72], [-200, 70]].forEach(function (q) { s += P.isoCyl(q[0], q[1], 0, 3, 12, "#8a5a3c", "#8a5a3c"); var c = P.iso(q[0], q[1], 28); s += '<ellipse cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" rx="11" ry="20" fill="#8e9f6a" stroke="' + INK + '" stroke-width="1.6"/><ellipse cx="' + (c[0] + 4).toFixed(1) + '" cy="' + c[1].toFixed(1) + '" rx="6" ry="16" fill="url(#hatch)"/>'; });
    s += P.isoTrain(t, { sp: 90, volt: true, spark: true });
    var pt = P.iso(230, 15, 74), nose = P.iso(380, 15, 18), rail = P.iso(470, 26, 3);
    s += lab(pt[0], pt[1], 200, 372, "25 000 volts", "#c4532c", "middle");
    s += lab(nose[0], nose[1], 430, 400, "nez allongé", "#46698a", "middle") + lab(rail[0], rail[1], 330, 660, "rails soudés", "#6b7d3c", "end");
    s += '</g><path d="M60 298 H440 M60 706 H440" stroke="' + INK + '" stroke-width="1"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
