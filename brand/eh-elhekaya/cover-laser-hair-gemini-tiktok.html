<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — laser hair (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the laser-hair reel cover on the Gemini illustration the user made from our prompt (laser-hair-gemini-art.jpg,
     768×1376: the picture sits in y 300–1075, Gemini blurred it above and below). Full bleed 540×960 (1080×1920 at 2x).
     Text in our fonts and colours in the dark blurred bands; everything that matters stays inside y 120–840 and away
     from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 19px 'Noto Sans Arabic'; color: #fff; background: #c4532c; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
</style></head><body>
<div class="cover">
  <img class="art" src="laser-hair-gemini-art.jpg">
  <div class="fade" style="top:0;height:300px;background:linear-gradient(#000f 0%,#000e 50%,#000b 69%,#0006 80%,#0000)"></div>
  <div class="fade" style="top:680px;height:280px;background:linear-gradient(#0000,#0006 18%,#000c 30%,#000f 55%)"></div>
  <p class="t" style="top:96px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:124px;font:900 31px/1.25 'Noto Sans Arabic';color:#fff">ليه شعرك محتاج <span style="color:#f2c230">كذا جلسة</span><br>عشان يتشال؟</p>
  <p class="t" style="top:752px;font:800 33px/1.35 'Noto Sans Arabic';color:#fff">السر في <span style="color:#f2c230">البُصيلة</span><br><span style="font-size:24px;color:#d9d4c8">مش في الشعرة اللي باينة!</span></p>
</div>
</body></html>
