<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — phone in bed</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* «أوعى تمسك الموبايل في السرير» reel cover, full bleed 540×960 (1080×1920 at 2x). The tunnel-cover palette: dark top and
     bottom, one warm glow behind the main object. The main object is the episode's own drawing (videos/phone-bed/sketch):
     the head cut down the middle, the phone's blue light going into the eye, the brain's clock and the pineal gland.
     Everything that matters sits inside the 3:4 crop (y 120–840) and clear of TikTok's right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">أوعى تمسك الموبايل في السرير!</p>
  <p class="t" style="top:262px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">نور الشاشة بيضحك على مخك</p>
  <p class="t" style="top:732px;font:800 30px/1.35 'Noto Sans Arabic';color:#fff">هرمون الضلمة بيتأخر <span style="color:#f2c230">1.5</span> ساعة<br><span style="font-size:24px;color:#d9d4c8">وتصحى مكسّر حتى لو نمت كفاية</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset=".45" stop-color="#16243a"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2c230" stop-opacity=".55"/><stop offset=".6" stop-color="#d98a2a" stop-opacity=".18"/><stop offset="1" stop-color="#d98a2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fc8f0" stop-opacity=".75"/><stop offset="1" stop-color="#4a8fd0" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".96"/></linearGradient>
</defs></svg>
<script src="../../videos/phone-bed/timing.js"></script>
<script src="../../videos/phone-bed/sketch/scenes.js"></script>
<script>
  // the drawing at a still moment (t = 3 s); world 640×786 → cover, the head big in the middle
  var t = 3, s = '<rect width="540" height="960" fill="url(#night)"/>';
  s += '<ellipse cx="240" cy="480" rx="240" ry="240" fill="url(#warm)"/>';
  s += '<g transform="translate(-6 252) scale(.74)">' + headCut(t, { clockSun: true }) + '</g>';
  s += '<ellipse cx="438" cy="526" rx="110" ry="100" fill="url(#blue)"/>';
  s += '<g transform="translate(-6 252) scale(.74)">' + beam(640, 350, EYE[0] + 20, EYE[1], 150, 1.6, "#bfe2fa") + rays(600, 360, EYE[0] + 20, EYE[1], .25, 1, "#3d7fc0") + phone(600, 370, 1.0, 1, 0) +
       pulseAlong("M" + EYE[0] + " " + EYE[1] + " C450 400 420 430 " + CHIASM[0] + " " + CHIASM[1] + " L" + SCN[0] + " " + SCN[1], .3, ORANGE, 3, 1, .8) + cross(PINEAL[0], PINEAL[1], .9, 1) + '</g>';
  // a tag with the time: 2:00 at night
  s += '<g transform="translate(80 350) rotate(-6)"><rect x="-52" y="-30" width="104" height="54" rx="6" fill="#f4ecdb" stroke="#2a2016" stroke-width="2.4"/><text x="0" y="12" text-anchor="middle" style="font:800 32px Noto Serif;fill:#bd552f;direction:ltr">2:00</text></g>';
  s += '<rect width="540" height="330" fill="url(#fadeT)"/><rect y="660" width="540" height="300" fill="url(#fadeB)"/><rect width="540" height="960" filter="url(#grain)" opacity=".7"/>';
  document.getElementById("art").innerHTML = s;
</script>
</body></html>
