<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — feed</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* full-bleed reel cover, 540×960 (1080×1920 at 2x). Drawings come from the episode (videos/feed/sketch/scenes.js).
     Text keeps inside the 3:4 profile crop (y 120–840) and clear of TikTok's right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:152px;font:900 42px/1.25 'Noto Sans Arabic';color:#fff">التيك توك بيسمعك؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">عرف إنت عايز إيه إزاي؟</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">مش من <span style="color:#f2c230">المايك</span>…<br><span style="font-size:24px;color:#d9d4c8">من حاجة بتعملها كل يوم</span></p>
</div>
<script>window.TIMING = { lines: [{ start: 0, end: 1 }], duration: 1 };</script>
<script src="../../videos/feed/timing.js"></script>
<script src="../../videos/feed/sketch/scenes.js"></script>
<script>
var t = 2.2, s = '<defs>' +
  '<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset=".45" stop-color="#1f2c3c"/><stop offset=".75" stop-color="#18202a"/><stop offset="1" stop-color="#050608"/></linearGradient>' +
  '<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2c230" stop-opacity=".9"/><stop offset=".55" stop-color="#e09a2a" stop-opacity=".25"/><stop offset="1" stop-color="#e09a2a" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
  '<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>' +
  '<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter></defs>';
s += '<rect width="540" height="960" fill="url(#bg)"/>';
// faint feed cards floating behind, like a scrolling wall of videos
var cols = ["#5f8a4a", "#c8a774", "#9ab3c4", "#bd552f", "#6f8597", "#d9b44a"];
for (var i = 0; i < 16; i++) { var x = (i % 4) * 140 - 20 + (Math.floor(i / 4) % 2) * 50, y = 250 + Math.floor(i / 4) * 130;
  s += '<rect x="' + x + '" y="' + y + '" width="96" height="116" rx="10" fill="' + cols[i % 6] + '" opacity=".22" stroke="#000" stroke-opacity=".3"/>'; }
s += '<ellipse cx="270" cy="490" rx="290" ry="300" fill="url(#glow)"/>';
// the phone, tilted a little, on the TikTok screen with the sneakers video
s += '<g transform="rotate(-6 270 490)">' + phone(270, 490, 440, function (w, h) { return ttScreen(w, h, t, { kind: 5, liked: true, prog: .62 }); }, { mic: true }) + '</g>';
// left: the microphone, crossed out
s += '<g transform="translate(92 560)"><circle r="46" fill="#f4ecdb" stroke="#2a2016" stroke-width="3"/>' +
  '<rect x="-12" y="-30" width="24" height="38" rx="12" fill="#3a3632" stroke="#2a2016" stroke-width="2"/><path d="M-20 0 a20 20 0 0 0 40 0 M0 20 v12 M-12 32 h24" stroke="#2a2016" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>' + cross(92, 560, 1.15, 1);
// right: the stopwatch and the seconds it counts
s += '<g transform="translate(418 430)">' + watch(40, .62) + '</g><g transform="translate(418 500)"><rect x="-44" y="-22" width="88" height="40" fill="#f4ecdb" stroke="#2a2016" stroke-width="2.4"/>' + N("14s", 0, 10, 26, "#bd552f") + '</g>';
s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="660" width="540" height="300" fill="url(#fadeB)"/><rect width="540" height="960" filter="url(#grain)"/>';
document.getElementById("art").innerHTML = s;
</script>
</body></html>
