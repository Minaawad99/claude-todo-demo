<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Reel cover — Warraq Ring Road fire (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover on the user's Gemini illustration (warraq-fire-gemini-art.jpg, an illustration, not a photo of the event):
     the Gemini lettering at the top is covered by the dark top fade and replaced by our own text, as on the other covers.
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; font-family: 'Noto Sans Arabic'; }
  .bg { position: absolute; left: 0; top: 0; width: 540px; height: 967px; background: url(warraq-fire-gemini-art2-clean.jpg) center top / cover; }
  .fadeT { position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(rgba(0,0,0,.9) 0%, rgba(0,0,0,.8) 62%, rgba(0,0,0,.55) 84%, rgba(0,0,0,0) 100%); }
  .fadeB { position: absolute; left: 0; right: 0; top: 620px; height: 340px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75) 30%, #000 62%); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .y { color: #f2c230; }
  .num { display: inline-block; margin: 0 6px; padding: 2px 12px 4px; background: #f4ecdb; color: #2a2016; border: 2px solid #2a2016; border-radius: 5px; font: 800 17px 'Noto Sans Arabic'; text-shadow: none; }
  .num b { font: 800 20px 'Noto Serif'; color: #c4532c; margin-left: 6px; }
  .num b.bl { color: #4a6f8a; }
  .note { position: absolute; left: 14px; bottom: 132px; font: 600 10px 'Noto Sans Arabic'; color: rgba(255,255,255,.55); }
</style></head><body>
<div class="cover">
  <div class="bg"></div><div class="fadeT"></div><div class="fadeB"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:156px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">حريق دائري الوراق</p>
  <p class="t" style="top:214px;font:800 23px/1.35 'Noto Sans Arabic'"><span class="y">إزاي النار مسكت في 20 عربية… في ثواني؟</span></p>
  <p class="t" style="top:700px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">لو حصل قدامك: <span class="y">ابعد واتصل</span><br><span style="font-size:23px;color:#d9d4c8">ومتقفش تصوّر</span></p>
  <p class="t" style="top:800px"><span class="num"><b>180</b>المطافي</span><span class="num"><b class="bl">123</b>الإسعاف</span></p>
  <div class="note">صورة تعبيرية</div>
</div>
</body></html>
