<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — yawn</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for «ليه بنتاوب؟», full bleed at 1080×1920 (540×960 at 2x). A real yawn (a frame of the episode's
     Gemini clip, img/yawn-peak.jpg) in the tunnel-cover layout: near-black top and bottom, a warm glow behind the head,
     cool air drawn going into the mouth, titles on the fades. Everything that matters stays inside the 3:4 crop
     (y 120–840) and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #eadcc0; }
  .photo { position: absolute; left: 0; top: 150px; width: 540px; height: auto; filter: contrast(1.08) saturate(1.05); }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
  .tagw { position: absolute; font: 800 22px "Noto Sans Arabic"; color: #2b2016; padding: 4px 18px 6px; background: #f2c230; border-radius: 30px 8px 30px 8px; transform: rotate(-4deg); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
</style></head><body>
<div class="cover">
  <img class="photo" src="img/yawn-peak.jpg">
  <svg id="art" viewBox="0 0 540 960">
    <defs>
      <radialGradient id="glow" cx="300" cy="440" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd27a" stop-opacity=".45"/><stop offset=".55" stop-color="#f2a24a" stop-opacity=".12"/><stop offset="1" stop-color="#f2a24a" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx="290" cy="450" r="430" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#0d1620" stop-opacity="0"/><stop offset="1" stop-color="#0d1620" stop-opacity=".92"/></radialGradient>
      <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080c" stop-opacity=".97"/><stop offset=".75" stop-color="#05080c" stop-opacity=".6"/><stop offset="1" stop-color="#05080c" stop-opacity="0"/></linearGradient>
      <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080c" stop-opacity="0"/><stop offset=".3" stop-color="#05080c" stop-opacity=".75"/><stop offset="1" stop-color="#05080c" stop-opacity=".97"/></linearGradient>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .07 0"/></filter>
    </defs>
    <rect width="540" height="960" fill="url(#vig)"/>
    <rect width="540" height="960" fill="url(#glow)" style="mix-blend-mode:screen"/>
    <!-- cool air going into the open mouth (mouth ≈ 400, 592) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M520 560 l-16 16 l16 16 M482 572 l-14 14 l14 14 M448 582 l-12 11 l12 11" stroke="#0d1620" stroke-width="10"/>
      <path d="M520 560 l-16 16 l16 16 M482 572 l-14 14 l14 14 M448 582 l-12 11 l12 11" stroke="#9fd2f2" stroke-width="6"/>
    </g>
    <rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>
    <rect width="540" height="960" filter="url(#grain)"/>
  </svg>
  <div class="tagw" style="left:300px; top:648px; background:#bfe0ff">هوا أبرد</div>
  <div class="tagw" style="left:60px; top:330px;">لغز!</div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">ليه بنتاوب؟</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">حتى العلماء مش متأكدين!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">6</span> ثواني بتبرّد مخك<br><span style="font-size:24px;color:#d9d4c8">غالبًا… والعدوى لسه لغز!</span></p>
</div>
</body></html>
