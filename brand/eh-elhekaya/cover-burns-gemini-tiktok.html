<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — burns (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the burns reel cover on the channel's Gemini illustration (burns-gemini-art.jpg), full bleed 540×960 (1080×1920 at 2x).
     Text in our fonts and colours; everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 19px 'Noto Sans Arabic'; color: #fff; background: #4a6f8a; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
</style></head><body>
<div class="cover">
  <img class="art" src="burns-gemini-art.jpg">
  <div class="fade" style="top:0;height:250px;background:linear-gradient(#000e 0%,#0008 70%,#0000)"></div>
  <div class="fade" style="top:700px;height:260px;background:linear-gradient(#0000,#000b 35%,#000f)"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 35px/1.2 'Noto Sans Arabic';color:#fff">لو حد اتحرق قدامك…</p>
  <p class="t" style="top:204px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">أول 20 دقيقة هي اللي بتفرق!</p>
  <div class="tag" style="left:44px;top:494px;background:#c4532c">السخونة بتطلع</div>
  <p class="t" style="top:752px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">مية حنفية <span style="color:#f2c230">20</span> دقيقة<br><span style="font-size:24px;color:#d9d4c8">ولا تلج ولا معجون سنان!</span></p>
</div>
</body></html>
