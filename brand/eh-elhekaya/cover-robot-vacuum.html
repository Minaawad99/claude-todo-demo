<!doctype html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><title>Reel cover — robot vacuum</title>
<link rel="stylesheet" href="../../design-system/tokens.css"><link rel="stylesheet" href="../../design-system/components/bundle.css">
<style>
  /* 540×960 at 2x. Key content in y 120–760. The picture is the video's own scene, drawn live. */

  .iso-top { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; } .iso-x { fill: var(--khaki-deep); stroke: var(--ink); stroke-width: 1; } .iso-y { fill: var(--khaki); stroke: var(--ink); stroke-width: 1; }

  .iso-floor { fill: color-mix(in srgb, var(--paper-raised) 60%, var(--paper)); stroke: var(--ink); stroke-width: 1; } .iso-cut { fill: var(--khaki); stroke: var(--ink); stroke-width: 1; }

  .iso-thermo { fill: none; stroke: var(--heat); stroke-width: 3; stroke-linecap: round; } .iso-hot { fill: var(--heat); stroke: var(--ink); stroke-width: 1; }
  .iso-rug { fill: color-mix(in srgb, var(--heat) 22%, var(--paper-raised)); stroke: var(--ink); stroke-width: .8; }

  .iso-shade { fill: #f2dc85; stroke: var(--ink); stroke-width: 1; } .iso-shade-top { fill: #f8ecbf; stroke: var(--ink); stroke-width: 1; } .iso-glow { fill: #ffe9a0; mix-blend-mode: multiply; }

  .iso-comp { fill: #a5492e; stroke: var(--ink); stroke-width: 1.2; } .iso-comp-top { fill: #c46a46; stroke: var(--ink); stroke-width: 1.2; }

  .iso-cap { fill: #2f6f9f; stroke: var(--ink); stroke-width: 1; } .iso-cap-top { fill: #c0c4c8; stroke: var(--ink); stroke-width: 1; }
  .iso-wire-live { fill: none; stroke: #e2a92c; stroke-width: 3; stroke-dasharray: 6 5; stroke-linecap: round; } .iso-rotor { fill: none; stroke: var(--paper-raised); stroke-width: 3; stroke-linecap: round; }

  .chart .row { position: absolute; left: 6px; right: 6px; height: 34px; } .chart .row svg { position: absolute; inset: 0 0 0 58px; width: calc(100% - 58px); height: 100%; }
  .chart .row b { position: absolute; left: 0; top: 10px; font: 700 10px var(--font-sans); }
  .chart h4 { position: absolute; right: 6px; top: 2px; margin: 0; font: 700 10px var(--font-sans); }

  .rb-trail { fill: none; stroke: #8fb9d6; stroke-linecap: round; stroke-linejoin: round; mix-blend-mode: multiply; }
  .rb-dust { fill: #7a6a55; opacity: .65; }
  .rb-wood { fill: #a67b52; stroke: var(--ink); stroke-width: 1; } .rb-wood-x { fill: #8c6440; stroke: var(--ink); stroke-width: 1; } .rb-wood-top { fill: #c39a6e; stroke: var(--ink); stroke-width: 1; }
  .rb-chair { fill: #6f8f7a; stroke: var(--ink); stroke-width: 1; } .rb-chair-x { fill: #587663; stroke: var(--ink); stroke-width: 1; } .rb-chair-top { fill: #8eae98; stroke: var(--ink); stroke-width: 1; }

  .rb-dock { fill: #3b3832; stroke: var(--ink); stroke-width: 1; } .rb-dock-x { fill: #2b2924; stroke: var(--ink); stroke-width: 1; } .rb-dock-top { fill: #56524a; stroke: var(--ink); stroke-width: 1; }
  .rb-ir-win { fill: #6b1f28; stroke: var(--ink); stroke-width: .8; } .rb-contact { fill: #d8b25a; stroke: var(--ink); stroke-width: .6; }
  .rb-shadow { fill: var(--ink); opacity: .16; stroke: none; }

  .rb-turret { fill: #3e3b36; stroke: var(--ink); stroke-width: 1; } .rb-turret-top { fill: #67635b; stroke: var(--ink); stroke-width: 1; }

  .rb-brush { fill: none; stroke: #6a655c; stroke-width: 1.4; stroke-linecap: round; }
  .rb-laser { fill: none; stroke: #ff3b2f; stroke-width: 1.4; } .rb-hit { fill: #ff3b2f; stroke: var(--paper); stroke-width: .8; }

  .rb-beacon { fill: none; stroke: #b23a8a; stroke-width: 2; stroke-dasharray: 5 4; }
  .rb-x { fill: none; stroke: var(--heat); stroke-width: 3.2; stroke-linecap: round; } .rb-burst { stroke: var(--heat); stroke-width: 2.2; stroke-linecap: round; }
  .rb-mapveil { fill: #2b2620; stroke: none; } .rb-mappt { fill: #ff5a43; } .rb-nogo { fill: color-mix(in srgb, var(--water) 55%, transparent); stroke: var(--water); stroke-width: 2; }
  .rb-mapme { fill: #f4f2ec; stroke: var(--water); stroke-width: 2.4; } .rb-route { fill: none; stroke: #f4f2ec; stroke-width: 2.4; stroke-dasharray: 6 4; }
  .batt { position: absolute; left: 14px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--paper-raised); border: 1px solid var(--ink); opacity: 0; font: 700 14px var(--font-numeral); direction: ltr; }
  .batt i { display: block; width: 46px; height: 16px; border: 2px solid var(--ink); position: relative; } .batt i::after { content: ""; position: absolute; right: -6px; top: 3px; width: 3px; height: 6px; background: var(--ink); }
  .batt b { position: absolute; left: 1px; top: 1px; bottom: 1px; background: #4fbf6a; } .batt.low b { background: var(--heat); } .batt .bolt { color: #e2a92c; font-size: 16px; }

  .phone small { display: block; font: 600 10px var(--font-sans); color: var(--olive-text); } .phone p { margin: 2px 0 0; font: 700 15px var(--font-sans); }
  .zoom { position: absolute; left: 12px; top: 12px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper-raised); overflow: hidden; opacity: 0; box-shadow: 0 4px 0 rgba(43,38,32,.12); }
</style></head><body>
<div class="cover">
