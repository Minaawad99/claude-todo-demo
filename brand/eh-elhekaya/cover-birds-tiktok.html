<script>

    var cx = 270, cy = 520;

    for (var k = 0; k < 22; k++) { var a = k / 22 * Math.PI * 2, r = 205 + (k % 3) * 18, fx = cx + Math.cos(a) * r, fy = cy + Math.sin(a) * r * 0.8;

    // the bird, head-on: wings spread wide and up, primaries fanned, body, tail below, eyes on the viewer

      return g + '</g>';
    };
