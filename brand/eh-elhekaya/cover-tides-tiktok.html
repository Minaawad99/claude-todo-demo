<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — tides</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* «المد والجزر» reel cover, full bleed 540×960 (1080×1920 at 2x), the tunnel-cover palette: dark night sky at the top,
     dark sea at the bottom, one warm glow behind the Earth. The drawings are the episode's own (videos/tides/sketch):
     the real-coastline globe with its water bulge, the Moon, and the beach from the side at high water.
     Everything that matters stays inside the 3:4 crop (y 120–840) and away from TikTok's right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">البحر بيعلى لوحده!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">وينزل… من غير ريح ولا موج</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">القمر</span> بيمط الأرض كلها<br><span style="font-size:24px;color:#d9d4c8">مدّين وجزرين كل يوم</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2a2016" stroke-width="1" opacity=".15"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#e1d5ba" stroke-width="1.3" fill="none"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset=".35" stop-color="#0b1730"/><stop offset=".7" stop-color="#1b2f50"/><stop offset="1" stop-color="#0d1a2c"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset=".45" stop-color="#f2a640" stop-opacity=".35"/><stop offset="1" stop-color="#f2a640" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8" stop-opacity=".6"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
  <linearGradient id="nightSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244a66"/><stop offset="1" stop-color="#0a1828"/></linearGradient>
</defs></svg>
<script src="../../videos/tides/timing.js"></script>
<script src="../../videos/lib/geo.min.js"></script>
<script src="../../videos/tides/sketch/scenes.js"></script>
<script>
  (function () {
    var s = '<rect width="540" height="960" fill="url(#sky)"/>';
    for (var i = 0; i < 70; i++) { var x = hash(i) * 540, y = hash(i + 99) * 520, r = .5 + hash(i + 7) * 1.3; s += '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r) + '" fill="#fff" opacity="' + f(.25 + hash(i + 3) * .6) + '"/>'; }
    // the warm glow, then the Earth with its two water bulges stretched toward the Moon
    s += '<circle cx="250" cy="455" r="250" fill="url(#warm)"/>';
    s += bulge(250, 455, 150, 1, -14) + globe(250, 455, 150, 18, 6);
    // the Moon top right, glowing, with the pull line to the near bulge and the distance tag
    s += '<circle cx="455" cy="330" r="70" fill="url(#moonGlow)"/>' + moon(455, 330, 34);
    s += '<path d="M418 342 L400 352" stroke="#f2c230" stroke-width="4" stroke-linecap="round"/><path d="M394 355 l14 -2 l-8 -10 Z" fill="#f2c230"/>';
    s += '<g transform="translate(372 270) rotate(-6)"><rect x="-62" y="-20" width="124" height="34" rx="6" fill="#f2c230" stroke="#2a2016" stroke-width="2"/><text x="0" y="5" text-anchor="middle" style="font:800 19px Noto Serif;fill:#2a2016;direction:ltr">384,000 km</text></g>';
    // a dark sea under the Earth, the Moon's light laid on it as broken streaks
    var sea = '<rect x="0" y="640" width="540" height="320" fill="url(#nightSea)"/><path d="M0 640 H540" stroke="#4a7090" stroke-width="2"/>';
    for (var k = 0; k < 16; k++) { var yy = 652 + k * 12, w = 90 - k * 3.5; sea += '<path d="M' + f(455 - w / 2 + (k % 2) * 8) + ' ' + yy + ' h' + f(w) + '" stroke="#fff3c8" stroke-width="2.5" stroke-linecap="round" opacity="' + f(.55 - k * .03) + '"/>'; }
    for (k = 0; k < 9; k++) sea += '<path d="M' + f(30 + hash(k + 50) * 380) + ' ' + f(670 + hash(k + 60) * 150) + ' q12 -5 24 0" stroke="#7fa3bd" stroke-width="2" fill="none" opacity=".5"/>';
    s = s.replace('<circle cx="250" cy="455" r="250" fill="url(#warm)"/>', sea + '<circle cx="250" cy="455" r="250" fill="url(#warm)"/>');
    s += '<g transform="translate(330 612) rotate(-4)"><rect x="-70" y="-20" width="140" height="34" rx="6" fill="#f4ecdb" stroke="#2a2016" stroke-width="2"/><text x="0" y="6" text-anchor="middle" style="font:800 19px Noto Sans Arabic;fill:#4a6f8a">المية بتعلى ↑</text></g>';
    // fades for the text, film grain
    s += '<rect width="540" height="320" fill="url(#fadeT)"/><rect y="660" width="540" height="300" fill="url(#fadeB)"/><rect width="540" height="960" filter="url(#grain)"/>';
    document.getElementById("art").innerHTML = s;
  })();
</script>
</body></html>
