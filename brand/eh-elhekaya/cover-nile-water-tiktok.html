<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — Nile water</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover, full bleed at TikTok's 1080×1920 (540×960 at 2x): a real-looking kitchen tap whose pipe runs straight down
     into the Nile. Everything that matters stays inside the 3:4 profile-grid crop (y 120–840) and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #0d1a33; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 360 640"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9e6f5">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">من النيل لحنفيتك؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#ff9f43">وإزاي بتتفلتر؟</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#ff9f43">60%</span> من ميتها جاية من إثيوبيا<br><span style="font-size:24px;color:#d9e6f5">وقبل ما توصلك بتعدي على فلاتر كتير!</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .07 0"/></filter>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9e0"/><stop offset=".6" stop-color="#8fd6f2"/><stop offset="1" stop-color="#d9f3ff"/></linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f7a"/><stop offset=".55" stop-color="#e0717a"/><stop offset="1" stop-color="#ffb07a"/></linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1a3c"/><stop offset="1" stop-color="#1f4f7a"/></linearGradient>
  <linearGradient id="tileG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e6f8f"/><stop offset="1" stop-color="#15506b"/></linearGradient>
  <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb0e6"/><stop offset=".6" stop-color="#1f7fbf"/><stop offset="1" stop-color="#14588a"/></linearGradient>
  <linearGradient id="mudG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4965f"/><stop offset="1" stop-color="#7a4f2a"/></linearGradient>
  <linearGradient id="soilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6b3c"/><stop offset="1" stop-color="#4e3420"/></linearGradient>
  <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bd389"/><stop offset="1" stop-color="#3f9a55"/></linearGradient>
  <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc27a"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
  <linearGradient id="steelG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8896"/><stop offset=".5" stop-color="#e6ecf2"/><stop offset="1" stop-color="#7d8896"/></linearGradient>
  <linearGradient id="concG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c3cf"/><stop offset="1" stop-color="#6d7a8a"/></linearGradient>
</defs></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1a33" stop-opacity=".97"/><stop offset=".7" stop-color="#0d1a33" stop-opacity=".6"/><stop offset="1" stop-color="#0d1a33" stop-opacity="0"/></linearGradient>
<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1a33" stop-opacity="0"/><stop offset=".35" stop-color="#0d1a33" stop-opacity=".75"/><stop offset="1" stop-color="#0d1a33" stop-opacity=".97"/></linearGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs></svg>
<script src="../../videos/nile-water/timing.js"></script>
<script src="../../videos/nile-water/cartoon/scenes.js"></script>
<script>
  (function () {
    var P = window.__parts, t = 3.2, s = "";
    // dusk over Cairo, the Nile below with palms and a felucca
    s += '<rect x="0" y="0" width="360" height="640" fill="url(#skyDusk)"/>' + P.skyline(470, t);
    s += '<rect x="0" y="460" width="360" height="22" fill="url(#grassG)"/>' + P.water(t, 480) + P.felucca(275, 545, 1.0, t) + P.palm(28, 484, 1.0, t) + P.palm(338, 484, 0.85, t + 1);
    // the warm glow, the counter, the tap, the glass
    s += '<circle cx="180" cy="320" r="170" fill="url(#warm)"/>';
    s += '<rect x="30" y="380" width="300" height="16" rx="4" fill="#eef2f6" stroke="#fff" stroke-width="3"/><rect x="40" y="396" width="280" height="10" fill="#c9d3dd"/>';
    // the pipe from under the counter straight down into the river, water climbing up it
    s += P.pipe([[110, 404], [110, 505]], 16) + P.flow(t, [[110, 505], [110, 404]], "#bfeaff", 6, 0.6, 4);
    s += '<ellipse cx="110" cy="507" rx="22" ry="6" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>';
    s += P.faucet(110, 382, 1.1, t) + P.stream(205, 281, 356, t, 12) + P.glass(205, 380, 60, 78, 0.72, "rgba(120,200,240,.85)", t) + P.splash(205, 340, t);
    s += P.spark(270, 290, t, "#fff") + P.spark(60, 300, t + 2, "#ffd166");
    s += '<rect y="0" width="360" height="200" fill="url(#fadeT)"/><rect y="470" width="360" height="170" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="360" height="640" filter="url(#grain)"/>';
  })();
</script>
</body></html>
