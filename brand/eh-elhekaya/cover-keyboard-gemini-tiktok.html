<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — keyboard (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* reel cover for «ليه حروف الكيبورد مش بالترتيب؟», 540×960 (1080×1920 at 2x). The art (two keyboards, QWERTY over A B C)
     was generated in Gemini by the channel owner from our prompt; the missing Z (top) and R (bottom) were drawn in by hand.
     Text stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; left: 0; top: -4px; width: 540px; height: 968px; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <img class="art" src="keyboard-gemini-art.png">
  <div class="fade" style="top:0;height:250px;background:linear-gradient(#000e,#0000)"></div>
  <div class="fade" style="bottom:0;height:260px;background:linear-gradient(#0000,#000e)"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 37px/1.2 'Noto Sans Arabic';color:#fff">ليه الحروف مش مترتبة؟</p>
  <p class="t" style="top:206px;font:800 26px/1.3 'Noto Sans Arabic';color:#f2c230"><span dir="ltr">A B C D</span> زي ما اتعلمناها!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">كانت <span style="color:#f2c230">بالترتيب</span> فعلًا!<br><span style="font-size:24px;color:#d9d4c8">لحد ما حصلت الزنقة</span></p>
</div>
</body></html>
