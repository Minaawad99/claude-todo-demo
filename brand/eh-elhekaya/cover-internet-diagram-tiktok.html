<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — internet (diagram style)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for the «دايجرام» internet video, full bleed 540×960 (1080×1920 at 2x): the tunnel-cover palette (near
     black top and bottom, one warm glow behind the subject) with the diagram look (olive plate, X-ray print, leader labels).
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:160px;font:900 38px/1.2 'Noto Sans Arabic';color:#fff">إزاي الإنترنت بيشتغل؟</p>
  <p class="t" style="top:220px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">صورتك بتلف الدنيا!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">رحلة <span style="color:#f2c230">آلاف الكيلومترات</span><br><span style="font-size:24px;color:#d9d4c8">في أقل من ثانية… وتحت البحر!</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="hatchW" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#fff" stroke-width="1" opacity=".25"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e2"/><stop offset=".5" stop-color="#d3d6d1"/><stop offset="1" stop-color="#c7cbc5"/></linearGradient>
  <radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
  <linearGradient id="rayCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8cc" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8cc" stop-opacity=".08"/></linearGradient>
</defs></svg>
<script src="../../videos/internet-diagram/timing.js"></script>
<script>window.CAPS = [];</script>
<script src="../../videos/internet-diagram/diagram/scenes.js"></script>
<script>
  (function () {
    var P = window.__parts, G0 = P.GEO.globe, t = 70.0, s = "", INK = "#2b2b2b";
    var CX = 270, CY = 470, RG = 205, Z = RG / 340, TX = CX - 320 * Z, TY = CY - 430 * Z;
    var map = function (q) { return [TX + q[0] * Z, TY + q[1] * Z]; };
    s += '<rect width="540" height="960" fill="#11151b"/><rect width="540" height="960" fill="url(#grid)" opacity=".1"/>';
    for (var i = 0; i < 70; i++) { var h1 = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1, h2 = Math.abs(Math.sin(i * 78.233) * 12345.678) % 1; s += '<circle cx="' + (h1 * 540).toFixed(1) + '" cy="' + (120 + h2 * 720).toFixed(1) + '" r="' + (0.6 + (i % 3) * 0.5) + '" fill="#efe6d2" opacity="' + (0.25 + (i % 4) * 0.12) + '"/>'; }
    s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (RG + 70) + '" fill="#ffd27a" opacity=".28" filter="url(#soft)"/>';
    // the long orbit the photo takes around the world: back half behind the globe, front half in front
    var ORB = function (th) { var a = -22 * Math.PI / 180, x = 255 * Math.cos(th), y = 92 * Math.sin(th); return [CX + x * Math.cos(a) - y * Math.sin(a), CY + 10 + x * Math.sin(a) + y * Math.cos(a)]; };
    var arc = function (t0, t1) { var d = ""; for (var k = 0; k <= 60; k++) { var q = ORB(t0 + (t1 - t0) * k / 60); d += (k ? " L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); } return d; };
    var glowPath = function (d, op) { return '<path d="' + d + '" stroke="#9fc3dc" stroke-width="14" fill="none" opacity="' + (0.18 * op) + '" stroke-linecap="round"/><path d="' + d + '" stroke="#fff6d8" stroke-width="3.2" fill="none" stroke-dasharray="2 9" stroke-linecap="round" opacity="' + op + '"/>'; };
    s += glowPath(arc(Math.PI, 2 * Math.PI), 0.45);
    // the globe: real land, graticule, cables, night-side hatching
    s += '<g transform="translate(' + TX.toFixed(2) + ' ' + TY.toFixed(2) + ') scale(' + Z.toFixed(4) + ')">';
    s += '<path d="' + G0.sphere + '" fill="#b9bfbb" stroke="' + INK + '" stroke-width="4"/><path d="' + G0.grat + '" fill="none" stroke="#9aa39f" stroke-width="1.4" opacity=".7"/>';
    s += '<path d="' + G0.land + '" fill="#c5cb9e" stroke="' + INK + '" stroke-width="2"/>';
    s += '<clipPath id="sphC"><path d="' + G0.sphere + '"/></clipPath><path d="M320 90 A340 340 0 1 1 319.9 90 Z M290 60 A350 350 0 1 0 290.1 60 Z" fill="url(#hatch)" fill-rule="evenodd" clip-path="url(#sphC)"/>';
    s += '<path d="M320 90 A340 340 0 1 1 319.9 90 Z M300 70 A360 360 0 1 0 300.1 70 Z" fill="#11151b" opacity=".28" fill-rule="evenodd" clip-path="url(#sphC)"/>';
    G0.other.forEach(function (p) { s += P.cable(p, 1, "#6b7d3c", 6); });
    s += '<path d="' + P.pd(P.ROUTE) + '" stroke="#9fc3dc" stroke-width="22" fill="none" opacity=".35" stroke-linecap="round"/>' + P.cable(P.ROUTE, 1, "#4f7a9a", 8) + P.beads(P.ROUTE, 1, 0.3, 8, "#9fc3dc");
    s += P.pin(G0.pts.CAI[0], G0.pts.CAI[1], 1, 16) + P.pin(G0.pts.FRA[0], G0.pts.FRA[1], 1, 16) + '</g>';
    var cai = map(G0.pts.CAI), fra = map(G0.pts.FRA);
    var tag = function (x, y, txt, w) { return '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><rect x="' + (-w / 2) + '" y="-17" width="' + w + '" height="32" rx="6" fill="#2b2b2b" stroke="#efe6d2" stroke-width="1.5"/><text x="0" y="6" text-anchor="middle" style="font:800 17px Noto Sans Arabic;fill:#fff">' + txt + '</text></g>'; };
    s += '<path d="M' + cai[0].toFixed(1) + ' ' + cai[1].toFixed(1) + ' L' + (cai[0] + 40).toFixed(1) + ' ' + (cai[1] - 40).toFixed(1) + '" stroke="#efe6d2" stroke-width="1.6"/>' + tag(cai[0] + 52, cai[1] - 52, "مصر", 58);
    s += '<path d="M' + fra[0].toFixed(1) + ' ' + fra[1].toFixed(1) + ' L' + (fra[0] - 40).toFixed(1) + ' ' + (fra[1] - 40).toFixed(1) + '" stroke="#efe6d2" stroke-width="1.6"/>' + tag(fra[0] - 56, fra[1] - 52, "ألمانيا", 76);
    // front half of the orbit, packets trailing the photo
    s += glowPath(arc(0, Math.PI), 1);
    for (var k = 0; k < 6; k++) { var q = ORB(0.3 + k * 0.3); s += P.pkt(q[0], q[1], 0.62 - k * 0.04, null, -18 + k * 9, 1 - k * 0.11); }
    // the photo itself at the head of the trail, with speed lines
    var hp = ORB(2.42), ph = '<rect x="-62" y="-80" width="124" height="160" rx="6" fill="#f4efe0" stroke="' + INK + '" stroke-width="2.6"/><g transform="translate(-52 -70)"><clipPath id="cph"><rect width="104" height="118" rx="3"/></clipPath><g clip-path="url(#cph)">' + P.photo(104, 118, t, 0) + '</g><rect width="104" height="118" rx="3" fill="none" stroke="' + INK + '" stroke-width="1.6"/></g>';
    for (var l = 0; l < 3; l++) s += '<path d="M' + (hp[0] + 70 + l * 6).toFixed(1) + ' ' + (hp[1] - 30 + l * 26).toFixed(1) + ' l' + (60 - l * 12) + ' ' + (-14 + l * 2) + '" stroke="#fff6d8" stroke-width="3" stroke-linecap="round" opacity="' + (0.8 - l * 0.2) + '"/>';
    s += '<g transform="translate(' + hp[0].toFixed(1) + ' ' + hp[1].toFixed(1) + ') rotate(-12) scale(.86)">' + '<rect x="-70" y="-88" width="140" height="176" rx="10" fill="#fff6d8" opacity=".25" filter="url(#soft2)"/>' + ph + '</g>';
    s += '<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
         '<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient></defs>';
    s += '<rect width="540" height="290" fill="url(#fadeT)"/><rect y="690" width="540" height="270" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
