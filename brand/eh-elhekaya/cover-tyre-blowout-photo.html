<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Reel cover — tyre blowout (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for «الكاوتش ضرب» from the channel's Gemini picture (img/tyre-blowout-gemini.jpg, cropped above the
     seam at 942 px): the picture fills the top, its road fades into near black below, the text is ours.
     Full bleed 540×960 (1080×1920 at 2x); everything that matters stays inside y 120–840. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #0d0c0b; }
  .photo { position: absolute; left: 0; top: 0; width: 540px; height: 662px; background: url(img/tyre-blowout-gemini.jpg) center top / cover no-repeat; }
  .fadeB { position: absolute; left: 0; right: 0; top: 520px; height: 150px; background: linear-gradient(to bottom, rgba(13,12,11,0), #0d0c0b); }
  .fadeT { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .ring { position: absolute; left: 196px; top: 420px; width: 150px; height: 150px; border-radius: 50%; border: 5px solid #f2c230; box-shadow: 0 0 24px rgba(242,194,48,.55); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 12px rgba(0,0,0,.75); }
</style></head><body>
<div class="cover">
  <div class="photo"></div><div class="fadeT"></div><div class="fadeB"></div><div class="ring"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#e6dfd2">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 44px/1.2 'Noto Sans Arabic';color:#fff">اوعى تدوس فرامل!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">لو الكاوتش ضرب على الطريق السريع</p>
  <p class="t" style="top:712px;font:800 30px/1.35 'Noto Sans Arabic';color:#fff">امسك جامد و<span style="color:#f2c230">شيل رجلك</span> بالراحة<br><span style="font-size:22px;color:#d9d4c8">والفرامل في الآخر خالص، تحت 50</span></p>
</div>
</body></html>
