<!doctype html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><title>Reel cover — phone call</title>
<link rel="stylesheet" href="../../design-system/tokens.css"><link rel="stylesheet" href="../../design-system/components/bundle.css">
<style>
  /* 540×960 at 2x. Key content in y 120–760. A hand-held phone, its radio waves to a rooftop tower, and the street cut open to the glowing fibre underneath. */
  body { margin: 0; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: var(--font-sans); color: var(--ink); background: var(--paper); }
  .shot { position: absolute; left: 30px; right: 30px; top: 286px; height: 420px; border: 2px solid var(--ink); overflow: hidden; }
  .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .t { position: absolute; left: 0; right: 0; text-align: center; margin: 0; }
</style></head><body>
<div class="cover">
  <svg width="0" height="0" style="position:absolute"><defs><g id="mark"><rect x="84" y="4" width="32" height="10" style="fill:var(--ink)"/><rect x="94" y="14" width="12" height="14" style="fill:var(--ink)"/>
    <path style="fill:var(--ink)" d="M30 40 H182 V150 H96 L60 186 V150 H30 Z" transform="translate(8 8)"/><path style="fill:var(--paper-raised);stroke:var(--ink);stroke-width:7;stroke-linejoin:round" d="M30 40 H182 V150 H96 L60 186 V150 H30 Z"/>
    <text x="106" y="140" text-anchor="middle" style="font:800 120px var(--font-sans);fill:var(--heat)">؟</text></g></defs></svg>
  <div class="t" style="top:128px;display:flex;justify-content:center;align-items:center;gap:8px;font:700 17px var(--font-sans)"><svg width="26" height="26" viewBox="0 0 200 200"><use href="#mark"/></svg>إيه الحكاية؟</div>
  <p class="t" style="top:160px;font:800 42px/1.25 var(--font-sans)">صوتك بيروح <span style="color:var(--heat-text)">فين</span>؟</p>
  <p class="t" style="top:224px;font:700 21px/1.4 var(--font-sans);color:var(--ink-muted)">مش في الهوا… <span style="color:#c86a0e">تحت الأرض!</span></p>
  <div class="shot"><svg viewBox="0 0 480 420">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e48f5a"/><stop offset=".5" stop-color="#f4c08a"/><stop offset="1" stop-color="#fae2bd"/></linearGradient>
      <linearGradient id="bldF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98d6c"/><stop offset="1" stop-color="#946a4d"/></linearGradient>
      <linearGradient id="bldS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a563d"/><stop offset="1" stop-color="#5e412e"/></linearGradient>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a07a55"/><stop offset="1" stop-color="#6e5038"/></linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f5b56"/><stop offset="1" stop-color="#45423e"/></linearGradient>
      <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset=".5" stop-color="#2b2f34"/><stop offset="1" stop-color="#16181b"/></linearGradient>
      <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1d21"/><stop offset=".5" stop-color="#3a3e45"/><stop offset="1" stop-color="#15171a"/></linearGradient>
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20324a"/><stop offset="1" stop-color="#0f1826"/></linearGradient>
      <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2b48e"/><stop offset="1" stop-color="#b9845e"/></linearGradient>
      <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f5873"/><stop offset="1" stop-color="#3f6f8f"/></linearGradient>
      <linearGradient id="mast" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a8f96"/><stop offset="1" stop-color="#55595f"/></linearGradient>
      <radialGradient id="glowO"><stop offset="0" stop-color="#ffb347" stop-opacity=".95"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowR"><stop offset="0" stop-color="#ff3b2f" stop-opacity=".9"/><stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/></radialGradient>
      <radialGradient id="sun"><stop offset="0" stop-color="#fff6e0"/><stop offset=".5" stop-color="#ffe2a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter><filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="scr"><rect x="-58" y="-112" width="116" height="226" rx="14"/></clipPath>
    </defs>
    <!-- dusk sky + far city -->
    <rect width="480" height="300" fill="url(#sky)"/>
    <circle cx="140" cy="120" r="70" fill="url(#sun)"/>
    <g fill="#d8a582" opacity=".75"><path d="M0 250 V196 h28 v-26 h22 v26 h18 v-44 h30 v44 h22 v-18 h34 v18 h16 v-34 h26 v34 h30 v-22 h40 v22 h26 v-52 h28 v52 h30 v-28 h34 v28 h30 v-36 h24 v36 h46 V250 Z"/></g>
    <g fill="#f6d79a" opacity=".8"><rect x="36" y="180" width="5" height="7"/><rect x="80" y="166" width="5" height="7"/><rect x="88" y="180" width="5" height="7"/><rect x="190" y="178" width="5" height="7"/><rect x="292" y="160" width="5" height="7"/><rect x="300" y="174" width="5" height="7"/><rect x="420" y="176" width="5" height="7"/></g>
    <!-- the rooftop building with the tower (right) -->
    <path d="M300 300 V196 H452 V300 Z" fill="url(#bldF)" stroke="#2b2620" stroke-width="1.4"/><path d="M452 300 V196 L480 182 V300 Z" fill="url(#bldS)" stroke="#2b2620" stroke-width="1.4"/><path d="M300 196 L328 182 H480 L452 196 Z" fill="#c9b493" stroke="#2b2620" stroke-width="1.4"/>
    <g fill="#f4d77a" stroke="#5b4636" stroke-width=".8"><rect x="314" y="214" width="20" height="16"/><rect x="346" y="214" width="20" height="16" fill="#9cb3c4"/><rect x="378" y="214" width="20" height="16"/><rect x="410" y="214" width="20" height="16" fill="#9cb3c4"/><rect x="314" y="246" width="20" height="16" fill="#9cb3c4"/><rect x="346" y="246" width="20" height="16"/><rect x="378" y="246" width="20" height="16"/><rect x="410" y="246" width="20" height="16" fill="#9cb3c4"/></g>
    <!-- lattice tower -->
    <g stroke="url(#mast)" stroke-width="3.2" fill="none" stroke-linejoin="round"><path d="M372 188 L390 50 L408 188"/><path d="M378 150 L402 120 M402 150 L378 120 M382 110 L398 86 M398 110 L382 86 M386 76 L394 60 M394 76 L386 60"/></g>
    <g stroke="#2b2620" stroke-width="1"><rect x="372" y="44" width="10" height="30" rx="2" fill="#f1ece2"/><rect x="386" y="38" width="10" height="32" rx="2" fill="#e6e0d3"/><rect x="400" y="44" width="10" height="30" rx="2" fill="#f1ece2"/></g>
    <circle cx="391" cy="32" r="14" fill="url(#glowR)"/><circle cx="391" cy="32" r="3.4" fill="#ff5a4a"/>
    <!-- radio waves: phone → tower -->
    <g fill="none" stroke="#e08a1e" stroke-linecap="round">
      <path d="M210 120 Q240 92 230 64" stroke-width="5" opacity=".95"/><path d="M246 112 Q284 74 270 38" stroke-width="5" opacity=".8"/><path d="M284 104 Q328 58 312 16" stroke-width="5" opacity=".6"/><path d="M322 96 Q370 46 352 2" stroke-width="5" opacity=".42"/>
    </g>
    <g fill="none" stroke="#ffb347" stroke-width="12" opacity=".18" filter="url(#blur2)"><path d="M246 112 Q284 74 270 38"/><path d="M284 104 Q328 58 312 16"/></g>
    <!-- street + the cut through the ground -->
    <rect y="300" width="480" height="22" fill="url(#road)"/><g fill="#f4f1ea"><rect x="20" y="309" width="34" height="4"/><rect x="96" y="309" width="34" height="4"/><rect x="172" y="309" width="34" height="4"/><rect x="248" y="309" width="34" height="4"/><rect x="324" y="309" width="34" height="4"/><rect x="400" y="309" width="34" height="4"/></g>
    <rect y="322" width="480" height="98" fill="url(#soil)"/><path d="M0 322 H480" stroke="#2b2620" stroke-width="2"/>
    <g fill="#5d432e" opacity=".7"><circle cx="40" cy="344" r="4"/><circle cx="120" cy="404" r="5"/><circle cx="210" cy="340" r="3"/><circle cx="300" cy="410" r="4"/><circle cx="440" cy="346" r="5"/><circle cx="470" cy="400" r="3"/></g>
    <!-- the tower's cable going down into the ground -->
    <path d="M391 188 V300 M391 300 V368" stroke="#ffb347" stroke-width="3" stroke-dasharray="6 5" opacity=".9"/>
    <!-- fibre cable with glowing strands -->
    <rect x="-10" y="350" width="420" height="36" rx="18" fill="url(#cable)" stroke="#121314" stroke-width="1.5"/>
    <path d="M400 368 Q420 368 420 368" stroke="#2b2f34" stroke-width="36" stroke-linecap="round"/>
    <g transform="translate(420 368)"><circle r="20" fill="#2b2f34" stroke="#121314" stroke-width="1.5"/>
      <g fill="#cfe7f2" stroke="#8fc2da" stroke-width=".8"><circle cx="-8" cy="-7" r="4.6"/><circle cx="5" cy="-10" r="4.6"/><circle cx="11" cy="2" r="4.6"/><circle cx="2" cy="10" r="4.6"/><circle cx="-10" cy="6" r="4.6"/><circle cx="0" cy="0" r="4.6"/></g>
      <g fill="#ffb347"><circle cx="-8" cy="-7" r="2"/><circle cx="11" cy="2" r="2"/><circle cx="0" cy="0" r="2"/><circle cx="-10" cy="6" r="2"/></g></g>
    <g stroke-linecap="round"><path d="M10 360 H400" stroke="#ffb347" stroke-width="2" opacity=".35"/><path d="M10 368 H400" stroke="#ffb347" stroke-width="2" opacity=".35"/><path d="M10 376 H400" stroke="#ffb347" stroke-width="2" opacity=".35"/></g>
    <g fill="url(#glowO)"><circle cx="70" cy="360" r="14"/><circle cx="150" cy="376" r="14"/><circle cx="230" cy="368" r="14"/><circle cx="300" cy="360" r="14"/><circle cx="360" cy="376" r="14"/></g>
    <g fill="#fff"><circle cx="70" cy="360" r="3"/><circle cx="150" cy="376" r="3"/><circle cx="230" cy="368" r="3"/><circle cx="300" cy="360" r="3"/><circle cx="360" cy="376" r="3"/></g>
    <!-- the hand holding the phone (front-left) -->
    <g transform="translate(130 196) rotate(-12)">
      <ellipse cx="10" cy="128" rx="60" ry="16" fill="#2b2620" opacity=".25" filter="url(#blur)"/>
      <path d="M-46 250 C-50 190 -40 150 -20 120 L40 120 C56 150 64 190 64 250 Z" fill="url(#sleeve)" stroke="#1c1c1c" stroke-width="2"/>
      <rect x="-62" y="-118" width="124" height="238" rx="20" fill="url(#phoneBody)" stroke="#0c0d0f" stroke-width="2"/>
      <rect x="-58" y="-112" width="116" height="226" rx="14" fill="url(#screen)"/>
      <g clip-path="url(#scr)">
        <text x="0" y="-70" text-anchor="middle" style="font:600 11px var(--font-sans);fill:#9fb4cc">مكالمة جارية</text>
        <circle cx="0" cy="-30" r="24" fill="#3a5578"/><circle cx="0" cy="-36" r="9" fill="#c9d6e6"/><path d="M-15 -14 C-12 -24 12 -24 15 -14" fill="#c9d6e6"/>
        <text x="0" y="12" text-anchor="middle" style="font:800 19px var(--font-sans);fill:#fff">ماما</text>
        <text x="0" y="32" text-anchor="middle" style="font:600 12px var(--font-numeral);fill:#7fe3a0;direction:ltr">00:12</text>
        <g transform="translate(0 52)"><path d="M-40 0 Q-30 -10 -20 0 Q-10 10 0 0 Q10 -10 20 0 Q30 10 40 0" stroke="#e08a1e" stroke-width="2.4" fill="none"/></g>
        <circle cx="-26" cy="88" r="12" fill="#3a4a60"/><circle cx="26" cy="88" r="12" fill="#e2453c"/><path d="M20 90 q6 -6 12 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <rect x="-58" y="-112" width="116" height="226" fill="url(#glare)"/>
      </g>
      <rect x="-14" y="-108" width="28" height="7" rx="3.5" fill="#0c0d0f"/>
      <circle cx="0" cy="-122" r="16" fill="url(#glowO)"/>
      <!-- fingers wrapping the phone -->
      <path d="M-62 40 C-80 44 -84 66 -66 72 C-80 78 -82 98 -64 102" fill="none" stroke="#1c1c1c" stroke-width="2"/>
      <path d="M-62 34 C-82 38 -86 66 -66 72 C-82 78 -84 100 -62 106 L-56 106 L-56 34 Z" fill="url(#skin)"/>
      <path d="M62 60 C80 54 90 80 70 96 C78 108 70 126 50 124 L40 120 L56 60 Z" fill="url(#skin)" stroke="#1c1c1c" stroke-width="2"/>
      <path d="M-62 34 C-82 38 -86 66 -66 72 C-82 78 -84 100 -62 106" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    </g>
    <!-- labels -->
    <g style="font:800 15px var(--font-sans);paint-order:stroke;stroke:#fbf6ec;stroke-width:5px;stroke-linejoin:round">
      <text x="440" y="132" text-anchor="middle" fill="#a2321e">البرج</text>
      <text x="340" y="408" text-anchor="middle" fill="#7a3a0a">كابل ألياف: نور جوه زجاج</text>
      <text x="300" y="150" text-anchor="middle" fill="#a2560e" style="font-size:14px">موجات راديو</text>
    </g>
  </svg></div>
  <p class="t" style="top:724px;font:800 30px/1.3 var(--font-sans)">في أقل من <span style="color:var(--water)">ربع ثانية!</span></p>
</div></body></html>
