<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Cover — ATM (realistic)</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
  /* realistic-leaning cover, 540×960 at 2x, full bleed: no ink outlines, soft light, brushed steel, depth of field.
     Titles stay inside the 3:4 profile crop (y 120–840) and away from the right-hand TikTok buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #07090c; }
  svg { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 4px 14px rgba(0,0,0,.85); }
</style></head><body>
<div class="cover">
<svg viewBox="0 0 540 960">
  <defs>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="brushed" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .012" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" values="0 0 0 0 .5  0 0 0 0 .52  0 0 0 0 .55  0 0 0 .22 0" result="g"/><feComposite in="g" in2="SourceGraphic" operator="in" result="m"/><feBlend in="SourceGraphic" in2="m" mode="overlay"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .09 0"/></filter>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5058"/><stop offset=".18" stop-color="#b9c0c8"/><stop offset=".5" stop-color="#e4e8ec"/><stop offset=".82" stop-color="#a7aeb6"/><stop offset="1" stop-color="#3f454c"/></linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dee3"/><stop offset="1" stop-color="#7a828c"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3036"/><stop offset="1" stop-color="#14171b"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9cff"/><stop offset=".6" stop-color="#1a5fc8"/><stop offset="1" stop-color="#0d3a8a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#c9ced4"/><stop offset="1" stop-color="#8a929c"/></linearGradient>
    <linearGradient id="keyR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset="1" stop-color="#a8201a"/></linearGradient>
    <linearGradient id="keyY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c99a10"/></linearGradient>
    <linearGradient id="keyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee08a"/><stop offset="1" stop-color="#1f8a3e"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ecc9"/><stop offset=".5" stop-color="#9fcd8e"/><stop offset="1" stop-color="#6a9e5c"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b68e"/><stop offset=".6" stop-color="#c98d64"/><stop offset="1" stop-color="#9a6442"/></linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f4a6a"/><stop offset="1" stop-color="#16263a"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".35"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".8" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".35" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity=".97"/></linearGradient>
    <pattern id="guil" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 Q2 0 4 4 T8 4" stroke="#4f7a44" stroke-width=".5" fill="none" opacity=".5"/></pattern>
    <clipPath id="scr"><rect x="160" y="300" width="220" height="140" rx="6"/></clipPath>
  </defs>
  <!-- night street behind: a stone wall, soft bokeh lights -->
  <rect width="540" height="960" fill="#0b0e13"/>
  <g filter="url(#blur18)" opacity=".9">
    <circle cx="60" cy="210" r="34" fill="#ffb347"/><circle cx="480" cy="180" r="28" fill="#ff8a3c"/><circle cx="500" cy="420" r="40" fill="#5aa0ff"/><circle cx="40" cy="520" r="36" fill="#ffd27a"/>
    <circle cx="90" cy="760" r="30" fill="#ff6a4a"/><circle cx="470" cy="740" r="34" fill="#ffc06a"/><circle cx="270" cy="150" r="22" fill="#9ad0ff"/>
  </g>
  <g transform="translate(36 78) scale(.87)">
  <rect x="96" y="200" width="348" height="640" rx="8" fill="#6b625a"/>
  <g opacity=".35" stroke="#3f3a35" stroke-width="2">
    <path d="M96 290 H444 M96 380 H444 M96 470 H444 M96 560 H444 M96 650 H444 M96 740 H444"/><path d="M200 200 V290 M330 290 V380 M210 380 V470 M350 470 V560 M190 560 V650 M320 650 V740"/>
  </g>
  <rect x="96" y="200" width="348" height="640" fill="url(#spot)"/>
  <!-- the ATM body, brushed steel, set into the wall -->
  <g filter="url(#shadow)">
    <rect x="128" y="236" width="284" height="576" rx="14" fill="url(#dark)"/>
    <rect x="128" y="236" width="284" height="48" rx="14" fill="#16408a"/><rect x="128" y="262" width="284" height="22" fill="#16408a"/>
    <rect x="140" y="292" width="260" height="510" rx="8" fill="url(#steel)" filter="url(#brushed)"/>
  </g>
  <text x="270" y="268" text-anchor="middle" style="font:700 22px 'Noto Serif';fill:#e6f1ff;letter-spacing:4px;direction:ltr">ATM</text>
  <circle cx="380" cy="260" r="6" fill="#0a0a0a"/><circle cx="380" cy="260" r="2.4" fill="#ff3b2f"/>
  <!-- screen, recessed, glowing, with glass glare -->
  <rect x="150" y="290" width="240" height="160" rx="10" fill="#0d1015"/>
  <g clip-path="url(#scr)">
    <rect x="160" y="300" width="220" height="140" fill="url(#screen)"/>
    <text x="270" y="338" text-anchor="middle" style="font:800 18px 'Noto Sans Arabic';fill:#fff">جاري عدّ النقود…</text>
    <rect x="190" y="360" width="160" height="10" rx="5" fill="#0d3a8a"/><rect x="190" y="360" width="112" height="10" rx="5" fill="#7cf29a"/>
    <text x="270" y="410" text-anchor="middle" style="font:700 13px 'Noto Sans Arabic';fill:#cfe6ff">من فضلك انتظر</text>
    <rect x="160" y="300" width="220" height="140" fill="url(#glass)"/>
  </g>
  <rect x="160" y="300" width="220" height="140" rx="6" fill="#3f9cff" opacity=".18" filter="url(#blur18)"/>
  <!-- side function keys -->
  <g fill="url(#key)"><rect x="138" y="312" width="12" height="16" rx="2"/><rect x="138" y="342" width="12" height="16" rx="2"/><rect x="138" y="372" width="12" height="16" rx="2"/><rect x="138" y="402" width="12" height="16" rx="2"/>
    <rect x="390" y="312" width="12" height="16" rx="2"/><rect x="390" y="342" width="12" height="16" rx="2"/><rect x="390" y="372" width="12" height="16" rx="2"/><rect x="390" y="402" width="12" height="16" rx="2"/></g>
  <!-- card slot with its green light, receipt slot -->
  <rect x="300" y="472" width="86" height="30" rx="8" fill="#2b3036"/><rect x="310" y="484" width="66" height="6" rx="3" fill="#050607"/>
  <rect x="310" y="484" width="66" height="6" rx="3" fill="#3fe07a" opacity=".9"/><rect x="304" y="478" width="78" height="18" rx="6" fill="#3fe07a" opacity=".35" filter="url(#blur6)"/>
  <rect x="160" y="478" width="70" height="16" rx="4" fill="#2b3036"/><rect x="168" y="484" width="54" height="4" rx="2" fill="#050607"/>
  <!-- keypad under its privacy hood: real-looking keys with light from above -->
  <path d="M184 520 H356 L372 540 H168 Z" fill="#3a3f46"/>
  <rect x="180" y="540" width="180" height="120" rx="6" fill="#8a929c"/>
  <g style="font:700 15px 'Noto Serif';fill:#2b2f34" text-anchor="middle">
    <g transform="translate(190 550)">
      <rect width="34" height="22" rx="4" fill="url(#key)"/><text x="17" y="16">1</text>
      <rect x="40" width="34" height="22" rx="4" fill="url(#key)"/><text x="57" y="16">2</text>
      <rect x="80" width="34" height="22" rx="4" fill="url(#key)"/><text x="97" y="16">3</text>
      <rect x="124" width="34" height="22" rx="4" fill="url(#keyR)"/>
      <rect y="28" width="34" height="22" rx="4" fill="url(#key)"/><text x="17" y="44">4</text>
      <rect x="40" y="28" width="34" height="22" rx="4" fill="url(#key)"/><text x="57" y="44">5</text>
      <rect x="80" y="28" width="34" height="22" rx="4" fill="url(#key)"/><text x="97" y="44">6</text>
      <rect x="124" y="28" width="34" height="22" rx="4" fill="url(#keyY)"/>
      <rect y="56" width="34" height="22" rx="4" fill="url(#key)"/><text x="17" y="72">7</text>
      <rect x="40" y="56" width="34" height="22" rx="4" fill="url(#key)"/><text x="57" y="72">8</text>
      <rect x="80" y="56" width="34" height="22" rx="4" fill="url(#key)"/><text x="97" y="72">9</text>
      <rect x="124" y="56" width="34" height="22" rx="4" fill="url(#keyG)"/>
      <rect x="40" y="84" width="34" height="22" rx="4" fill="url(#key)"/><text x="57" y="100">0</text>
    </g>
  </g>
  <!-- the cash slot, open, a fan of crisp notes coming out -->
  <rect x="176" y="690" width="188" height="44" rx="10" fill="#3a3f46"/><rect x="190" y="702" width="160" height="18" rx="4" fill="#050607"/>
  <rect x="186" y="696" width="168" height="30" rx="8" fill="#3fe07a" opacity=".25" filter="url(#blur6)"/>
  <g>
    <g transform="translate(270 700) rotate(-14)"><rect x="-70" y="-74" width="140" height="66" rx="3" fill="url(#note)"/><rect x="-70" y="-74" width="140" height="66" rx="3" fill="url(#guil)"/><circle cx="34" cy="-41" r="18" fill="#b8dca8" opacity=".9"/><text x="-34" y="-30" text-anchor="middle" style="font:700 22px 'Noto Serif';fill:#2e5a2a">200</text></g>
    <g transform="translate(270 702) rotate(-4)"><rect x="-70" y="-78" width="140" height="66" rx="3" fill="url(#note)"/><rect x="-70" y="-78" width="140" height="66" rx="3" fill="url(#guil)"/><circle cx="34" cy="-45" r="18" fill="#b8dca8" opacity=".9"/><text x="-34" y="-34" text-anchor="middle" style="font:700 22px 'Noto Serif';fill:#2e5a2a">200</text></g>
    <g transform="translate(270 704) rotate(8)"><rect x="-70" y="-80" width="140" height="66" rx="3" fill="url(#note)"/><rect x="-70" y="-80" width="140" height="66" rx="3" fill="url(#guil)"/><circle cx="34" cy="-47" r="18" fill="#b8dca8" opacity=".9"/><text x="-34" y="-36" text-anchor="middle" style="font:700 22px 'Noto Serif';fill:#2e5a2a">200</text><rect x="-70" y="-80" width="140" height="22" fill="#fff" opacity=".18"/></g>
  </g>
  <!-- a hand reaching in from the right to take the cash -->
  <g filter="url(#shadow)">
    <path d="M560 760 C470 742 420 720 392 690 L372 668 C366 660 372 650 382 654 L410 668 C400 650 398 636 410 632 L440 640 C436 624 444 616 456 620 L478 632 C478 620 488 616 498 622 L560 660 Z" fill="url(#skin)"/>
    <path d="M560 790 C500 778 470 770 452 756 L470 712 C500 726 530 732 560 734 Z" fill="url(#sleeve)"/>
  </g>
  </g>
  <!-- light, depth, mood -->
  <rect width="540" height="960" fill="url(#vig)"/>
  <rect width="540" height="300" fill="url(#fadeT)"/><rect y="700" width="540" height="260" fill="url(#fadeB)"/>
  <rect width="540" height="960" filter="url(#grain)"/>
</svg>
  <p class="t" style="top:112px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:134px;font:700 42px/1.2 'Aref Ruqaa',serif;color:#fff">إيه اللي جوه مكنة الفلوس؟!</p>
  <p class="t" style="top:196px;font:700 26px/1.2 'Aref Ruqaa',serif;color:#f2c230">ومين بيعدّ الفلوس؟</p>
  <p class="t" style="top:792px;font:800 32px/1.3 'Noto Sans Arabic';color:#fff">الرقم السري <span style="color:#f2c230">4 أرقام</span><br><span style="font-size:22px;color:#d9d4c8">بسبب مرات المخترع!</span></p>
</div>
</body></html>
