<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — heart (sketch style)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Sans:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover for the «اسكتش» heart video, full bleed 540×960 (1080×1920 at 2x), after cover-choking-tiktok.html:
     dark slate, one warm glow behind the two hearts (hers smaller), an inset on her smartwatch, the extra beats in a tag.
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); font-family: 'Noto Sans Arabic'; }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font-weight:600;font-size:15px;color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font-weight:900;font-size:40px;line-height:1.2;color:#fff">ليه قلب الست بيدق أسرع؟</p>
  <p class="t" style="top:258px;font-weight:800;font-size:24px;line-height:1.3;color:#f2c230">مش توتر ولا أعصاب!</p>
  <p class="t" style="top:722px;font-weight:800;font-size:34px;line-height:1.35;color:#fff">قلب أصغر = <span style="color:#f2c230;direction:ltr;unicode-bidi:isolate">3–7</span> دقات زيادة<br><span style="font-size:24px;color:#d9d4c8">كل دقيقة، وده طبيعي خالص</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
</defs></svg>
<script src="../../videos/heart/timing.js"></script>
<script src="../../videos/_templates/people/person.js"></script>
<script src="../../videos/heart/sketch/scenes.js"></script>
<script>
  (function () {
    var t = 0.05, s = "";
    s += '<rect width="540" height="960" fill="#1b1d22"/><rect width="540" height="960" fill="url(#grid)" opacity=".18"/>';
    s += '<circle cx="270" cy="500" r="240" fill="#ffd27a" opacity=".35" filter="url(#soft)"/><circle cx="270" cy="500" r="140" fill="#ffe08a" opacity=".3" filter="url(#soft)"/>';
    // the two hearts: hers smaller and quicker, his bigger
    s += heartFront(150, 520, .62, 0, { node: .4 }) + heartFront(380, 505, .8, 0);
    s += '<g transform="translate(150 660)"><rect x="-40" y="-20" width="80" height="34" rx="5" fill="#c4532c"/><text x="0" y="5" text-anchor="middle" style="font:800 20px Noto Sans Arabic;fill:#fff">' + TX.her + '</text></g>';
    s += '<g transform="translate(380 680)"><rect x="-40" y="-20" width="80" height="34" rx="5" fill="#4a6f8a"/><text x="0" y="5" text-anchor="middle" style="font:800 20px Noto Sans Arabic;fill:#fff">' + TX.him + '</text></g>';
    // her smartwatch in a magnified inset, ringed in orange
    s += '<circle cx="440" cy="400" r="86" fill="#ffd27a" opacity=".25" filter="url(#soft)"/>' + inset(440, 400, 74, watch(0, 0, .62, 79, .02), 1) + '<circle cx="440" cy="400" r="74" fill="none" stroke="#c4532c" stroke-width="4"/>';
    s += '<g transform="translate(96 420)"><rect x="-56" y="-22" width="112" height="38" rx="5" fill="#f4ecdb" stroke="#2a2016" stroke-width="2"/><text x="0" y="6" text-anchor="middle" style="font:800 22px Noto Serif;fill:#c4532c;direction:ltr">+3–7</text></g>';
    s += '<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
         '<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient></defs>';
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
