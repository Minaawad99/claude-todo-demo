<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Reel cover — the weave (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for «الغرزة», photo version: the Gemini night photo (an illustration, labelled «صورة تعبيرية»: a dark grey
     Hyundai Avante cutting behind a petrol tanker on the Ring Road at Warraq, 6 pm), full bleed 540×960, the headline in the
     black sky, the punch line over a dark fade at the bottom. Safe area y 120–840. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  .cover img { position: absolute; left: 0; top: 0; width: 540px; height: 967px; object-fit: cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(#000 0, rgba(0,0,0,.75) 14%, rgba(0,0,0,.15) 30%, rgba(0,0,0,0) 45%, rgba(0,0,0,0) 62%, rgba(0,0,0,.75) 76%, rgba(0,0,0,.92) 100%); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 12px rgba(0,0,0,.85); }
  .note { position: absolute; left: 16px; top: 812px; margin: 0; font: 600 11px 'Noto Sans Arabic'; color: #bdb7aa; }
</style></head><body>
<div class="cover">
  <img src="ghorza-gemini-photo.jpg" alt="">
  <div class="fade"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.25 'Noto Sans Arabic';color:#fff">الغرزة على الدائري</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">وفّرت دقيقة… وكلّفت 31 روح</p>
  <p class="t" style="top:722px;font:800 33px/1.35 'Noto Sans Arabic';color:#fff">في 20 كيلو بتوفّر <span style="color:#f2c230">دقيقة</span> واحدة<br><span style="font-size:23px;color:#d9d4c8">ومتعرفش اللي جنبك هيعمل إيه</span></p>
  <p class="note">صورة تعبيرية</p>
</div>
</body></html>
