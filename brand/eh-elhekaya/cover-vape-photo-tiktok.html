<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — vape (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover for «الفيب ولا السيجارة؟» on the channel's generated photo (photo-vape-src.jpg): full bleed 540×960
     (1080×1920 at 2x), the same text layout as the sketch covers. The top fade also hides the seam in the photo at y≈211. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #15171b; }
  .ph { position: absolute; left: 0; top: -4px; width: 540px; height: 968px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; padding: 4px 12px; border-radius: 5px; font: 800 21px 'Noto Serif'; direction: ltr; }
</style></head><body>
<div class="cover">
  <img class="ph" src="photo-vape-src.jpg">
  <div class="fade" style="top:0;height:330px;background:linear-gradient(#15171b 0%,#15171b 58%,rgba(21,23,27,.6) 80%,rgba(21,23,27,0))"></div>
  <div class="fade" style="top:660px;height:300px;background:linear-gradient(rgba(10,10,12,0),rgba(10,10,12,.8) 30%,rgba(10,10,12,.96))"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">الفيب ولا السيجارة؟</p>
  <p class="t" style="top:212px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">مين بيأذيك أكتر بجد؟</p>
  <div class="tag" style="left:258px;top:428px;background:#c4532c;color:#fff">900°</div>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">مش النيكوتين… <span style="color:#f2c230">الحريق!</span><br><span style="font-size:24px;color:#d9d4c8">والفيب أقل ضرر، بس مش آمن</span></p>
</div>
</body></html>
