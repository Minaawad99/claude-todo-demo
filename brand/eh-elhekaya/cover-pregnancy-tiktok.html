<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — pregnancy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* «الحمل من جوه» reel cover, full bleed 540×960 (1080×1920 at 2x), the tunnel-cover palette: dark night sky at the top,
     dark sea at the bottom, one warm glow behind the womb. The drawings are the episode's own (videos/pregnancy/sketch):
     the womb in a front cut with the fetus, placenta and cord, the hormone dots and the brain.
     Everything that matters stays inside the 3:4 crop (y 120–840) and away from TikTok's right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 42px/1.2 'Noto Sans Arabic';color:#fff">ليه الحامل بترجّع؟!</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">والسبب لسه أصغر من حباية الرز</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff"><span style="color:#f2c230">المشيمة</span> بتبعت رسالة للمخ<br><span style="font-size:24px;color:#d9d4c8">ومن هنا القيء والدوخة والوحم</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2a2016" stroke-width="1" opacity=".15"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#e1d5ba" stroke-width="1.3" fill="none"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset=".35" stop-color="#0b1730"/><stop offset=".7" stop-color="#1b2f50"/><stop offset="1" stop-color="#0d1a2c"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset=".45" stop-color="#f2a640" stop-opacity=".35"/><stop offset="1" stop-color="#f2a640" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8" stop-opacity=".6"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
  <linearGradient id="nightSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244a66"/><stop offset="1" stop-color="#0a1828"/></linearGradient>
</defs></svg>
<script src="../../videos/pregnancy/timing.js"></script>
<script src="../../videos/lib/geo.min.js"></script>
<script src="../../videos/pregnancy/sketch/scenes.js"></script>
<script>
  (function () {
    var s = '<rect width="540" height="960" fill="url(#sky)"/>', t = 3.2;
    for (var i = 0; i < 60; i++) { var x = hash(i) * 540, y = hash(i + 99) * 960, r = .5 + hash(i + 7) * 1.2; s += '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r) + '" fill="#fff" opacity="' + f(.15 + hash(i + 3) * .4) + '"/>'; }
    // warm glow, then the womb with the 10-week fetus, placenta and cord, a little bigger than in the episode
    s += '<circle cx="250" cy="470" r="260" fill="url(#warm)"/>';
    var sc = .82; s += '<g transform="translate(' + f(250 - 320 * sc) + ' ' + f(500 - 420 * sc) + ') scale(' + sc + ')">' + wombScene(t, { plac: 1, cord: 1, big: true }) + '</g>';
    // the message to the brain: hormone dots rising from the placenta to a small glowing brain top right
    s += hormoneDots(260, 400, 432, 290, 1.7, '#9fc3dc', 9, 1) + brain(462, 282, .3, 1, t);
    s += '<g transform="translate(150 610) rotate(-5)"><rect x="-58" y="-20" width="116" height="34" rx="6" fill="#f2c230" stroke="#2a2016" stroke-width="2"/><text x="0" y="5" text-anchor="middle" style="font:800 19px Noto Sans Arabic;fill:#2a2016">أسبوع 9</text></g>';
    s += '<g transform="translate(400 380) rotate(4)"><rect x="-56" y="-20" width="112" height="34" rx="6" fill="#f4ecdb" stroke="#2a2016" stroke-width="2"/><text x="0" y="5" text-anchor="middle" style="font:800 18px Noto Serif;fill:#4a6f8a;direction:ltr">GDF15</text></g>';
    s += '<rect width="540" height="320" fill="url(#fadeT)"/><rect y="660" width="540" height="300" fill="url(#fadeB)"/><rect width="540" height="960" filter="url(#grain)"/>';
    document.getElementById("art").innerHTML = s;
  })();
</script>
</body></html>
