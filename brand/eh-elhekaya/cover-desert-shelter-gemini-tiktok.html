<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — desert shelter (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the desert-shelter reel cover on the channel's Gemini illustration (desert-shelter-gemini-art.jpg), full bleed 540×960
     (1080×1920 at 2x). Text in our fonts and colours; everything that matters stays inside y 120–840, clear of the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 19px 'Noto Sans Arabic'; color: #fff; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
</style></head><body>
<div class="cover">
  <img class="art" src="desert-shelter-gemini-art.jpg">
  <div class="fade" style="top:0;height:290px;background:linear-gradient(#000d 0%,#0007 70%,#0000)"></div>
  <div class="fade" style="top:680px;height:280px;background:linear-gradient(#0000,#000b 35%,#000f)"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#e9e2d2">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 40px/1.2 'Noto Sans Arabic';color:#fff">اتحبست في الصحرا؟</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">اعمل الملجأ ده بجاروف ومشمع</p>
  <div class="tag" style="left:96px;top:640px;background:#2f6f9f">جوّه</div>
  <div class="tag" style="left:330px;top:262px;background:#c7321f">برّه نار</div>
  <p class="t" style="top:740px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">جوّه أبرد لحد <span style="color:#f2c230">٢٢ درجة</span><br><span style="font-size:24px;color:#e0d9c9">ومن غير أي كهربا!</span></p>
</div>
</body></html>
