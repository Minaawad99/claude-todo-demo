<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — X-ray (diagram style)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover for the «الرسم الهندسي» X-ray video, full bleed 540×960 (1080×1920 at 2x): the tunnel-cover palette (near
     black top and bottom, one warm glow behind the subject) with the diagram look (olive plate, X-ray print, leader labels).
     Everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 34px/1.2 'Noto Sans Arabic';color:#fff">إزاي الأشعة بتشوف عضمك؟</p>
  <p class="t" style="top:210px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">من غير ما تفتح جلدك!</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">اللي بتشوفه هو <span style="color:#f2c230">ضل</span> عضمك<br><span style="font-size:24px;color:#d9d4c8">مش العضم نفسه!</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <pattern id="hatchW" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#fff" stroke-width="1" opacity=".25"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#dccfb2" stroke-width="1.2" fill="none"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e2"/><stop offset=".5" stop-color="#d3d6d1"/><stop offset="1" stop-color="#c7cbc5"/></linearGradient>
  <radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
  <linearGradient id="rayCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8cc" stop-opacity=".55"/><stop offset="1" stop-color="#9fb8cc" stop-opacity=".08"/></linearGradient>
</defs></svg>
<script src="../../videos/xray-diagram/timing.js"></script>
<script>window.CAPS = [];</script>
<script src="../../videos/xray-diagram/diagram/scenes.js"></script>
<script>
  (function () {
    var P = window.__parts, t = 61.3, s = "";
    s += '<rect width="540" height="960" fill="#1b1d22"/><rect width="540" height="960" fill="url(#grid)" opacity=".18"/>';
    s += '<circle cx="270" cy="470" r="230" fill="#ffd27a" opacity=".35" filter="url(#soft)"/><circle cx="270" cy="470" r="130" fill="#ffe08a" opacity=".3" filter="url(#soft)"/>';
    s += '<g transform="translate(270 492) rotate(-4)">' + P.plate(0, 0, 280, 450, P.hand(0, 92, 0.75, t, { skin: 1, bones: 1, xray: true, crack: true }), { stand: false }) + '</g>';
    var cx = 270 - 28 * 0.92, cy = 470 + 200 + 152 * 0.92 - 430 / 2 + 0;   // crack, roughly
    var cr = [270 + (-18 * Math.cos(-4 * Math.PI / 180) - 204 * Math.sin(-4 * Math.PI / 180)), 492 + (-18 * Math.sin(-4 * Math.PI / 180) + 204 * Math.cos(-4 * Math.PI / 180))];
    s += '<circle cx="' + cr[0].toFixed(1) + '" cy="' + cr[1].toFixed(1) + '" r="26" fill="none" stroke="#c4532c" stroke-width="5"/>' + P.label(cr[0] + 26, cr[1], 450, cr[1] - 40, "الكسر", "#e8743c", 1, 24);
    s += P.inset(450, 330, 60, P.tube(-20, 0, 0.32, t, { fil: 1, beam: 1, burst: 1, waves: 1, spin: 0.4 }), 1);
    s += '<g transform="translate(96 330)"><rect x="-58" y="-20" width="116" height="34" rx="5" fill="#c4532c"/><text x="0" y="5" text-anchor="middle" style="font:800 19px Noto Sans Arabic;fill:#fff;direction:ltr">100,000 V</text></g>';
    s += '<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".75" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
         '<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient></defs>';
    s += '<rect width="540" height="300" fill="url(#fadeT)"/><rect y="680" width="540" height="280" fill="url(#fadeB)"/>';
    document.getElementById("art").innerHTML = s + '<rect width="540" height="960" filter="url(#paperN)"/>';
  })();
</script>
</body></html>
