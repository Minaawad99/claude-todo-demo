<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Reel cover — donate for the Warraq fire injured (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>
  /* the reel cover on the user's Gemini illustration (warraq-donate-gemini-art.jpg, not a photo of a real patient): a family
     hand holding a bandaged hand in a burns ward. Our own lettering; everything inside y 120–840, clear of the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; font-family: 'Noto Sans Arabic'; }
  .bg { position: absolute; left: 0; top: -40px; width: 540px; height: 967px; background: url(warraq-donate-gemini-art.jpg) center top / cover; }
  .fadeT { position: absolute; left: 0; right: 0; top: 0; height: 340px; background: linear-gradient(rgba(0,0,0,.92) 0%, rgba(0,0,0,.78) 55%, rgba(0,0,0,0) 100%); }
  .fadeB { position: absolute; left: 0; right: 0; top: 650px; height: 310px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.78) 32%, #000 70%); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .y { color: #f2c230; }
  .num { display: inline-block; margin: 0 5px; padding: 3px 12px 5px; background: #f4ecdb; color: #2a2016; border: 2px solid #2a2016; border-radius: 6px; font: 800 15px 'Noto Sans Arabic'; text-shadow: none; }
  .num b { font: 800 19px 'Noto Serif'; margin-left: 7px; direction: ltr; unicode-bidi: isolate; }
  .note { position: absolute; left: 14px; bottom: 120px; font: 600 10px 'Noto Sans Arabic'; color: rgba(255,255,255,.55); }
</style></head><body>
<div class="cover">
  <div class="bg"></div><div class="fadeT"></div><div class="fadeB"></div>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:156px;font:900 38px/1.25 'Noto Sans Arabic';color:#fff">إمبارح مقدرتش تساعد…</p>
  <p class="t" style="top:212px;font:800 27px/1.3 'Noto Sans Arabic'"><span class="y">النهارده تقدر تنقذ روح</span></p>
  <p class="t" style="top:716px;font:800 32px/1.35 'Noto Sans Arabic';color:#fff">اتبرع لمصابي <span class="y">الحروق</span></p>
  <p class="t" style="top:776px"><span class="num"><b style="color:#8a2f5c">*9*155#</b>مستشفى 185</span><span class="num"><b style="color:#3f8aa8">16863</b>أهل مصر</span></p>
  <div class="note">صورة تعبيرية</div>
</div>
</body></html>
