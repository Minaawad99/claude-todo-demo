<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — Hiroshima (AI Studio art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the cover on the painting the user made in AI Studio: the picture fills the frame, dark fades top and bottom carry
     the text. 540×960 at 2x; text inside the 3:4 crop (y 120–840), away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  .art { position: absolute; left: 0; top: 0; width: 540px; height: 960px; object-fit: cover; object-position: 50% 40%; }
  .fT { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .fB { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55) 35%, rgba(0,0,0,.88)); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.8); }
</style></head><body>
<div class="cover">
  <img class="art" src="hiroshima-cover-art.jpg">
  <div class="fT"></div><div class="fB"></div>
  <p class="t" style="top:118px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:136px;font:900 46px/1.2 'Noto Sans Arabic';color:#fff">هيروشيما</p>
  <p class="t" style="top:200px;font:800 24px/1.2 'Noto Sans Arabic';color:#f2c230">الساعة تمانية وربع الصبح</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">في <span style="color:#f2c230">ثانية واحدة</span><br><span style="font-size:24px;color:#e6e0d4">مدينة كاملة اختفت</span></p>
</div>
</body></html>
