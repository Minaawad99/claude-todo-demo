<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — سالم إكسبريس (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the cover on the painting the user made in Gemini from the prompt written for it: the picture fills the
     frame, dark fades top and bottom carry the text. 540×960 at 2x; text inside the 3:4 crop (y 120–840). */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  .art { position: absolute; left: 0; top: 0; width: 540px; height: 960px; object-fit: cover; object-position: 50% 50%; }
  .fT { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .fB { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55) 35%, rgba(0,0,0,.88)); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.8); }
  .rec { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 712px; padding: 5px 14px; border-radius: 16px; background: rgba(8,10,16,.8); font: 800 15px 'Noto Sans Arabic'; color: #fff; }
  .rec i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e23a2a; margin-left: 8px; }
</style></head><body>
<div class="cover">
  <img class="art" src="salem-cover-art.jpg">
  <div class="fT"></div><div class="fB"></div>
  <p class="t" style="top:118px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:136px;font:900 44px/1.2 'Noto Sans Arabic';color:#fff">سالم إكسبريس</p>
  <p class="t" style="top:200px;font:800 22px/1.2 'Noto Sans Arabic';color:#f2c230">«الدنيا كانت كحل… والمية سودة»</p>
  <div class="rec"><i></i>بصوت واحد من الناجين</div>
  <p class="t" style="top:772px;font:800 32px/1.35 'Noto Sans Arabic';color:#fff">غرقت قبل المينا بـ<span style="color:#f2c230">15 كم</span> بس<br><span style="font-size:22px;color:#e6e0d4">عبّارة حجاج · البحر الأحمر 1991</span></p>
</div>
</body></html>
