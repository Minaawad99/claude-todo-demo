<script type="module">

  const marble = tex(1024, 512, g => { g.fillStyle = "#2a2622"; g.fillRect(0, 0, 1024, 512); for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(200,190,170,${0.05 + Math.random() * 0.12})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); let x = Math.random() * 1024, y = 0; g.moveTo(x, y); while (y < 512) { x += (Math.random() - 0.5) * 40; y += 20; g.lineTo(x, y); } g.stroke(); } });

  const X = 1.1, Y = 1.6, Z = 0.8;

  const cold = new THREE.PointLight("#9fd8ff", 6, 3, 1.5); cold.position.set(0, 0.5, 0.4); scene.add(cold);

  add(new THREE.CylinderGeometry(0.035, 0.035, 0.9, 16), new THREE.MeshPhysicalMaterial({ color: "#d9f0ff", transmission: 0.6, roughness: 0.1, thickness: 0.05 }), -0.35, 1.0, 0.3);

  cyl.rotation.z = Math.PI / 2; cyl.position.set(0.1, 0.45, 0); cyl.receiveShadow = true; scene.add(cyl);
  add(new THREE.PlaneGeometry(1.66, 0.64), cream, 0.1, 0.45, -0.01, false);
  [-0.75, 0.95].forEach(x => add(new THREE.TorusGeometry(0.34, 0.03, 12, 48), chrome, x, 0.45, 0).rotation.y = Math.PI / 2);
  const helix = new THREE.Curve(); helix.getPoint = (u, v = new THREE.Vector3()) => { const a = u * Math.PI * 2 * 3.5; return v.set(-0.8 + u * 1.6 + 0.1, 0.45 + Math.cos(a) * 0.26, Math.sin(a) * 0.26 + 0.02); };
  add(new THREE.TubeGeometry(helix, 400, 0.035, 12, false), std("#2f7fc0", { roughness: 0.35, metalness: 0.3 }), 0, 0, 0);
  add(new THREE.CylinderGeometry(0.04, 0.04, 1.9, 16), chrome, 0.1, 0.45, 0.02).rotation.z = Math.PI / 2;
  const coil = new THREE.Curve(); coil.getPoint = (u, v = new THREE.Vector3()) => { const a = u * Math.PI * 2 * 11; return v.set(-0.78 + u * 1.56 + 0.1, 0.45 + Math.cos(a) * 0.38, Math.sin(a) * 0.38 * (Math.sin(a) > 0 ? 0.25 : 1)); };
  add(new THREE.TubeGeometry(coil, 900, 0.022, 10, false), copper, 0, 0, 0);
  // frost specks on the cylinder
  const fp = []; for (let i = 0; i < 200; i++) { const a = Math.random() * Math.PI, x = -0.75 + Math.random() * 1.6; fp.push(x, 0.45 + Math.cos(a) * 0.345, Math.sin(a) * 0.345 * 0.2 + 0.05); }
  const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.Float32BufferAttribute(fp, 3)); scene.add(new THREE.Points(fg, new THREE.PointsMaterial({ color: "#ffffff", size: 0.02 })));
  // the beater motor at the back right, the compressor under it
  add(new THREE.CylinderGeometry(0.22, 0.22, 0.32, 32), std("#2b2e33", { metalness: 0.6, roughness: 0.4 }), 0.92, 0.45, -0.1).rotation.z = Math.PI / 2;
  // the front door: a chrome plate on the cut edge, the spout with a star nozzle, the draw handle with a red knob
  add(new THREE.BoxGeometry(0.7, 0.36, 0.1), chrome, -0.55, -0.08, Z + 0.06);
  add(new THREE.CylinderGeometry(0.07, 0.05, 0.2, 8), chrome, -0.55, -0.34, Z + 0.14);
  const lever = add(new THREE.CylinderGeometry(0.03, 0.03, 0.42, 16), chrome, -0.55, 0.16, Z + 0.24); lever.rotation.x = 1.0;
  add(new THREE.SphereGeometry(0.07, 24, 24), std("#c8231a", { roughness: 0.25, metalness: 0.1 }), -0.55, 0.27, Z + 0.42);
  // drip tray
  add(new THREE.BoxGeometry(0.8, 0.06, 0.45), chrome, -0.55, -1.56, Z + 0.22);
  // the cone and the soft-serve swirl coming out of the nozzle (a star shape swept along a tightening helix)
  const waf = tex(256, 256, g => { g.fillStyle = "#d39a52"; g.fillRect(0, 0, 256, 256); g.strokeStyle = "#a8692e"; g.lineWidth = 6; for (let i = -256; i < 512; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 256, 256); g.stroke(); g.beginPath(); g.moveTo(i + 256, 0); g.lineTo(i, 256); g.stroke(); } });
  waf.wrapS = waf.wrapT = THREE.RepeatWrapping; waf.repeat.set(3, 2);
  const cx = -0.55, cz = Z + 0.22, coneTop = -0.92;
  const cone = add(new THREE.ConeGeometry(0.2, 0.48, 48, 1, true), new THREE.MeshStandardMaterial({ map: waf, roughness: 0.8, side: THREE.DoubleSide }), cx, coneTop - 0.24, cz); cone.rotation.x = Math.PI;
  add(new THREE.TorusGeometry(0.19, 0.022, 12, 48), std("#c58a46"), cx, coneTop, cz).rotation.x = Math.PI / 2;
  const star = new THREE.Shape(); for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = i % 2 ? 0.055 : 0.075; i ? star.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : star.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  const pts = []; const turns = 3.6; for (let i = 0; i <= 220; i++) { const u = i / 220, a = u * Math.PI * 2 * turns, rad = 0.16 * (1 - u * 0.85); pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, coneTop + 0.06 + u * 0.42, cz + Math.sin(a) * rad)); }
