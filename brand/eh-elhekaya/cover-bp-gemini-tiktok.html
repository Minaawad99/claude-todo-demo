<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — blood pressure (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the blood-pressure reel cover on the channel's Gemini illustration (bp-gemini-art.jpg), full bleed 540×960 (1080×1920 at 2x).
     Gemini drew the gauge numbers backwards, so the episode's own gauge face (0–300 mmHg, needle on 120) is laid over its dial.
     Text in our fonts and colours; everything that matters stays inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  #fix { position: absolute; inset: 0; width: 540px; height: 960px; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 20px 'Noto Serif'; color: #fff; background: #c4532c; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); direction: ltr; }
</style></head><body>
<div class="cover">
  <img class="art" src="bp-gemini-art.jpg">
  <svg id="fix" viewBox="0 0 540 960"></svg>
  <div class="fade" style="top:0;height:240px;background:linear-gradient(#000e 0%,#0008 70%,#0000)"></div>
  <div class="fade" style="top:735px;height:225px;background:linear-gradient(#0000,#000b 30%,#000f)"></div>
  <p class="t" style="top:126px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:146px;font:900 38px/1.2 'Noto Sans Arabic';color:#fff">ضغطك بيتقاس إزاي؟</p>
  <p class="t" style="top:196px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">من غير ما يشوف نقطة دم!</p>
  <div class="tag" style="left:420px;top:662px">120/80</div>
  <p class="t" style="top:758px;font:800 31px/1.35 'Noto Sans Arabic';color:#fff">الطبيعي أقل من <span style="color:#f2c230">120/80</span><br><span style="font-size:22px;color:#d9d4c8">وإمتى تطلب الإسعاف فورًا</span></p>
</div>
<script src="../../videos/blood-pressure/timing.js"></script>
<script src="../../videos/_templates/people/person.js"></script>
<script src="../../videos/blood-pressure/sketch/scenes.js"></script>
<script>
  // Gemini's dial sits at about (472, 585) here: cover its face, then draw the real one (0 at the top, clockwise to 300)
  document.getElementById("fix").innerHTML = '<rect x="421" y="524" width="103" height="122" rx="9" fill="#2f3438"/>' +
    '<clipPath id="dialC"><circle cx="472" cy="585" r="48"/></clipPath><g clip-path="url(#dialC)">' + gauge(472, 585, 48, 120) + '</g>';
</script>
</body></html>
