<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — the Kaaba cutaway (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  /* the reel cover «الكعبة من جوّه بتتغسل بإيه؟»: the user's Gemini cutaway art full bleed, with the series' cover type on top
     (white title, the key words on yellow, a yellow line) and the answer at the foot. 540×960, shot at 2x. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; left: 50%; top: 0; height: 960px; transform: translateX(-50%); }
  .fT { position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(rgba(20,21,24,.9), rgba(20,21,24,.55) 70%, rgba(20,21,24,0)); }
  .fB { position: absolute; left: 0; right: 0; top: 700px; height: 260px; background: linear-gradient(rgba(20,21,24,0), rgba(20,21,24,.8) 40%, rgba(20,21,24,.95)); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .hl { background: #f3c94a; color: #1f1810; border-radius: 10px; padding: 0 10px; line-height: 1.2; display: inline-block; text-shadow: none; }
</style></head><body>
<div class="cover">
  <img class="art" src="kaaba-cutaway-gemini.jpg" alt="">
  <div class="fT"></div><div class="fB"></div>
  <p class="t" style="top:100px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:126px;font:900 42px/1.4 'Noto Sans Arabic';color:#fff">الكعبة <span class="hl">من جوّه</span><br>بتتغسل بإيه؟</p>
  <p class="t" style="top:246px;font:800 22px/1.3 'Noto Sans Arabic';color:#f2c230">مرة واحدة بس في السنة</p>
  <p class="t" style="top:772px;font:800 31px/1.35 'Noto Sans Arabic';color:#fff">مية <span style="color:#f2c230">زمزم</span> وورد وعود<br><span style="font-size:22px;color:#d9d4c8">وكله بالإيد… من غير صابون!</span></p>
</div>
</body></html>
