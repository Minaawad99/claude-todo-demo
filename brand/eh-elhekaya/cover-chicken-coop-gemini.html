<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — chicken coop (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the reel cover on the Gemini drawing of the rooftop coop: same text layout as cover-chicken-coop-tiktok.html.

  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; }
  .art { position: absolute; inset: 0; width: 540px; height: 960px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; pointer-events: none; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.75); }
</style></head><body>
<div class="cover">
  <img class="art" src="gemini-chicken-coop-art.jpg" alt="">
  <div class="fade" style="top:0;height:310px;background:linear-gradient(#000e,#0009 65%,#0000)"></div>
  <div class="fade" style="top:680px;height:280px;background:linear-gradient(#0000,#000c 35%,#000f)"></div>
  <p class="t" style="top:118px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:146px;font:900 38px/1.2 'Noto Sans Arabic';color:#fff">تعمل عشة فراخ إزاي؟</p>
  <p class="t" style="top:206px;font:800 24px/1.3 'Noto Sans Arabic';color:#f2c230">على السطوح، من ٤ خشبات وسلك!</p>
  <p class="t" style="top:742px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">بتبيض <span style="color:#f2c230">كل يوم</span> من غير ديك!<br><span style="font-size:24px;color:#d9d4c8">الديك بس عشان البيضة تفقس</span></p>
</div>
<script>var i = document.querySelector('.art'); function ok() { window.READY = true; } if (i.complete) ok(); else i.onload = ok;</script>
</body></html>
