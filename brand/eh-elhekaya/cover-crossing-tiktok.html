<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — the 1973 crossing</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* the cover on the user's AI Studio painting (only its real picture band, the padded edges cut off): a blurred copy
     fills the frame, the sharp painting sits in the middle with feathered edges, text on dark fades. 540×960 at 2x. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1a140c; }
  .bg { position: absolute; inset: -40px; background: url(crossing-cover-art.jpg) center 40% / cover; filter: blur(22px) brightness(.75); }
  .art { position: absolute; left: -40px; width: 620px; top: 170px; height: 620px; background: url(crossing-cover-art.jpg) center / cover;
         -webkit-mask-image: linear-gradient(transparent 0, #000 14%, #000 84%, transparent 100%); mask-image: linear-gradient(transparent 0, #000 14%, #000 84%, transparent 100%); }
  .fT { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,0)); }
  .fB { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6) 35%, rgba(0,0,0,.9)); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.8); }
</style></head><body>
<div class="cover">
  <div class="bg"></div><div class="art"></div><div class="fT"></div><div class="fB"></div>
  <p class="t" style="top:118px;font:600 15px 'Noto Sans Arabic';color:#e6dcc8">إيه الحكاية؟</p>
  <p class="t" style="top:136px;font:900 46px/1.2 'Noto Sans Arabic';color:#fff">العبور</p>
  <p class="t" style="top:200px;font:800 24px/1.2 'Noto Sans Arabic';color:#f2c230">الساعة اتنين الضهر · 1973</p>
  <p class="t" style="top:722px;font:800 34px/1.35 'Noto Sans Arabic';color:#fff">جبل رملة اتفتح <span style="color:#f2c230">بالمية</span><br><span style="font-size:24px;color:#e6e0d4">وقالوا محتاج قنبلة ذرية!</span></p>
</div>
</body></html>
