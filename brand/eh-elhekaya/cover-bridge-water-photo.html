<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Cover — bridges in water (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* photo cover, 540×960 at 2x, full bleed. Background: Canva AI image (photos/bridge-canva.jpg).
     Titles stay inside the 3:4 profile crop (y 120–840) and away from the right-hand TikTok buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000 url(photos/bridge-canva.jpg) center/cover; }
  .fade { position: absolute; inset: 0; background:
    linear-gradient(#140c06ee 0, #140c06aa 150px, #140c0600 300px, #140c0600 640px, #140c06aa 780px, #140c06ee 960px); }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 4px 14px rgba(0,0,0,.9); }
</style></head><body>
<div class="cover">
  <div class="fade"></div>
  <p class="t" style="top:100px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:124px;font:900 36px/1.25 'Noto Sans Arabic';color:#fff">إزاي الكباري بتتبني<br>وسط المية؟!</p>
  <p class="t" style="top:222px;font:800 24px/1.25 'Noto Sans Arabic';color:#f2c230">والعمدان بتقف إزاي؟</p>
  <p class="t" style="top:772px;font:800 30px/1.3 'Noto Sans Arabic';color:#fff">الخرسانة بتشد<br><span style="color:#f2c230">وهي غرقانة!</span></p>
</div>
</body></html>
