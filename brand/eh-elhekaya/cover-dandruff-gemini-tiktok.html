<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — dandruff (Gemini art)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the dandruff reel cover on the Gemini illustration the user made from our prompt (dandruff-gemini-art.jpg, 768×1376:
     two friends, the left one scratching with flakes falling, an inset on his scalp; the right one clean). Full bleed
     540×960 (1080×1920 at 2x). Text in our fonts and colours in dark bands top and bottom; everything that matters stays
     inside y 120–840 and away from the right-hand buttons. */
  body { margin: 0; background: #000; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #1b1d22; }
  .art { position: absolute; left: 0; top: -10px; width: 540px; height: 968px; object-fit: cover; }
  .fade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 800 19px 'Noto Sans Arabic'; color: #fff; padding: 2px 14px 4px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
</style></head><body>
<div class="cover">
  <img class="art" src="dandruff-gemini-art.jpg">
  <div class="fade" style="top:0;height:300px;background:linear-gradient(#000f 0%,#000e 52%,#000b 70%,#0005 84%,#0000)"></div>
  <div class="fade" style="top:690px;height:270px;background:linear-gradient(#0000,#0006 16%,#000c 30%,#000f 55%)"></div>
  <p class="t" style="top:100px;font:600 15px 'Noto Sans Arabic';color:#d9d4c8">إيه الحكاية؟</p>
  <p class="t" style="top:126px;font:900 36px/1.25 'Noto Sans Arabic';color:#fff">ليه شعرك فيه <span style="color:#f2c230">قشرة</span>…<br>وصاحبك لأ؟</p>
  <div class="tag" style="left:150px;top:640px;background:#c4532c">قشرة</div>
  <div class="tag" style="left:360px;top:640px;background:#4f8a7a">نضيف</div>
  <p class="t" style="top:752px;font:800 33px/1.35 'Noto Sans Arabic';color:#fff">مش وساخة… ده <span style="color:#f2c230">جلدك</span><br><span style="font-size:24px;color:#d9d4c8">بيتجدد أسرع ×2 بسبب خميرة!</span></p>
</div>
</body></html>
