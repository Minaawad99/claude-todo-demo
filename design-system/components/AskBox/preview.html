<!-- @dsCard group="Engagement" height=260 subtitle="Outro call to action: viewers suggest the next question" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AskBox — preview</title>
<style>
  body { margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; max-width: 640px; }
</style>
</head>
<body>
<div class="row">
  <div class="tz-ask">
    <span class="tz-ask__lead">قولولنا...</span>
    <span class="tz-ask__lead">عايزين تعرفوا</span>
    <span class="tz-ask__line">طب إزاي <span class="tz-ask__blank" aria-hidden="true"></span>؟</span>
  </div>
  <form class="tz-ask" id="ask">
    <span class="tz-ask__lead">عندك سؤال؟</span>
    <label class="tz-ask__line" for="q">طب إزاي <input id="q" class="tz-ask__blank" placeholder="المكيف بيبرد" autocomplete="off">؟</label>
    <button type="submit" class="tz-replay" style="justify-self:center">ابعت السؤال</button>
  </form>
</div>
<script>
  document.getElementById("ask").addEventListener("submit", function (e) { e.preventDefault(); });
</script>
</body>
</html>
