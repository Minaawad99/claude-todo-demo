<!-- @dsCard group="Data" height=240 subtitle="Numbered parts on the summary drawing and their names" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legend — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .wrap { display: grid; gap: 12px; max-width: 420px; }
  .panel { position: relative; height: 110px; background: var(--panel); }
  .panel .tz-num { position: absolute; }
</style>
</head>
<body>
<div id="lg" class="wrap">
  <div class="panel" aria-hidden="true">
    <span class="tz-num" data-tz="pop" style="right:18%;top:62%">1</span>
    <span class="tz-num" data-tz="pop" style="left:16%;top:60%">2</span>
    <span class="tz-num" data-tz="pop" style="right:44%;top:72%">3</span>
    <span class="tz-num" data-tz="pop" style="right:60%;top:30%">4</span>
    <span class="tz-num" data-tz="pop" style="right:30%;top:20%">5</span>
  </div>
  <ol class="tz-legend" data-tz="fade">
    <li><span class="tz-num">1</span>السخان</li>
    <li><span class="tz-num">2</span>القرص</li>
    <li><span class="tz-num">3</span>المضخة</li>
    <li><span class="tz-num">4</span>دراع الرش</li>
    <li><span class="tz-num">5</span>الفلتر</li>
  </ol>
</div>
<p><button type="button" id="replay" class="tz-replay">إعادة الحركة</button></p>
<script>
  var l = document.getElementById("lg");
  TebEzay.play(l);
  document.getElementById("replay").addEventListener("click", function () { TebEzay.play(l); });
</script>
</body>
</html>
