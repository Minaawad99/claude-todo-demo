<!-- @dsCard group="Scene" height=300 subtitle="Magnifier circle: zooms into what the eye can't see" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Inset — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .stage { position: relative; height: 260px; max-width: 420px; border: var(--stroke-frame) solid var(--ink); }
  .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage" class="stage tz-paper">
  <svg viewBox="0 0 420 260" aria-hidden="true">
    <ellipse class="tz-f-paper tz-ink" cx="150" cy="170" rx="120" ry="70"/>
    <ellipse class="tz-ink" cx="150" cy="170" rx="80" ry="44"/>
    <path class="tz-f-hot tz-ink" d="M168 162 q8 -14 22 -6 q12 4 6 18 q-8 12 -22 6 q-12 -6 -6 -18z"/>
  </svg>
  <div class="tz-inset" data-tz="pop" style="--x:56%;--y:6%;--size:40%">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect class="tz-pat-hatch" x="0" y="70" width="100" height="30"/>
      <line class="tz-ink" x1="0" y1="70" x2="100" y2="70"/>
      <path class="tz-f-hot tz-ink" d="M18 70 L26 48 L44 38 L62 40 L78 50 L84 70 Z"/>
      <path class="tz-ink" d="M44 38 L40 70 M62 40 L60 70"/>
      <g class="tz-f-part tz-ink"><path d="M34 46 l-6 -16 l6 2z"/><path d="M58 40 l-2 -18 l5 3z"/><path d="M72 46 l6 -16 l-6 2z"/></g>
    </svg>
  </div>
</div>
<p><button type="button" id="replay" class="tz-replay">إعادة الحركة</button></p>
<script>
  TebEzay.patterns();
  var s = document.getElementById("stage");
  TebEzay.play(s);
  document.getElementById("replay").addEventListener("click", function () { TebEzay.play(s); });
</script>
</body>
</html>
