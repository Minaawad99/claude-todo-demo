<!-- @dsCard group="Scene" height=300 subtitle="Two short lines; keywords take the colour of what they mean" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Caption — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 32px; }
  .cell { display: grid; gap: 4px; justify-items: center; text-align: center; padding-block: 12px; border-top: var(--stroke-hair) solid var(--line-soft); }
  .cell small { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
</style>
</head>
<body>
<div id="caps" class="grid">
  <div class="cell">
    <p class="tz-caption" data-tz="type">وتحت فيه <span class="tz-k tz-k--heat" data-tz="key">سخان...</span></p>
    <p class="tz-caption" data-tz="type">زي سخان الحمام.</p>
    <small>tz-k--heat: حرارة، سخونة، درجات</small>
  </div>
  <div class="cell">
    <p class="tz-caption" data-tz="ink">وتدخل مية <span class="tz-k tz-k--water">نضيفة</span> أسخن...</p>
    <p class="tz-caption" data-tz="ink" data-tz-with="prev">تشطف الأطباق.</p>
    <small>tz-k--water: مية، سوايل، بخار</small>
  </div>
  <div class="cell">
    <p class="tz-caption" data-tz="type"><span class="tz-k tz-k--part">والدراع</span> بيلف لوحده...</p>
    <p class="tz-caption" data-tz="type">من غير موتور.</p>
    <small>tz-k--part: جزء ميكانيكي أو مكوّن</small>
  </div>
  <div class="cell">
    <p class="tz-caption" data-tz="type">وتعدّي على <span class="tz-em" data-tz="underline">فلتر زي المصفاة...</span></p>
    <p class="tz-caption" data-tz="type">يمسك بواقي الأكل.</p>
    <small>tz-em: خط تحت الفكرة الأساسية</small>
  </div>
</div>
<p><button type="button" id="replay" class="tz-replay">إعادة الحركة</button></p>
<script>
  var c = document.getElementById("caps");
  TebEzay.play(c);
  document.getElementById("replay").addEventListener("click", function () { TebEzay.play(c); });
</script>
</body>
</html>
