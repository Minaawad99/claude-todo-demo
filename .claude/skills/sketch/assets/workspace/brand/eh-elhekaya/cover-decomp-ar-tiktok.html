<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TikTok cover — decomposition (ar)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* «جسم الإنسان بعد الموت» reel cover (ar), full bleed 540×960 (1080×1920 at 2x), the tunnel-cover palette: dark night sky at the top,
     dark sea at the bottom, the episode's own drawings on the video's paper (videos/decomp-ar/sketch):
     the proportioned body with its organs, and the four stages as icons.
     Everything that matters stays inside the 3:4 crop (y 120–840) and away from TikTok's right-hand buttons. */
  body { margin: 0; background: #eee5d0; }
  .cover { position: relative; width: 540px; height: 960px; overflow: hidden; background: #eee5d0; }
  #art { position: absolute; inset: 0; width: 540px; height: 960px; }
  .t { position: absolute; left: 24px; right: 64px; margin: 0; text-align: center;  }
</style></head><body>
<div class="cover">
  <svg id="art" viewBox="0 0 540 960"></svg>
  <p class="t" style="top:132px;font:600 15px 'Noto Sans Arabic';color:#6f6556">إيه الحكاية؟</p>
  <p class="t" style="top:154px;font:900 27px/1.2 'Noto Sans Arabic';color:#2a2016">إيه اللي بيحصل للجسم بعد الموت؟</p>
  <p class="t" style="top:214px;font:800 24px/1.3 'Noto Sans Arabic';color:#bd552f">4 مراحل… من أول دقيقة لمئات السنين</p>
  <p class="t" style="top:722px;font:800 30px/1.35 'Noto Sans Arabic';color:#2a2016">الجسم <span style="color:#bd552f">بيهضم</span> نفسه<br><span style="font-size:24px;color:#6f6556">وبعدين البكتيريا بتكمّل</span></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2a2016" stroke-width="1" opacity=".15"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" stroke="#e1d5ba" stroke-width="1.3" fill="none"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset=".35" stop-color="#0b1730"/><stop offset=".7" stop-color="#1b2f50"/><stop offset="1" stop-color="#0d1a2c"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset=".45" stop-color="#f2a640" stop-opacity=".35"/><stop offset="1" stop-color="#f2a640" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8" stop-opacity=".6"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
  <linearGradient id="nightSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244a66"/><stop offset="1" stop-color="#0a1828"/></linearGradient>
</defs></svg>
<script src="../../videos/decomp-ar/timing.js"></script>
<script src="../../videos/lib/geo.min.js"></script>
<script src="../../videos/decomp-ar/sketch/scenes.js"></script>
<script>
  (function () {
    var s = '<rect width="540" height="960" fill="#eee5d0"/><rect width="540" height="960" fill="url(#grid)"/>', t = 1.3;
    // the shot panel: the proportioned body with its organs on the left, the four stages as icons on the right
    s += '<rect x="22" y="290" width="496" height="420" fill="#f4ecdb" stroke="#2a2016" stroke-width="2.4"/>';
    s += '<g transform="translate(160 500) scale(.78)">' + bodyOutline({ organs: 1 }) + '</g>';
    var st = [TX("هضم ذاتي", "self-digestion"), TX("انتفاخ", "bloat"), TX("تحلل", "decay"), TX("عضم", "bones")];
    var ic = [function (x, y) { return '<g transform="translate(' + x + ' ' + y + ') scale(.3)">' + cell(0, 0, 100, t, 1, .2) + '</g>'; },
              function (x, y) { return '<g transform="translate(' + x + ' ' + (y + 12) + ') scale(.15)">' + sheet(0, 0, 1, t, 1) + '</g>'; },
              function (x, y) { return fly(x, y + 6, t, 1.3); },
              function (x, y) { return skeleton(x - 6, y, .16); }];
    for (var i = 0; i < 4; i++) { var y = 345 + i * 92; s += '<rect x="300" y="' + (y - 38) + '" width="200" height="76" rx="8" fill="#eee5d0" stroke="#2a2016" stroke-width="1.8"/>' + ic[i](355, y) + '<circle cx="306" cy="' + (y - 34) + '" r="13" fill="#2a2016"/><text x="306" y="' + (y - 29) + '" text-anchor="middle" style="font:800 14px Noto Sans;fill:#fff">' + (i + 1) + '</text><text x="' + (EN ? 404 : 488) + '" y="' + (y + 7) + '" text-anchor="start" style="font:800 ' + (EN ? 15 : 19) + 'px Noto Sans, Noto Sans Arabic;fill:#2a2016">' + st[i] + '</text>'; }
    s += '<rect width="540" height="960" filter="url(#grain)" opacity=".5"/>';
    document.getElementById("art").innerHTML = s;
  })();
</script>
</body></html>
