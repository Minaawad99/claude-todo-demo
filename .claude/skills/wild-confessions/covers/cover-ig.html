<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:#0c0a08;overflow:hidden}
.ph{position:absolute;top:0;height:1920px;background-size:cover;}
.host{left:-120px;width:760px;background-image:url(D.jpg);background-position:42% 50%;filter:saturate(.95) contrast(1.05);
  -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 100%)}
.crow{right:-60px;width:700px;background-image:url(C.jpg);background-position:20% 50%;filter:contrast(1.08);
  -webkit-mask-image:linear-gradient(270deg,#000 62%,transparent 100%)}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(10,8,6,.92) 0%,rgba(10,8,6,.55) 30%,rgba(10,8,6,0) 45%,rgba(10,8,6,0) 62%,rgba(10,8,6,.85) 84%,#0c0a08 100%),
  radial-gradient(ellipse at 50% 18%,rgba(232,163,61,.25),transparent 60%)}
.title{position:absolute;top:270px;width:100%;text-align:center;font-family:Lalezar;font-size:190px;line-height:1;color:#FFD27A;
  text-shadow:0 0 18px rgba(232,163,61,.9),0 0 60px rgba(232,163,61,.55),0 6px 0 #7a4a12}
.ep{position:absolute;top:488px;width:100%;text-align:center;font-family:'IBM Plex Mono';font-size:30px;letter-spacing:10px;color:#F3E6CF;opacity:.85}
.hook{position:absolute;bottom:330px;width:100%;text-align:center;font-family:'Noto Kufi Arabic';font-weight:900;font-size:92px;line-height:1.25;color:#fff;
  text-shadow:0 4px 18px rgba(0,0,0,.9)}
.hook b{color:#FFD27A;font-weight:900}
.guest{position:absolute;bottom:265px;width:100%;text-align:center;font-family:'Noto Kufi Arabic';font-weight:700;font-size:40px;color:#E8A33D;letter-spacing:1px}
.line{position:absolute;top:548px;left:390px;width:300px;height:3px;background:#E8A33D;box-shadow:0 0 12px #E8A33D}
</style></head><body>
<div class="ph host"></div><div class="ph crow"></div><div class="shade"></div>
<div class="title">اعترافات برّية</div><div class="ep">EPISODE 01</div><div class="line"></div>
<div class="hook">نذيرُ شؤم؟<br><b>ولا أذكى طائر؟</b></div>
<div class="guest">ضيف الحلقة: الغراب</div>
</body></html>
