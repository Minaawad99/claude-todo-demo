<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee5d0;--ink:#2a2016;--mute:#8f8576;--orange:#bd552f;--card:#f4ecdb}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1350px;background:var(--paper);font-family:"Noto Sans Arabic",sans-serif;color:var(--ink);
 background-image:linear-gradient(#e1d5ba 1.5px,transparent 1.5px),linear-gradient(90deg,#e1d5ba 1.5px,transparent 1.5px);background-size:54px 54px}
.frame{position:absolute;inset:36px;border:3px solid var(--ink)}
.logo{position:absolute;top:70px;right:84px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px}
.logo svg{width:58px;height:58px}
.wrap{position:absolute;top:130px;left:96px;right:96px;bottom:70px;display:flex;flex-direction:column;align-items:stretch;gap:28px}
h1{text-align:center;margin:0;font-size:84px;font-weight:900;line-height:1.2}
.deal{display:flex;justify-content:center;margin-top:-14px}
.deal span{background:var(--orange);color:#fff;font-weight:800;font-size:40px;padding:8px 34px;transform:rotate(-1.5deg)}
.box{background:var(--card);border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:22px 44px}

.tag{font-size:30px;font-weight:700;color:var(--mute);margin-bottom:6px}
.price{font-size:72px;font-weight:900;line-height:1.1}
.price s{font-size:44px;color:var(--mute);font-weight:700;margin-right:18px}
.line{font-size:36px;font-weight:700;margin-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #cbbd9c;padding-top:12px}
.line b{direction:ltr;font-weight:800;font-size:40px;color:var(--orange)}
.url{direction:ltr;text-align:left;font-size:34px;font-weight:800;color:var(--orange);margin-top:10px}
.steps{margin-top:6px;text-align:center;font-size:32px;font-weight:700;line-height:1.6}
.steps em{font-style:normal;color:var(--orange)}
.foot{position:absolute;bottom:66px;left:0;right:0;text-align:center;font-size:26px;color:var(--mute);font-weight:600}
</style></head><body>
<div class="frame"></div>
<div class="logo"><svg viewBox="0 0 200 200"><path d="M38 48 H190 V158 H104 L68 194 V158 H38 Z" fill="#2a2016"/><path d="M30 40 H182 V150 H96 L60 186 V150 H30 Z" fill="#f4ecdb" stroke="#2a2016" stroke-width="9" stroke-linejoin="round"/><text x="106" y="140" text-anchor="middle" style="font:800 120px 'Noto Sans Arabic';fill:#bd552f">؟</text></svg>إيه الحكاية؟</div>
<div class="wrap"><h1>طرق الدفع</h1>
<div class="deal"><span>🔥 خصم 50% لحد آخر نوفمبر</span></div>
<div class="box b1">
 <div class="tag">📱 تحويل محلي</div>
 <div class="price">750 جنيه<s>1500</s></div>
 <div class="line">أورانج كاش<b>01204039927</b></div>
 <div class="line">إنستاباي<b>minaawad99@instapay</b></div>
</div>
<div class="box b2">
 <div class="tag">💳 بالكارت · تحميل فوري</div>
 <div class="price">14.99$</div>
 <div class="url">meana8.gumroad.com/l/ai-video-kit</div>
</div>
<div class="steps">بعد التحويل ابعتولنا هنا <em>صورة التحويل</em> و<em>الإيميل</em><br>وهنبعت لينك تحميل الحزمة أول ما نتأكد من وصول المبلغ&nbsp;🙏</div>
</div>
</body></html>
