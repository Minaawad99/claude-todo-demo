  .brand { position: absolute; left: 0; right: 0; bottom: 62px; text-align: center; font: 700 12px "Noto Sans Arabic", sans-serif; color: #e0dbd0; text-shadow: 0 1px 3px #000; }
</style></head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
