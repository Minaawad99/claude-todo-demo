<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;background:#0c0a08;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#3a2510 0%,#140e09 55%,#0c0a08 100%)}
.ph{position:absolute;top:0;height:1080px;background-size:cover}
.host{left:0;width:860px;background-image:url(D.jpg);background-position:45% 22%;-webkit-mask-image:linear-gradient(90deg,#000 72%,transparent 100%)}
.crow{right:0;width:880px;background-image:url(C.jpg);background-position:30% 35%;-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent 100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.55) 0%,rgba(10,8,6,0) 30%,rgba(10,8,6,0) 55%,rgba(10,8,6,.92) 100%),radial-gradient(ellipse at 50% 70%,rgba(232,163,61,.22),transparent 55%)}
.q{position:absolute;bottom:70px;width:100%;text-align:center;font-family:Lalezar;font-size:250px;line-height:1;color:#FFD27A;
  text-shadow:0 0 22px rgba(232,163,61,.95),0 0 70px rgba(232,163,61,.6),0 8px 0 #6b3f0e,0 14px 30px rgba(0,0,0,.9)}
.show{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-family:'Noto Kufi Arabic';font-weight:900;font-size:58px;color:#fff;
  padding:6px 34px;border:3px solid #E8A33D;border-radius:14px;background:rgba(12,10,8,.65);box-shadow:0 0 24px rgba(232,163,61,.5)}
.ep{position:absolute;top:172px;width:100%;text-align:center;font-family:'IBM Plex Mono';font-size:28px;letter-spacing:9px;color:#F3E6CF}
</style></head><body>
<div class="bg"></div><div class="ph host"></div><div class="ph crow"></div><div class="shade"></div>
<div class="show">اعترافات برّية</div><div class="ep">EPISODE 01 · الغراب</div>
<div class="q">نذيرُ شؤم؟</div>
</body></html>
