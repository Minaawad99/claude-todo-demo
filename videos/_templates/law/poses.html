  <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9964e"/><stop offset=".5" stop-color="#e2b46e"/><stop offset="1" stop-color="#b07e3e"/></linearGradient>

<script>
  var ep = (location.search.match(/ep=([\w-]+)/) || [])[1] || "secret-basement";
  function load(src, cb) { var e = document.createElement("script"); e.src = src; e.onload = cb; document.body.appendChild(e); }
  load("../../" + ep + "/timing.js", function () { load("../people/person.js", function () { load("kit.js", function () { load("../../" + ep + "/law/scene.js", draw); }); }); });
  function draw() {
    var P = window.LAW || window.__parts, s = "", names = ["dig@0", "dig@0.25", "dig@0.5", "dig@0.75", "walk@0.25", "walk@0.75", "climb@0"].concat(Object.keys(P.POSES));
    names.forEach(function (n, i) { var x = 110 + (i % 9) * 215, y = 470 + Math.floor(i / 9) * 540, nm = n.split("@")[0], ph = +(n.split("@")[1] || 0);
      s += '<line x1="' + (x - 100) + '" y1="' + y + '" x2="' + (x + 100) + '" y2="' + y + '" stroke="#6a4a2a" stroke-width="6"/><text x="' + x + '" y="' + (y + 56) + '" text-anchor="middle" style="font:800 30px Noto Sans Arabic">' + n + '</text>';
      var p = P.pose(nm, ph), sit = /^sit/.test(nm), air = nm === "climb";
      if (sit) s += '<rect x="' + (x - 80) + '" y="' + (y - 110) + '" width="110" height="110" fill="#5f8fc0"/>';
      s += P.man(sit ? { hip: [x - 25, y - 120], f: 1, pose: p, mood: "n", t: 1 } : air ? { hip: [x, y - 200], f: 1, pose: p, mood: "n", t: 1 } : { x: x, y: y, f: 1, pose: p, mood: "n", t: 1 }); });
    document.getElementById("s").innerHTML = s; window.READY = true;
  }
</script></body></html>
