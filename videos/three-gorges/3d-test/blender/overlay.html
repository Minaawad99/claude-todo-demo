<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Three Gorges — Blender frames + captions</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Puts the captions of ../opening.html over the Blender (Cycles) frames in ./frames/f0001.png … (30 fps).
     ./frames is a local folder (not committed): link it to scene.py's output dir before rendering with videos/render.js. */
  body { margin: 0; background: #000; }
  .stage { position: relative; width: 360px; height: 640px; overflow: hidden; background: #000; }
  #bg { position: absolute; inset: 0; width: 360px; height: 640px; }
  .shade { position: absolute; left: 0; right: 0; top: 0; height: 230px; pointer-events: none;
           background: linear-gradient(rgba(8,16,30,.7), rgba(8,16,30,.3) 60%, rgba(8,16,30,0)); }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,.3)); }
  .tag { position: absolute; top: 20px; right: 16px; font: 800 12px 'Noto Sans Arabic'; color: rgba(255,255,255,.85); }
  .tag b { color: #ff7a45; }
  .cap { position: absolute; top: 52px; left: 14px; right: 14px; margin: 0; text-align: center;
         font: 900 31px/1.32 'Noto Sans Arabic'; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  .cap .w { display: inline-block; opacity: 0; }
  .hot { color: #ff7a45; }
</style></head><body>
<div class="stage">
  <img id="bg" alt="">
  <div class="shade"></div>
  <div class="vig"></div>
  <div class="tag">إيه الحكاية<b>؟</b></div>
  <p class="cap" id="cap1"><span class="w" data-t="0.25">السد</span> <span class="w" data-t="0.45">ده،</span><br><span class="w" data-t="0.85">خلّى</span> <span class="w" data-t="1.05">اليوم</span> <span class="w hot" data-t="1.3">أطول!</span></p>
  <p class="cap" id="cap2" style="opacity:0"><span class="w" data-t="2.75">الأرض</span> <span class="w" data-t="2.95">بقت</span><br><span class="w" data-t="3.15">بتلف</span> <span class="w hot" data-t="3.4">أبطأ!</span></p>
</div>
<script>
window.VIDEO_END = 4.6;
const FRAMES = 138, SRC_FPS = 30;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const bg = document.getElementById('bg');
const words = [...document.querySelectorAll('.w')].map(el => [el, +el.dataset.t]);
const cap1 = document.getElementById('cap1'), cap2 = document.getElementById('cap2');
window.renderAt = async function (t) {
  const f = clamp(Math.floor(t * SRC_FPS) + 1, 1, FRAMES);
  const src = `frames/f${String(f).padStart(4, '0')}.png`;
  if (!bg.src.endsWith(src)) { bg.src = src; await bg.decode(); }
  words.forEach(([el, t0]) => { const a = sm(t0, t0 + 0.2, t); el.style.opacity = a; el.style.transform = `translateY(${(1 - a) * 10}px) scale(${0.92 + 0.08 * a})`; });
  cap1.style.opacity = 1 - sm(2.45, 2.65, t); cap2.style.opacity = sm(2.6, 2.75, t);
};
renderAt(0);
</script>
</body></html>
