    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

      void main(){ vec3 d = normalize(vDir); float h = d.y;
        vec3 c = mix(hor, mid, smoothstep(0.0, 0.16, h)); c = mix(c, top, smoothstep(0.16, 0.75, h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        c += sunCol * (pow(s, 6.0) * 0.22 + pow(s, 60.0) * 0.5) * sunGlow + vec3(1.0, 0.86, 0.62) * smoothstep(0.9986, 0.9991, s) * 1.6 * sunGlow;
        gl_FragColor = vec4(c, 1.0); }`
  })));

    for (let i = 0; i < 1600; i++) { const th = rnd() * Math.PI * 2, y = 0.05 + rnd() * 0.95, r = Math.sqrt(1 - y * y); p.push(Math.cos(th) * r * 1800, y * 1800, Math.sin(th) * r * 1800); }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); }

      p.position.set(sgn * ax, yc + NY * 0.55, faceZ(yc) + NZ * 0.55); p.castShadow = p.receiveShadow = true; scene.add(p);
    }
    const par = new THREE.Mesh(new THREE.BoxGeometry(DAM_X * 2, 1.2, 0.5), concrete); par.position.set(0, CREST + 0.6, 1.8); scene.add(par);
    const par2 = par.clone(); par2.position.z = -2.8; scene.add(par2);
    for (let x = -DAM_X + 2; x < DAM_X; x += 3.6) { const pier = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.2, 5.2), concrete); pier.position.set(x, CREST + 1.1, -0.5); pier.castShadow = true; scene.add(pier); }
    const red = new THREE.MeshStandardMaterial({ color: 0xd8322a, roughness: 0.5 });
    [-72, -54, -36, -12, 10, 36, 56, 74].forEach(x => {   // red portal cranes on the crest (photos)
      [-1.4, 1.4].forEach(dx => [-2.9, 1.9].forEach(dz => { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, 0.5), red); leg.position.set(x + dx, CREST + 3, dz); leg.castShadow = true; scene.add(leg); }));
      const beam = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1, 5.6), red); beam.position.set(x, CREST + 6.3, -0.5); beam.castShadow = true; scene.add(beam);

    });
  }
  const GATES = []; for (let i = 0; i < 9; i++) GATES.push(-26 + i * 6.5);
  { const gg = new THREE.BoxGeometry(3, 0.7, 3); GATES.forEach(x => { const m = new THREE.Mesh(gg, darkMat); m.rotation.x = Math.atan2(19, 22); m.position.set(x, 9.5, faceZ(9.5) + 0.1); scene.add(m); }); }
  const winCanvas = document.createElement('canvas'); winCanvas.width = 512; winCanvas.height = 128;
  { const c = winCanvas.getContext('2d'); c.fillStyle = '#e1e4e6'; c.fillRect(0, 0, 512, 128); c.fillStyle = '#4f7fb4'; c.fillRect(0, 34, 512, 40); c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 512; i += 16) c.fillRect(i, 34, 2, 40); }
