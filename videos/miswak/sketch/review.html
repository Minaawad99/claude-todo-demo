<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#d9d0bb}svg{display:block}</style></head><body>
<svg id="s" width="1980" height="3540" viewBox="0 0 1980 3540"></svg>
<script src="../../_templates/people/person.js"></script>
<script src="../../_templates/people/gemini/sprites.js"></script>
<script src="draw.js"></script>
<script>
var Z = MW, C = Z.C, T = Z.T, out = "", SHEET = +(location.hash.slice(1) || 1), PR = "../refs/product/", LOGO = PR + "logo.png", VF = PR + "frames/";
var panels = [];
function panel(cap, inner) { panels.push([cap, inner]); }
function flush() {
  panels.forEach(function (p, i) {
    var x = 20 + (i % 3) * 660, y = 20 + Math.floor(i / 3) * 880, id = "c" + i, grid = "";
    for (var gx = 0; gx <= 640; gx += 32) grid += '<path d="M' + gx + ' 0 V786" stroke="#d9ccb0" stroke-width="1"/>'; for (var gy = 0; gy <= 786; gy += 32) grid += '<path d="M0 ' + gy + ' H640" stroke="#d9ccb0" stroke-width="1"/>';
    out += '<g transform="translate(' + x + ' ' + y + ')"><clipPath id="' + id + '"><rect width="640" height="786"/></clipPath><rect width="640" height="840" fill="#eee5d0" stroke="#2a2016" stroke-width="2"/>' +
      '<g clip-path="url(#' + id + ')">' + grid + p[1] + '</g><path d="M40 786 H600" stroke="#2a2016" stroke-width="1.5"/>' +
      '<text x="320" y="822" text-anchor="middle" style="font:800 24px \'Noto Sans Arabic\';fill:#2a2016">' + p[0] + '</text></g>';
  });
  document.getElementById("s").innerHTML = out;
}
var MAN = { outfit: "casual" };
if (SHEET === 1) {
  // 1 · hook: a drooping Arak branch, and one twig ends in a frayed brush of fibres
  panel("فيه فرشاة سنان بتطلع على الشجر…",
    Z.branch([[700, 60], [560, 90], [450, 150], [370, 240], [330, 340]], { w: 10, leaf: 58, berries: true }) +
    Z.branch([[700, 300], [600, 300], [520, 330], [470, 390]], { w: 8, leaf: 48, ph: 2 }) +
    Z.stick(150, 560, 360, 380, 26, { fray: 1 }) + Z.line([[360, 380], [372, 362], [388, 330]], "#d6cbb0", 9) +
    Z.tag(160, 560, "فرشاة؟", C.ORANGE, 1, 70) + Z.box(110, 120, 150, Z.T("؟", 0, 40, 110, C.ORANGE)));
  // 2 · older than the brush in your bathroom by thousands of years: a time line, old on the right (Arabic reading order)
  panel("من قبل الفرشاة اللي في حمامك بآلاف السنين",

    Z.stick(450, 360, 600, 300, 22, { fray: .8 }) + Z.T("آلاف السنين", 520, 540, 26, C.ORANGE) +
    Z.brushSide(70, 360, 210, { col: "#7fb2d6" }) + Z.T("فرشاتك", 160, 540, 26, C.INK) +
    Z.arrow(420, 600, 230, 600, C.INK, 3) + Z.T("قبل", 520, 610, 22, "#7d7364") + Z.T("دلوقتي", 160, 610, 22, "#7d7364"));
  // 3 · most of us tried it once… and threw it away after two days
  panel("أغلبنا جرّبها مرة… ورماها بعد يومين",
    PERSON.sprite("beard-miswak-sad", 260, 770, 640) + Z.bin(520, 760, 1.1) + Z.stick(490, 680, 560, 650, 12, { dry: 1, fray: .6 }) + Z.calendar(520, 160, 1.2, "يومين"));
  // 5 · the Arak shrub; the stick is a twig of it
  panel("فرع من شجرة اسمها الأراك",
    '<rect x="0" y="560" width="640" height="230" fill="#e2cf9f"/>' + Z.line([[0, 560], [640, 560]], C.INK, 2) + [[90, 610], [260, 660], [470, 620], [560, 700]].map(function (p) { return '<ellipse cx="' + p[0] + '" cy="' + p[1] + '" rx="18" ry="5" fill="#cdb682"/>'; }).join("") +
    Z.shrub(320, 560, 1.05) + Z.tag(470, 330, "الأراك", C.OLIVE, 1, -40) +

  // 7 · what's inside: the fibres, with silica grains (magnified circle)
  var g7 = ""; for (var i = 0; i < 14; i++) g7 += Z.line([[-150, -120 + i * 18], [150, -120 + i * 18 + 6 * Math.sin(i)]], i % 2 ? C.FIB : "#d8c497", 9);
  for (i = 0; i < 40; i++) g7 += '<circle cx="' + Z.f(-140 + 280 * Z.rnd(i)) + '' + '" cy="' + Z.f(-120 + 250 * Z.rnd(i + 40)) + '" r="' + Z.f(2.5 + 3 * Z.rnd(i + 7)) + '" fill="#fff" stroke="#4a6f8a" stroke-width="1.4"/>';
  panel("فيه مواد طبيعية، أشهرها السيليكا",
    Z.stick(80, 640, 470, 520, 44, { fray: 1 }) + Z.line([[150, 600], [300, 420]], C.INK, 1.5, ' stroke-dasharray="6 5"') +
    '<clipPath id="mg"><circle cx="400" cy="250" r="170"/></clipPath><circle cx="400" cy="250" r="170" fill="#f3e8cc"/><g clip-path="url(#mg)"><g transform="translate(400 250) scale(1.25)">' + g7 + '</g></g><circle cx="400" cy="250" r="170" fill="none" stroke="' + C.ORANGE + '" stroke-width="5"/>' +
    Z.tag(330, 300, "سيليكا", C.BLUE, -1, 90) + Z.tag(440, 170, "ألياف", C.OLIVE, 1, -60));
  // 8 · silica polishes the tooth surface gently, like a polishing cloth
  panel("بتلمّع سطح السنة بالراحة، زي قماشة التلميع",
    Z.jawCut(-20, 660, 520, [150, 470], { w: 230, h: 210, r: 230, stain: 1, stainK: .5 }) +
    Z.stick(150, 300, -60, 170, 34, { fray: 1 }) + [0, 1, 2].map(function (k) { return Z.line([[250 + k * 12, 330 + k * 22], [268 + k * 12, 318 + k * 22]], "#ffffff", 4); }).join("") +
    Z.tag(560, 330, "المينا", C.OLIVE, -1, -70) + Z.tag(88, 430, "العاج", C.INK, 1, 170) + Z.tag(460, 560, "العصب", "#a8443a", -1, 150) + Z.tag(310, 505, "اللثة", "#b5544a", 1, 150) +
    Z.box(120, 120, 180, '<rect x="-60" y="-20" width="120" height="44" fill="#c7d6e6" stroke="#2a2016" stroke-width="2"/>' + Z.blob([[-40, -40], [30, -50], [50, -10], [-10, 0], [-50, -10]], "#e9b949", 2) + Z.T("قماشة تلميع", 0, 62, 17, "#2a2016")));
  // 9 · and the WHO itself encouraged its use, in the eighties
  panel("ومنظمة الصحة العالمية نفسها شجّعت على استخدامه",
    '<rect x="150" y="150" width="340" height="440" fill="#fbf8f1" stroke="#2a2016" stroke-width="2.4"/>' + [0, 1, 2, 3, 4, 5, 6].map(function (k) { return Z.line([[190, 300 + k * 34], [450 - (k % 3) * 40, 300 + k * 34]], "#cfc6b4", 6); }).join("") +
    Z.T("منظمة الصحة العالمية", 320, 230, 26, C.BLUE) + Z.stick(210, 540, 420, 520, 18, { fray: .6 }) + Z.check(470, 560, 34) + Z.chip(320, 680, "التمانينات", C.ORANGE));
  // 11 · after two days the fibres go hard: soft today, stiff in two days, cut the end and start again
  panel("أليافه بعد يومين بتقسى، ولازم تقص الطرف",
    Z.stick(110, 230, 470, 230, 30, { fray: 1 }) + Z.chip(560, 230, "النهاردة", C.OLIVE) +
    Z.stick(110, 480, 470, 480, 30, { fray: 1, dry: 1, cut: 1 }) + Z.chip(560, 480, "بعد يومين", C.ORANGE) +
    Z.scissors(150, 620, .9, .8, -70) + Z.tag(170, 480, "ناشف", C.ORANGE, 1, 110));
  // 12 · the fibres stick out of the end: hard to reach the back teeth and the inner sides (upper arch seen from below)
  var a12 = Z.arch(320, 170, 210, 330, { hot: 5 });
  panel("صعب توصل بيها للضروس اللي ورا ولجوه",

    Z.tag(320, 380, "جوه", C.BLUE, 1, 60) + Z.tag(a12.back[-1][0], a12.back[-1][1] + 30, "الضروس اللي ورا", C.ORANGE, 1, 110));

  panel("طب لو أخدنا المسواك وحطيناه في شكل فرشاة؟",
    Z.stick(80, 250, 400, 250, 30, { fray: 1 }) + Z.arrow(320, 330, 320, 430, C.ORANGE, 5) + Z.G("translate(120 560)", Z.brushSide(0, 0, 400, { miswak: true, h: 70 })) + Z.T("؟", 560, 300, 120, C.ORANGE) + Z.logo(LOGO, 510, 62, 220));
  // 14 · the brand: the real product, logo on the right
  panel("في اليابان عملوا فرشاة اسمها سمارت مسواك",
    Z.photo(PR + "mizuha-powder.jpg", 250, 400, 360, 360, -2) + Z.photo(VF + "v19.8.jpg", 500, 520, 170, 302, 4) + Z.logo(LOGO, 510, 62, 220) + Z.tag(250, 300, "بودرة المسواك", C.ORANGE, 1, -90) + Z.chip(320, 700, "صنع اليابان", C.INK));
  // 15 · the bristles are needle-fine at the end, like a pencil point
  panel("الشعيرات رفيعة جدًا من الطرف، زي سن القلم",
    Z.bristle(200, 640, 420, 70, false) + Z.bristle(440, 640, 420, 70, true) + Z.chip(200, 700, "عادية", "#6d6a64") + Z.chip(440, 700, "مدبّبة", C.ORANGE) +
    Z.box(110, 110, 170, Z.pencil(0, 0, .9, -30)) + Z.logo(LOGO, 510, 62, 220));
  // 16 · into the gaps between the teeth, down to the gum line: one tooth cut from the side (outer face on the left), the brush

  panel("فبتدخل بين السنان وتوصل لحد خط اللثة",
    Z.jawCut(-20, 660, 520, [360], { w: 190, h: 230, r: 240 }) + Z.brushEnd(150, 330, 262, 506, { miswak: true, taper: true }) +
    Z.tag(262, 512, "خط اللثة", C.OLIVE, -1, 120) + Z.tag(470, 300, "المينا", C.OLIVE, 1, -60) + Z.tag(520, 560, "اللثة", "#b5544a", -1, 140) + Z.box(130, 130, 200, Z.G("scale(.62)", Z.frontTeeth(0, 70, 110, 190, true))) + Z.T("بين السنان", 130, 262, 20, C.ORANGE) + Z.logo(LOGO, 510, 62, 220));
  // 17-18 · the myth: hard filaments jab the gum (red scratches); soft fine ones bow along it
  panel("الخشنة ممكن تجرح اللثة… والناعمة لأ",
    Z.jawCut(-20, 660, 540, [190, 500], { w: 150, h: 190, r: 200 }) +
    Z.brushEnd(40, 380, 112, 530, { hard: true, col: "#c9cdd1" }) + [0, 1, 2].map(function (k) { return Z.line([[96 + k * 8, 532 + k * 6], [110 + k * 8, 540 + k * 6]], "#a8322a", 4); }).join("") + Z.cross(80, 250, 26) +
    Z.brushEnd(350, 380, 422, 530, { taper: true, miswak: true, bend: .8 }) + Z.check(390, 250, 26) + Z.chip(120, 730, "خشنة", "#6d6a64") + Z.chip(430, 730, "ناعمة", C.OLIVE));
  // 19 · use it without paste when you're out: at work or travelling
  panel("من غير معجون وانت برّه البيت، في الشغل أو السفر",
    PERSON.sprite("c-office", 400, 770, 640) +
    Z.box(110, 170, 160, '<rect x="-56" y="-30" width="112" height="76" rx="8" fill="#8d5d35" stroke="#2a2016" stroke-width="2"/><rect x="-22" y="-44" width="44" height="16" rx="5" fill="none" stroke="#2a2016" stroke-width="4"/>' + Z.T("الشغل", 0, 70, 17)) +
    Z.box(110, 370, 160, Z.poly([[-60, 6], [50, -6], [62, 0], [50, 6], [-60, 8]], "#d9dde1", 2) + Z.poly([[-6, 2], [20, -36], [30, -36], [14, 2]], "#c3c9ce", 2) + Z.poly([[-50, 2], [-60, -20], [-52, -20], [-38, 2]], "#c3c9ce", 2) + Z.T("السفر", 0, 70, 17)) + Z.logo(LOGO, 510, 62, 220));
  // 20 · a kids' size and a small pocket one with a cap (real photo)
  panel("مقاس للأطفال، ونسخة صغيرة بغطا تتحط في جيبك",
    Z.photo(VF + "v25.9.jpg", 200, 330, 250, 444, -3) + Z.photo(VF + "v28.2.jpg", 450, 470, 250, 444, 3) + Z.logo(LOGO, 510, 62, 220) + Z.chip(200, 600, "بغطا للجيب", C.ORANGE) + Z.chip(450, 740, "مقاس أطفال", C.OLIVE));
  // 18b · the real brush: soft fine bristles bend under a finger (the partner's video)
  panel("الناعمة: الشعيرات بتنثني ومابتجرحش",
    Z.photo(VF + "v23.5.jpg", 320, 400, 330, 586, -2) + Z.logo(LOGO, 510, 62, 220) + Z.chip(320, 740, "ناعمة", C.OLIVE));
  // 19b · out of the house: the brush in a bag (the partner's video)
  panel("في شنطتك، في الشغل أو السفر",
    Z.photo(VF + "v34.2.jpg", 320, 400, 330, 586, 2) + Z.logo(LOGO, 510, 62, 220));
  // 21 · like any brush, change it every three months
  panel("وزي أي فرشاة، بتغيّرها كل تلات شهور",
    [0, 1, 2].map(function (k) { return Z.calendar(160 + k * 160, 230, 1.4, ["شهر 1", "شهر 2", "شهر 3"][k]); }).join("") + Z.arrow(110, 340, 530, 340, C.ORANGE, 4) +
    Z.G("translate(110 560)", Z.brushSide(0, 0, 330, { miswak: true, taper: true, h: 60 })) + Z.chip(320, 700, "3 شهور", C.ORANGE) + Z.logo(LOGO, 510, 62, 220));
  // 22 · recap: the miswak idea, in a brush that reaches everywhere, nothing to cut
  var a22 = Z.arch(320, 200, 190, 290, {});
  panel("فكرة المسواك نفسها، بس في فرشاة بتوصل لكل حتة",
    a22.svg + Z.G("translate(200 120) rotate(30)", Z.brushSide(0, 0, 260, { miswak: true, taper: true, h: 40, down: true })) + Z.check(130, 560, 26) + Z.check(510, 560, 26) + Z.check(320, 700, 26));
  // 23 · the odd fact: سواك comes from ساك, «to rub»
  panel("كلمة سواك نفسها جاية من ساك، يعني دلَك",
    '<rect x="150" y="160" width="340" height="140" rx="10" fill="#fbf8f1" stroke="#2a2016" stroke-width="2.4"/>' + Z.T("سِواك", 320, 260, 76, C.INK) + Z.arrow(320, 320, 320, 400, C.ORANGE, 5) +
    '<rect x="150" y="420" width="340" height="140" rx="10" fill="#fbf8f1" stroke="#2a2016" stroke-width="2.4"/>' + Z.T("ساكَ = دَلَكَ", 320, 520, 60, C.ORANGE) + Z.stick(170, 680, 470, 640, 20, { fray: .8 }) + Z.arrow(500, 640, 580, 620, C.INK, 3) + Z.arrow(160, 700, 90, 720, C.INK, 3));
}
flush();
