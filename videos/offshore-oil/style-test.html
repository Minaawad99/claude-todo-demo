<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Offshore oil — style test</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Sans+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* realistic-detail test: each piece of kit drawn from its real shape, lit like a 3D model */
  body { margin: 0; background: #000; }
  .frame { position: relative; width: 360px; height: 640px; background: #000; overflow: hidden; }
  .title { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font: 700 30px/1.2 "Aref Ruqaa", serif; color: #fff; }
  .sub { position: absolute; left: 0; right: 0; top: 136px; text-align: center; font: 700 19px/1.2 "Aref Ruqaa", serif; color: #f2c230; }
  .panel { position: absolute; left: 0; right: 0; top: 196px; height: 203px; overflow: hidden; }
  .panel svg { display: block; width: 100%; height: 100%; }
  .cap { position: absolute; left: 18px; right: 18px; top: 432px; text-align: center; font: 800 20px/1.6 "Noto Sans Arabic", sans-serif; color: #fff; }
  .cap b { color: #f2c230; }
  .tag { font: 800 20px "Noto Sans Arabic", sans-serif; fill: #2b2016; }
</style></head>
<body>
<div id="frames"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a6a"/><stop offset=".45" stop-color="#d46a3c"/><stop offset=".7" stop-color="#f2a85a"/><stop offset="1" stop-color="#f7c98a"/></linearGradient>
  <linearGradient id="seaS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4f74"/><stop offset="1" stop-color="#14223a"/></linearGradient>
  <linearGradient id="hullB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d5c9a"/><stop offset="1" stop-color="#16325a"/></linearGradient>
  <linearGradient id="hullW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ec"/><stop offset="1" stop-color="#bdb8ad"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a6068"/><stop offset=".45" stop-color="#c9ced4"/><stop offset=".6" stop-color="#9aa2ac"/><stop offset="1" stop-color="#4a5058"/></linearGradient>
  <linearGradient id="bitBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3d42"/><stop offset=".4" stop-color="#8a9098"/><stop offset=".55" stop-color="#b9bfc6"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
  <radialGradient id="cone" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c9a65a"/><stop offset=".6" stop-color="#8a6a30"/><stop offset="1" stop-color="#4a3818"/></radialGradient>
  <radialGradient id="pdc" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#d9dee4"/><stop offset="1" stop-color="#6a727c"/></radialGradient>
  <linearGradient id="bopRed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a1c14"/><stop offset=".45" stop-color="#d8452e"/><stop offset="1" stop-color="#6a1810"/></linearGradient>
  <linearGradient id="bopYel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a10"/><stop offset=".45" stop-color="#f2c230"/><stop offset="1" stop-color="#8a5c0c"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e3a5c"/><stop offset="1" stop-color="#04121f"/></linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7a5a"/><stop offset="1" stop-color="#5a4a34"/></linearGradient>
  <path id="swash" d="M6 14 C40 4 120 2 196 8 C214 10 222 20 214 30 C206 44 140 46 70 44 C30 44 4 40 2 30 C0 24 2 18 6 14 Z"/>
</defs></svg>
<script>
function tag(t, x, y, r, sz, col) { var w = t.length * (sz || 20) * 0.52 + 40; return '<g transform="translate(' + x + ' ' + y + ') rotate(' + (r || -3) + ')"><use href="#swash" fill="' + (col || "#e8c48e") + '" transform="translate(' + (-w / 2) + ' ' + (-(sz || 20) * 1.05) + ') scale(' + (w / 220) + ' ' + ((sz || 20) * 0.072) + ')"/><text x="0" y="' + ((sz || 20) * 0.35) + '" text-anchor="middle" class="tag" style="font-size:' + (sz || 20) + 'px">' + t + '</text></g>'; }
// lattice derrick: tapered steel truss with X-bracing
function derrick(x, y, w0, w1, h) { var s = '<path d="M' + (x - w0 / 2) + ' ' + y + ' L' + (x - w1 / 2) + ' ' + (y - h) + ' M' + (x + w0 / 2) + ' ' + y + ' L' + (x + w1 / 2) + ' ' + (y - h) + '" stroke="#e9e4d8" stroke-width="3"/>'; for (var k = 0; k < 9; k++) { var a = y - h * k / 9, b = y - h * (k + 1) / 9, wa = w0 + (w1 - w0) * k / 9, wb = w0 + (w1 - w0) * (k + 1) / 9; s += '<path d="M' + (x - wa / 2) + ' ' + a + ' L' + (x + wb / 2) + ' ' + b + ' M' + (x + wa / 2) + ' ' + a + ' L' + (x - wb / 2) + ' ' + b + ' M' + (x - wb / 2) + ' ' + b + ' H' + (x + wb / 2) + '" stroke="#d9d3c4" stroke-width="1.4"/>'; } return s + '<rect x="' + (x - w1 / 2 - 4) + '" y="' + (y - h - 8) + '" width="' + (w1 + 8) + '" height="8" fill="#c23a26" stroke="#1c1c1c"/>'; }
var P = [];
// 1) the drillship at sunset (real layout: helideck at the bow, derrick amidships, cranes, accommodation block)
P.push({ cap: "بعدها ييجي دور <b>الحفر</b>، من <b>سفينة حفر</b>", svg:
  '<rect width="640" height="360" fill="url(#skyS)"/><circle cx="590" cy="196" r="70" fill="#ffe2a8" opacity=".6" filter="url(#soft)"/><circle cx="590" cy="200" r="28" fill="#fff1c8"/>' +
  '<g filter="url(#soft)" fill="#f7c98a" opacity=".7"><ellipse cx="420" cy="90" rx="120" ry="12"/><ellipse cx="200" cy="120" rx="90" ry="8"/></g>' +
  '<rect y="220" width="640" height="140" fill="url(#seaS)"/>' + Array.from({ length: 14 }, (_, i) => '<path d="M' + (i * 50 - 20) + ' ' + (232 + (i % 4) * 26) + ' q12 -4 24 0" stroke="#f2a85a" stroke-width="2" fill="none" opacity=".55"/>').join("") +
  '<path d="M570 228 L610 228 L620 250 L560 250 Z" fill="#f2a85a" opacity=".55"/>' +
  // hull
  '<path d="M90 222 L560 222 L540 258 L118 258 Z" fill="url(#hullB)" stroke="#0c1a2c" stroke-width="2"/><path d="M96 222 H556 V230 H98 Z" fill="#c23a26"/><path d="M118 258 L540 258" stroke="#0c1a2c" stroke-width="2"/>' +
  // bow: accommodation + helideck
  '<rect x="120" y="178" width="90" height="44" fill="url(#hullW)" stroke="#5a5a5a"/>' + Array.from({ length: 12 }, (_, i) => '<rect x="' + (126 + (i % 6) * 14) + '" y="' + (186 + Math.floor(i / 6) * 16) + '" width="9" height="7" fill="#ffd98a"/>').join("") +
  '<path d="M96 172 H186 L176 180 H106 Z" fill="#e2b035" stroke="#5a4a20"/><circle cx="141" cy="175" r="6" fill="none" stroke="#fff" stroke-width="1.6"/>' +
  // derrick amidships + drill floor + pipe rack
  '<rect x="300" y="200" width="100" height="22" fill="url(#hullW)" stroke="#5a5a5a"/>' + derrick(350, 200, 66, 20, 150) +
  '<rect x="420" y="208" width="90" height="14" fill="#8a929c" stroke="#3a3d42"/>' + Array.from({ length: 6 }, (_, i) => '<path d="M424 ' + (210 + i * 2) + ' H506" stroke="#5a6068" stroke-width="1.6"/>').join("") +
  // cranes
  '<path d="M240 222 V176 L296 150" stroke="#f2c230" stroke-width="5" fill="none"/><path d="M520 222 V184 L570 160" stroke="#f2c230" stroke-width="5" fill="none"/>' +
  // lights
  '<circle cx="350" cy="44" r="5" fill="#ff3b2f" filter="url(#glow)"/>' + [260, 300, 400, 470].map(x => '<circle cx="' + x + '" cy="218" r="2.4" fill="#fff6c8"/>').join("") +
  tag("سفينة حفر", 520, 70, 3) });
// 2) the two real drill bits: tricone (3 rolling cones with steel teeth) and PDC (blades with diamond cutters)
P.push({ cap: "وفي آخرها <b>بريمة</b>، فيها <b>تروس مسننة</b> أو <b>ألماظ صناعي</b>", svg:
  '<rect width="640" height="360" fill="#e9e1cf"/>' + Array.from({ length: 17 }, (_, i) => '<path d="M' + (i * 40) + ' 0 V360" stroke="#d9cdb3" stroke-width="2"/>').join("") + Array.from({ length: 10 }, (_, i) => '<path d="M0 ' + (i * 40) + ' H640" stroke="#d9cdb3" stroke-width="2"/>').join("") +
  // tricone: pin (threaded), shank, three legs, three cones
  '<g transform="translate(180 175)"><ellipse cx="0" cy="118" rx="96" ry="14" fill="#2b2620" opacity=".25" filter="url(#soft2)"/>' +
  '<path d="M-26 -150 H26 L22 -96 H-22 Z" fill="url(#bitBody)" stroke="#1c1c1c" stroke-width="2"/>' + Array.from({ length: 8 }, (_, i) => '<path d="M-24 ' + (-146 + i * 7) + ' L24 ' + (-142 + i * 7) + '" stroke="#2b2e33" stroke-width="1.6"/>').join("") +
  '<path d="M-58 -96 H58 L66 -40 C66 -20 50 -6 30 0 H-30 C-50 -6 -66 -20 -66 -40 Z" fill="url(#bitBody)" stroke="#1c1c1c" stroke-width="2"/>' +
  '<g><path d="M-70 -10 C-96 30 -80 80 -40 92 C-10 100 4 60 -6 30 Z" fill="url(#cone)" stroke="#1c1c1c" stroke-width="2"/>' + Array.from({ length: 12 }, (_, i) => { var a = i / 12; return '<path d="M' + (-80 + a * 60) + ' ' + (10 + a * 70) + ' l-8 6 l10 2 Z" fill="#d9dee4" stroke="#1c1c1c" stroke-width=".8"/>'; }).join("") + '</g>' +
  '<g><path d="M70 -10 C96 30 80 80 40 92 C10 100 -4 60 6 30 Z" fill="url(#cone)" stroke="#1c1c1c" stroke-width="2"/>' + Array.from({ length: 12 }, (_, i) => { var a = i / 12; return '<path d="M' + (80 - a * 60) + ' ' + (10 + a * 70) + ' l8 6 l-10 2 Z" fill="#d9dee4" stroke="#1c1c1c" stroke-width=".8"/>'; }).join("") + '</g>' +
  '<g><path d="M-30 20 C-40 60 -20 104 0 108 C20 104 40 60 30 20 Z" fill="url(#cone)" stroke="#1c1c1c" stroke-width="2"/>' + Array.from({ length: 9 }, (_, i) => '<path d="M' + (-18 + (i % 3) * 18) + ' ' + (40 + Math.floor(i / 3) * 22) + ' l6 -8 l6 8 Z" fill="#d9dee4" stroke="#1c1c1c" stroke-width=".8"/>').join("") + '</g>' +
  '<circle cx="-40" cy="-30" r="5" fill="#1c1c1c"/><circle cx="40" cy="-30" r="5" fill="#1c1c1c"/></g>' +
  // PDC: pin, body, 5 spiral blades studded with round diamond cutters
  '<g transform="translate(460 175)"><ellipse cx="0" cy="104" rx="96" ry="14" fill="#2b2620" opacity=".25" filter="url(#soft2)"/>' +
  '<path d="M-26 -150 H26 L22 -96 H-22 Z" fill="url(#bitBody)" stroke="#1c1c1c" stroke-width="2"/>' + Array.from({ length: 8 }, (_, i) => '<path d="M-24 ' + (-146 + i * 7) + ' L24 ' + (-142 + i * 7) + '" stroke="#2b2e33" stroke-width="1.6"/>').join("") +
  '<path d="M-70 -96 H70 L76 40 C76 74 40 96 0 96 C-40 96 -76 74 -76 40 Z" fill="#2f3438" stroke="#1c1c1c" stroke-width="2"/>' +
  [-56, -28, 0, 28, 56].map((bx, j) => '<path d="M' + (bx - 10) + ' -94 L' + (bx + 10) + ' -94 L' + (bx * 0.7 + 12) + ' 90 L' + (bx * 0.7 - 12) + ' 90 Z" fill="url(#bitBody)" stroke="#1c1c1c" stroke-width="1.6"/>' + Array.from({ length: 6 }, (_, i) => '<circle cx="' + (bx * (1 - i * 0.06)) + '" cy="' + (-70 + i * 30) + '" r="7" fill="url(#pdc)" stroke="#1c1c1c" stroke-width="1.2"/>').join("")).join("") +
  [-40, 0, 40].map(nx => '<circle cx="' + nx + '" cy="60" r="5" fill="#1c1c1c"/>').join("") + '</g>' +
  tag("Tricone: تروس بتلف", 180, 340, -2, 16) + tag("PDC: ألماظ صناعي", 460, 340, 2, 16) });
// 3) on the seabed: the BOP stack (red ram preventers + yellow annular), riser up to the ship, wellhead into the rock
P.push({ cap: "وعلى القاع، فيه جهاز ضخم اسمه <b>مانع الانفجار</b>", svg:
  '<rect width="640" height="360" fill="url(#deep)"/>' + Array.from({ length: 40 }, (_, i) => '<circle cx="' + ((i * 97) % 640) + '" cy="' + ((i * 53) % 300) + '" r="1.4" fill="#fff" opacity=".35"/>').join("") +
  '<path d="M0 300 Q160 288 320 300 T640 296 V360 H0 Z" fill="url(#rock)"/>' +
  // riser with buoyancy modules
  '<rect x="306" y="0" width="28" height="160" fill="url(#steel)" stroke="#1c1c1c"/>' + [10, 60, 110].map(y => '<rect x="292" y="' + y + '" width="56" height="34" rx="6" fill="#e9e4d8" stroke="#1c1c1c"/>').join("") +
  // LMRP + annulars (yellow), ram stack (red) with side outlets, frame, wellhead
  '<rect x="250" y="160" width="140" height="10" fill="#5a6068" stroke="#1c1c1c"/>' +
  '<rect x="276" y="170" width="88" height="34" rx="8" fill="url(#bopYel)" stroke="#1c1c1c" stroke-width="2"/>' +
  [204, 232, 260].map(y => '<rect x="262" y="' + y + '" width="116" height="24" rx="4" fill="url(#bopRed)" stroke="#1c1c1c" stroke-width="2"/><rect x="236" y="' + (y + 6) + '" width="26" height="12" fill="url(#steel)" stroke="#1c1c1c"/><rect x="378" y="' + (y + 6) + '" width="26" height="12" fill="url(#steel)" stroke="#1c1c1c"/>').join("") +
  '<path d="M246 160 V292 M394 160 V292" stroke="#c9ced4" stroke-width="6"/><path d="M246 292 H394" stroke="#c9ced4" stroke-width="6"/>' +
  '<rect x="300" y="284" width="40" height="22" fill="url(#steel)" stroke="#1c1c1c"/><rect x="310" y="306" width="20" height="54" fill="#3a3d42" stroke="#1c1c1c"/>' +
  '<circle cx="420" cy="190" r="6" fill="#5bbf6a" filter="url(#glow)"/>' +
  // ROV lights for depth feel
  '<g transform="translate(520 220)"><rect x="-40" y="-24" width="80" height="48" rx="8" fill="#f2c230" stroke="#1c1c1c" stroke-width="2"/><circle cx="-40" cy="0" r="7" fill="#fff6c8" filter="url(#glow)"/><path d="M-40 0 L-150 -30 L-150 30 Z" fill="#fff6c8" opacity=".12"/></g>' +
  tag("مانع الانفجار", 150, 70, -3) });
var host = document.getElementById("frames");
P.forEach(function (p) { host.insertAdjacentHTML("beforeend", '<div class="frame"><div class="title">إزاي بيطلّعوا النفط؟</div><div class="sub">من تحت قاع المحيط!</div><div class="panel"><svg viewBox="0 0 640 360">' + p.svg + '<rect width="640" height="360" filter="url(#grain)"/></svg></div><div class="cap">' + p.cap + '</div></div>'); });
</script>
</body></html>
