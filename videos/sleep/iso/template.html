<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ليه بنحتاج ننام؟ (إيزومتريك) — إيه الحكاية؟</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* the full isometric version: one isometric world on paper fills the frame; the camera travels between its stations.
     Title on a paper fade at the top, two-line captions revealed word by word at the bottom, a summary strip on the last line. */
  html, body { margin: 0; background: #eee5d0; }
  .canvas { position: relative; width: 360px; height: 640px; overflow: hidden; background: #eee5d0; font-family: "Noto Sans Arabic", sans-serif; color: #2b2b2b; }
  #world { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
  .fadeT { position: absolute; left: 0; right: 0; top: 0; height: 128px; background: linear-gradient(#eee5d0 58%, rgba(238,229,208,0)); }
  .fadeB { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: linear-gradient(rgba(238,229,208,0), #eee5d0 40%); }
  .brand { position: absolute; right: 18px; top: 20px; font: 600 10px "Noto Sans Arabic", sans-serif; color: #6a6458; }
  .title { position: absolute; left: 0; right: 0; top: 36px; text-align: center; font: 900 27px/1.3 "Noto Sans Arabic", sans-serif; }
  .sub { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 700 12.5px/1.3 "Noto Sans Arabic", sans-serif; color: #c4532c; }
  .cap { position: absolute; left: 20px; right: 20px; top: 522px; text-align: center; font: 800 18px/1.6 "Noto Sans Arabic", sans-serif; }
  .cap span { opacity: .22; } .cap span.on { opacity: 1; }
  .cap .b { color: #46698a; } .cap .r { color: #c4532c; } .cap .g { color: #6b7d3c; }
  .sum { position: absolute; left: 18px; right: 18px; top: 418px; display: none; background: rgba(238,229,208,.94); border-top: 1px solid #2b2b2b; border-bottom: 1px solid #2b2b2b; padding: 6px 2px; }
  .sum .row { display: flex; align-items: center; gap: 10px; }
  .sum .n { font: 900 34px/1 "Noto Sans Arabic", sans-serif; color: #c4532c; direction: ltr; }
  .sum .t { font: 700 11px/1.5 "Noto Sans Arabic", sans-serif; }
  .sum .leg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 4px; font: 700 11px/1.6 "Noto Sans Arabic", sans-serif; }
  .sum .leg b { display: inline-block; width: 15px; height: 15px; line-height: 15px; border-radius: 50%; background: #2b2b2b; color: #fff; text-align: center; font: 800 9px "Noto Sans Arabic"; margin-left: 5px; }
</style></head>
<body>
<div class="canvas">
  <svg id="world" viewBox="0 0 360 640"></svg>
  <div class="fadeT"></div><div class="fadeB"></div>
  <div class="brand">إيه الحكاية؟</div>
  <div class="title">ليه بنحتاج ننام؟</div>
  <div class="sub">جوه مخك وإنت نايم</div>
  <div class="sum" id="sum"><div class="row"><div class="n">60%</div><div class="t">المسافات بين خلايا المخ بتوسع<br>في النوم العميق (في الفيران)</div></div>
    <div class="leg"><span><b>1</b>المخ بيتغسل من الفضلات</span><span><b>2</b>الذكريات بتترتب</span><span><b>3</b>دورات كل 90 دقيقة</span><span><b>4</b>7 ساعات على الأقل</span></div></div>
  <div class="cap" id="cap"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2b2b2b" stroke-width="1" opacity=".16"/></pattern>
  <filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter>
  <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="cylSh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
  <radialGradient id="ballSh" cx=".36" cy=".32" r=".72"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
</defs></svg>
<script src="../timing.js"></script>
<script>/*CAPS*/</script>
<script>window.VIDEO_END = TIMING.duration;</script>
<script src="scenes.js"></script>
<script>
  (function () {
    var LN = TIMING.lines, cap = document.getElementById("cap"), svg = document.getElementById("world"), sum = document.getElementById("sum"), num = document.querySelector("#sum .n"), cur = -1;
    window.renderAt = function (t) {
      var i = window.__world(svg, t), c = CAPS[i], l = LN[i], last = i === LN.length - 1;
      if (i !== cur) { cap.innerHTML = c.w.map(function (w, k) { return '<span class="' + (c.k[k] || "") + '">' + w + '</span>'; }).join(" "); sum.style.display = last ? "block" : "none"; cur = i; }
      var tot = c.w.join("").length, acc = 0, sp = cap.children;
      for (var k = 0; k < sp.length; k++) { var at = l.start + (l.end - l.start) * (acc / tot) - 0.05; sp[k].classList.toggle("on", t >= at); acc += c.w[k].length; }
      if (last) { var a = Math.min(1, (t - l.start) / 0.4); sum.style.opacity = a; num.textContent = Math.round(60 * Math.min(1, (t - l.start) / 1.6)) + "%"; }
    };
    renderAt(30);
  })();
</script>
</body></html>
