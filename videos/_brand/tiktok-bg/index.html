<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>خلفية تيكتوك — إيه الحكاية؟</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Noto+Serif:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* TikTok page background, 1080×1920, in the «اسكتش» hand: cream graph paper, ink outlines, real shapes, leader-line labels. */
  html, body { margin: 0; background: #eee5d0; }
  #art { width: 1080px; height: 1920px; display: block; }
</style></head><body>
<svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>window.TIMING = { lines: [], duration: 0 }; window.__t = 0;</script>
<script src="../../_templates/sketch/_helpers.js"></script>
<script src="../../lib/geo.min.js"></script>
<script src="figs.js"></script>
<script>
var W = 1080, H = 1920, s = "";
var defs = '<defs><pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0 H0 V54" stroke="#e1d5ba" stroke-width="1.6" fill="none"/></pattern>' +
  '<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V9" stroke="#2a2016" stroke-width="1.3" opacity=".15"/></pattern>' +
  '<filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter></defs>';

// paper + grid + grain
s += '<rect width="1080" height="1920" fill="' + PAPER + '"/><rect width="1080" height="1920" fill="url(#grid)"/><rect width="1080" height="1920" filter="url(#paperN)"/>';

// double frame + crop marks (like the intro / summary cards)
function frame() {
  var o = '<rect x="42" y="42" width="996" height="1836" fill="none" stroke="' + INK + '" stroke-width="3"/><rect x="56" y="56" width="968" height="1808" fill="none" stroke="' + INK + '" stroke-width="1.4"/>';
  [[42, 42, -1, -1], [1038, 42, 1, -1], [42, 1878, -1, 1], [1038, 1878, 1, 1]].forEach(function (c) {
    o += '<path d="M' + (c[0] + c[2] * 8) + ' ' + c[1] + ' h' + (c[2] * 22) + ' M' + c[0] + ' ' + (c[1] + c[3] * 8) + ' v' + (c[3] * 22) + '" stroke="' + INK + '" stroke-width="1.6"/>';
  });
  return o;
}

// ── top: the Earth and the Moon (from «المد والجزر»), the sun peeking in at the corner ──
var sky = "";
sky += sun(150, 170, 62, 0.4);
sky += bulge(430, 520, 200, .55, -30, "#5f7f97");
sky += globe(430, 520, 200, 30, 18);
sky += moon(880, 300, 66);
sky += '<path d="M600 455 Q 720 380 800 330" fill="none" stroke="' + INK + '" stroke-width="2" stroke-dasharray="8 9"/>';
sky += arrow(630, 470, 790, 360, ORANGE, 5);
sky += label(880, 360, 940, 470, "القمر", INK, 1, 34);
sky += label(318, 440, 220, 330, "الأرض", INK, 1, 34);
sky += label(632, 600, 760, 640, "المد", BLUE, 1, 34);

// ── middle: the name ──
var mid = "";
// stopwatch ring round the mark (the bumper)
var mx = 540, my = 905, mr = 92;
mid += '<circle cx="' + mx + '" cy="' + my + '" r="' + mr + '" fill="#f4ecdb" stroke="' + INK + '" stroke-width="3"/>';
var a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * .72;
mid += '<path d="M' + f(mx + Math.cos(a0) * (mr + 14)) + ' ' + f(my + Math.sin(a0) * (mr + 14)) + ' A' + (mr + 14) + ' ' + (mr + 14) + ' 0 1 1 ' + f(mx + Math.cos(a1) * (mr + 14)) + ' ' + f(my + Math.sin(a1) * (mr + 14)) + '" fill="none" stroke="' + ORANGE + '" stroke-width="12" stroke-linecap="round"/>';
mid += '<circle cx="' + mx + '" cy="' + my + '" r="' + (mr + 22) + '" fill="none" stroke="' + INK + '" stroke-width="1.4" stroke-dasharray="2 10"/>';
mid += G("translate(" + (mx - 70) + " " + (my - 76) + ") scale(.7)", '<rect x="84" y="4" width="32" height="10" fill="#2a2016"/><rect x="94" y="14" width="12" height="14" fill="#2a2016"/><path d="M30 40 H182 V150 H96 L60 186 V150 H30 Z" transform="translate(8 8)" fill="#2a2016"/><path d="M30 40 H182 V150 H96 L60 186 V150 H30 Z" fill="#f4ecdb" stroke="#2a2016" stroke-width="9" stroke-linejoin="round"/><text x="106" y="140" text-anchor="middle" style="font:800 120px Noto Sans Arabic;fill:#bd552f">؟</text>');
// the word
mid += '<text x="546" y="1162" text-anchor="middle" style="font:900 150px Noto Sans Arabic;fill:' + INK + ';opacity:.13" >إيه الحكاية؟</text>';
mid += '<text x="540" y="1156" text-anchor="middle" style="font:900 150px Noto Sans Arabic;fill:' + INK + '">إيه الحكاية<tspan style="fill:' + ORANGE + '">؟</tspan></text>';
mid += '<path d="M300 1205 H780" stroke="' + INK + '" stroke-width="2"/>';
mid += '<text x="540" y="1268" text-anchor="middle" style="font:700 46px Noto Sans Arabic;fill:' + INK + '">هشرحهالك في <tspan style="fill:' + ORANGE + '">دقيقة.</tspan></text>';
mid += '<text x="540" y="1322" text-anchor="middle" style="font:600 28px Noto Sans Arabic;fill:' + MUTE + '">علوم · تكنولوجيا · جسم الإنسان · حاجات حوالينا</text>';

// ── bottom: a person in real proportions and the things we draw ──
var bot = "";
var FL = 1760;
bot += '<path d="M60 ' + FL + ' H1020" stroke="' + INK + '" stroke-width="3"/><rect x="58" y="' + FL + '" width="964" height="102" fill="#e3d7bd"/><rect x="58" y="' + FL + '" width="964" height="102" fill="url(#hatch)" opacity=".5"/>';
// the person faces right (the figure is drawn facing left, so it is mirrored about x = 250), one hand pointing at the stopwatch
var px = 250, sc = .78, hipY = FL - (HB.thigh + HB.shin + HB.ankle) * sc;
var p = fig({ x: px, y: hipY, s: sc, lean: -3, shirt: SHIRT_V, hands: [[px - 180, hipY - 120], null], bend: [1, -1], legs: [[6, -2], [-6, 2]] });
bot += G("translate(" + (2 * px) + " 0) scale(-1 1)", p.far + p.body + p.near);
// a stopwatch on a little stand
bot += stopwatch(540, 1600, 76, .25);
bot += label(612, 1585, 690, 1560, "دقيقة واحدة", ORANGE, 1, 30);
// the house / gear / lightbulb doodles at the right
function bulb(x, y, sc) {
  return G("translate(" + x + " " + y + ") scale(" + sc + ")",
    '<path d="M-46 -10 C-46 -70 46 -70 46 -10 C46 18 26 32 22 56 L-22 56 C-26 32 -46 18 -46 -10 Z" fill="#f1dca0" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M-14 50 L-14 10 Q0 -12 14 10 L14 50" fill="none" stroke="' + ORANGE + '" stroke-width="3"/>' +
    R(-24, 56, 48, 14, GREY, 2.6) + R(-22, 70, 44, 14, GREY, 2.6) + R(-14, 84, 28, 10, INK, 0, 3));
}
function gear(x, y, r, teeth, col) {
  var d = "", n = teeth * 2;
  for (var i = 0; i <= n * 2; i++) { var a = i / (n * 2) * Math.PI * 2, rr = (Math.floor(i / 2) % 2) ? r : r * 1.18; d += (i ? "L" : "M") + f(x + Math.cos(a) * rr) + " " + f(y + Math.sin(a) * rr); }
  return '<path d="' + d + 'Z" fill="' + (col || KHAKI) + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>' + C(x, y, r * .38, PAPER, 2.6) + C(x, y, r * .14, INK, 0);
}
bot += gear(840, 1680, 64, 10, KHAKI) + gear(944, 1620, 40, 8, "#a9b3b8");
bot += bulb(880, 1420, .85);
bot += label(840, 1390, 760, 1360, "الفكرة", INK, 1, 30);

s = defs + s + frame() + sky + mid + bot;
// small corner logo, like every card
s += G("translate(906 76) scale(.2)", '<path d="M30 40 H182 V150 H96 L60 186 V150 H30 Z" fill="#f4ecdb" stroke="#2a2016" stroke-width="9" stroke-linejoin="round"/><text x="106" y="140" text-anchor="middle" style="font:800 120px Noto Sans Arabic;fill:#bd552f">؟</text>');
s += '<text x="896" y="104" text-anchor="start" style="font:600 22px Noto Sans Arabic;fill:#6f6556">إيه الحكاية؟</text>';
document.getElementById("art").innerHTML = s;
</script>
</body></html>
