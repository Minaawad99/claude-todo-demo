// ── textures drawn on canvas ───────────────────────────────────

}

const dirtTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#6b4226'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { const v = rnd(); g.fillStyle = v < .5 ? 'rgba(40,22,10,.45)' : 'rgba(150,100,60,.35)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 4, 1 + rnd() * 3); } }, [3, 1]);

const asphaltTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#8d8f93'; g.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { g.fillStyle = rnd() < .5 ? 'rgba(60,60,60,.25)' : 'rgba(200,200,200,.18)'; g.fillRect(rnd() * w, rnd() * h, 1, 1); } }, [8, 2]);
const facadeTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#e6d2a8'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1800; i++) { g.fillStyle = 'rgba(120,90,50,.06)'; g.fillRect(rnd() * w, rnd() * h, 2, 2); } }, [3, 5]);

const FAST = /fast/.test(location.search), PHONG = /phong/.test(location.search);

};
const mat = {
  dirt: M(0xffffff, { map: dirtTex }), grass: M(0xffffff, { map: grassTex }), asphalt: M(0xffffff, { map: asphaltTex }),
  side: M(0xbdbab2), facade: M(0xffffff, { map: facadeTex }), inner: M(0xf3ecdc), slab: M(0xd9d5cc),
  win: M(0x1f3f6e, { roughness: .3, metalness: .2 }), frame: M(0xf5f1e8), shutter: M(0x7a4b2a), roof: M(0xc0532d),
  white: M(0xffffff), line: M(0xf4f4f4), trunk: M(0x6b4a2b), leaf: M(0x4f9a3f),
  motor: M(0x2f6fb5, { roughness: .45, metalness: .3, side: THREE.DoubleSide }), iron: M(0x55595e, { roughness: .5, metalness: .5, side: THREE.DoubleSide }),
  brass: M(0xc19a55, { roughness: .35, metalness: .7, side: THREE.DoubleSide }), steel: M(0xb9bec4, { roughness: .35, metalness: .7 }),
  copper: M(0xc56a2d, { roughness: .35, metalness: .7, emissive: 0x000000 }), pvc: M(0xf0f0f0, { roughness: .4, transparent: true, opacity: .32, depthWrite: false }),
  water: M(0x3fa7e8, { roughness: .15, metalness: 0, transparent: true, opacity: .85, emissive: 0x0b3a5a }), main: M(0x3a4b5c, { roughness: .6 }),
  gauge: M(0xffffff, { roughness: .4 }), black: M(0x222222), counter: M(0xdad4c8), sink: M(0xdfe3e6, { metalness: .6, roughness: .3 })

// ── lights ─────────────────────────────────────────────────────

const fill = new THREE.PointLight(0xfff0d8, .5, 12); fill.position.set(3.5, 2.4, -1); scene.add(fill);

// ── ground block with a pit cut into the street ────────────────
const GX0 = -26, GX1 = 28, GZ0 = -30, GZ1 = 12, GD = 3.2;
const PIT = { x0: 1.6, x1: 6.6, z0: 0.6, z1: 7.0, y0: -2.3 };

surface(GX0, PIT.x0, GZ0, GZ1); surface(PIT.x1, GX1, GZ0, GZ1); surface(PIT.x0, PIT.x1, GZ0, PIT.z0); surface(PIT.x0, PIT.x1, PIT.z1, GZ1);

const BH = B.floors * B.fh;
box(B.x1 - B.x0, BH, .3, mat.inner, (B.x0 + B.x1) / 2, BH / 2, B.z0 + .15);                       // back wall
box(.3, BH + .6, B.z1 - B.z0, mat.facade, B.x1 - .15, (BH + .6) / 2, (B.z0 + B.z1) / 2);           // right wall

box(.7, .06, .5, mat.sink, 3.0, TOP + .28 + .93, -5.8);

// neighbours: low houses with red roofs, a few trees

house(-11, -6, 6, 5, 5); house(-16, -18, 7, 6, 5.5, .1, 0xdfd3bb); house(12, -6, 6, 6, 5, 0, 0xe2d6c4); house(13, -19, 7, 5, 5.5, -.1); house(-2, -22, 7, 5, 5, 0, 0xd8cbb1);
for (const [x, z] of [[-7, 10.5], [13, 10.6], [17, 11], [-15, 10.8], [9, -2], [-8, -13]]) { const t = cyl(.15, 1.6, mat.trunk, scene); t.position.set(x, .8, z); const l = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 12), mat.leaf); l.position.set(x, 2.3, z); l.castShadow = true; scene.add(l); }

const flap = new THREE.Group(); flap.position.set(CV.x, CV.y - .02, CV.z); scene.add(flap);

];

const dummy = new THREE.Object3D();

// ── script ─────────────────────────────────────────────────────

const BEATS = [

];
window.DURATION = 65.5;
const words = [];
for (const [a, b, s] of BEATS) { const ws = s.split(' '); const step = (b - a - .5) / ws.length; ws.forEach((w, i) => words.push([a + .2 + i * step, w])); }
const NUMS = [[28.4, 41, '2900 لفة/دقيقة', '#ff4a3d'], [42.2, 48.2, '30 متر', '#3fb6ff']];

// camera shots: [time, position, target]
const shots = [
  [0, V(13, 8.5, 36), V(1.5, 7.2, -3)],
  [5.2, V(4.6, TOP + 2.6, 1.8), V(3, TOP + 1.3, -5.6)],
  [7.4, V(4.6, TOP + 2.6, 1.8), V(3, TOP + 1.3, -5.6)],
  [10, V(8.5, 5.2, 12.5), V(4, -1.2, 4.2)],
  [13, V(4.2, 6, 11), V(4.6, 3.6, -3)],
  [15.8, V(5.2, 2.4, 1.8), V(2.85, .9, PZ)],
  [19.2, V(4.8, 2.1, 1.2), V(2.75, .85, PZ)],
  [21.8, V(2.9, 1.5, -1.1), V(2.4, .78, PZ)],
  [26.4, V(2.4, 1.4, -1.15), V(2.45, .78, PZ)],
  [28.6, V(3.8, 1.25, -1.6), V(3.15, .82, PZ)],
  [33.5, V(4.0, 1.4, -1.65), V(3.15, .8, PZ)],
  [40.5, V(3.4, 1.6, -1.4), V(3.15, .95, PZ)],
  [43.5, V(3.4, 6.5, 9), V(4.8, 6.5, -3)],
  [47.4, V(3.6, 13.5, 8), V(4.6, TOP + 1.8, -4.2)],
  [49.6, V(4.3, 2.3, -.9), V(3.17, 1.75, PZ)],
  [53.8, V(4.2, 2.4, -.95), V(3.17, 1.9, PZ)],
  [56.2, V(4.1, 2.75, -1.1), V(3.3, 2.3, PZ)],
  [58.6, V(4.2, TOP + 2.4, -1.9), V(3.0, TOP + 1.3, -5.7)],
  [61.2, V(4.4, TOP + 2.5, -1.6), V(3.0, TOP + 1.2, -5.7)],
  [65.5, V(13, 8.5, 36), V(1.5, 7.2, -3)]
];
// hold each shot with a slow push-in, then travel to the next one in the last 1.3s
const KF = [];
shots.forEach(([t, p, q], i) => {
  KF.push([t, p, q]);
  const nx = shots[i + 1]; if (!nx) return;
  const hold = Math.max(t + .1, nx[0] - 1.3);
  KF.push([hold, p.clone().lerp(q, .1), q]);
});
function cameraAt(t) {
  let i = 0; while (i < KF.length - 2 && KF[i + 1][0] <= t) i++;
  const [t0, p0, q0] = KF[i], [t1, p1, q1] = KF[i + 1];
  const k = smooth((t - t0) / (t1 - t0));
  camera.position.lerpVectors(p0, p1, k);
  const tgt = new THREE.Vector3().lerpVectors(q0, q1, k);
  // slow drift so the camera never sits still
  camera.position.x += Math.sin(t * .35) * .06 * camera.position.distanceTo(tgt);
  camera.lookAt(tgt);
}

const LABELS = [
  [7.8, 13.5, 'ماسورة الحكومة', V(3.2, -.85, 4.6)], [11, 13.8, 'ضغط ضعيف', V(RX, 4.6, PZ)],
  [16, 21, 'الموتور', V(2.35, 1.3, PZ)], [16.6, 21, 'الطلمبة', V(3.17, 1.35, PZ)],
  [22.2, 27, 'ملفات نحاس', V(2.35, 1.12, PZ)], [24.6, 27, 'العمود', V(1.95, .82, PZ)],
  [29, 40.5, 'الريشة', V(3.17, 1.2, PZ)],
  [50, 54.5, 'محبس عدم الرجوع', V(3.17, 2.03, PZ)], [56.4, 58.6, 'الأوتوماتيك', V(3.42, 2.48, PZ)]
];
const labelEls = LABELS.map(([, , text]) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = text; document.getElementById('labels').appendChild(d); return d; });

// pump running state (0..1) and where the water front has reached
function running(t) {
  const on = (a, b) => clamp((t - a) / 1.2) * (1 - clamp((t - b) / 1.2));
  return Math.max(on(16.5, 50.3), clamp((t - 57.4) / 1.2));
}
function waterFront(t) {
  if (t < 7.5) return 0;
  if (t < 12.5) return lerp(0, U_FLOOR2, smooth((t - 7.5) / 5));
  if (t < 41.8) return U_FLOOR2;
  return lerp(U_FLOOR2, 1, smooth((t - 41.8) / 5));
}

// integrate rotor angle and water travel ahead of time, so any frame can be rendered on its own
const STEP = 1 / 120, ACC = [[0, 0]];
for (let i = 1; i <= Math.ceil(68 / STEP); i++) { const r = running(i * STEP); const [a0, f0] = ACC[i - 1]; ACC.push([a0 + STEP * r * 9, f0 + STEP * (.35 + 2.4 * r)]); }
const acc = t => { const x = clamp(t / STEP, 0, ACC.length - 1), i = Math.floor(x), k = x - i, a = ACC[i], b = ACC[Math.min(i + 1, ACC.length - 1)]; return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; };
window.render = t => {
  const run = running(t);
  const [angle, flowPos] = acc(t);
  cameraAt(t);
  // cutaway of the pump casing between 20s and 41s
  const cut = smooth((t - 20.4) / 1.2) * (1 - smooth((t - 42.6) / 1.2)) + smooth((t - 49.2) / 1) * (1 - smooth((t - 56) / 1));
  cutPlane.constant = lerp(-2.6, PZ, cut) * -1 * -1;   // plane keeps z < constant
  cutPlane.constant = cut > .001 ? lerp(-2.6, PZ, cut) : 100;
  // coils glow with current
  mat.copper.emissive.setRGB(.55 * run * (t > 21 && t < 28 ? 1 : .25), .18 * run * (t > 21 && t < 28 ? 1 : .25), 0);
  // rotation: ~2900 rpm drawn slowed so the eye can follow
  rotor.userData.a = angle; impeller.rotation.x = rotor.rotation.x = angle;
  // check valve: open while running
  flap.rotation.z = lerp(0, -1.25, run);
  // gauge: pressure high while running, drops when the tap opens
  const tapOpen = t > 55.6;
  const pressure = t < 16.5 ? .15 : t < 55.6 ? lerp(.15, .82, clamp(run + (t > 50.3 ? 1 : 0))) : lerp(.82, .35, smooth((t - 55.6) / 1)) + .45 * clamp((t - 57.6) / 1.5);
  needle.rotation.z = Math.PI * .85 - pressure * Math.PI * 1.4;
  // water
  const front = waterFront(t);
  mainWater.visible = t > 7;
  setFill(front);
  const stopAt = front * LEN;
  for (let i = 0; i < PN; i++) {
    const d = ((flowPos + i * LEN / PN) % LEN);
    const visible = d < stopAt - .05 && (run > .05 || t < 13);
    const p = path.getPointAt(clamp(d / LEN));
    dummy.position.copy(p); dummy.scale.setScalar(visible ? 1 : 0); dummy.updateMatrix(); parts.setMatrixAt(i, dummy.matrix);
  }
  parts.instanceMatrix.needsUpdate = true;
  // swirl inside the volute: water thrown outward along a spiral
  for (let i = 0; i < swirlN; i++) {
    const k = ((rotor.userData.a || 0) * .08 + i / swirlN) % 1, a = (rotor.userData.a || 0) + k * 9 + i, r = .06 + k * .3;
    dummy.position.set(pump.position.x + .42, PY + Math.cos(a) * r, PZ + Math.sin(a) * r);
    dummy.scale.setScalar(cut > .5 && run > .1 ? 1 : 0); dummy.updateMatrix(); swirl.setMatrixAt(i, dummy.matrix);
  }
  swirl.instanceMatrix.needsUpdate = true;
  const flowing = front > .999 && tapOpen && run > .3;
  stream.scale.y = flowing ? lerp(.01, .78, smooth((t - 57.8) / .6)) : .001;
  // a lonely drip at the dry tap
  const dk = (t % 1.6) / 1.6; drip.visible = t < 7 || (t > 58 && !flowing);
  drip.position.set(tapSpout.x, tapSpout.y - .05 - dk * dk * .75, tapSpout.z); drip.scale.setScalar(dk < .95 ? 1 : .001);
  // captions: one word at a time
  let cur = ''; let wt = 0; for (const [ts, w] of words) if (t >= ts) { cur = w; wt = ts; }
  const wEl = document.getElementById('word');
  wEl.textContent = cur; const pk = clamp((t - wt) / .12); wEl.style.transform = `scale(${lerp(.82, 1, pk) + Math.sin(pk * Math.PI) * .08})`;
  const nEl = document.getElementById('num'); nEl.textContent = '';
  for (const [a, b, s, c] of NUMS) if (t >= a && t < b) { nEl.textContent = s; nEl.style.color = c; const k = clamp((t - a) / .25); nEl.style.transform = `scale(${lerp(.7, 1, k) + Math.sin(k * Math.PI) * .1})`; }
  // labels pinned to parts
  LABELS.forEach(([a, b, , at], i) => {
    const el = labelEls[i], v = at.clone().project(camera);
    const on = t >= a && t < b && v.z < 1;
    el.style.opacity = on ? clamp((t - a) / .2) * clamp((b - t) / .2) : 0;
    el.style.left = clamp((v.x + 1) / 2 * W, 130, W - 130) + 'px'; el.style.top = ((1 - v.y) / 2 * H) + 'px';
  });
  renderer.render(scene, camera);
  composite();
};
// draw the frame and its captions into one 2D canvas, so frames are exported without the page compositor
const out = document.createElement('canvas'); out.width = W; out.height = H;
const cx2 = out.getContext('2d');
function strokeText(text, x, y, size, color, stroke, sc = 1) {
  if (!text) return;
  cx2.save(); cx2.translate(x, y); cx2.scale(sc, sc);
  cx2.font = `${size}px Lalezar`; cx2.direction = 'rtl'; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
  cx2.lineJoin = 'round'; cx2.lineWidth = stroke; cx2.strokeStyle = '#111'; cx2.strokeText(text, 0, 0);
  cx2.fillStyle = color; cx2.fillText(text, 0, 0); cx2.restore();
}
function composite() {
  cx2.drawImage(renderer.domElement, 0, 0, W, H);
  document.querySelectorAll('.lbl').forEach(el => { const o = +el.style.opacity; if (o > .01) { cx2.globalAlpha = o; strokeText(el.textContent, parseFloat(el.style.left), parseFloat(el.style.top) - 26, 46, '#fff', 11); cx2.globalAlpha = 1; } });
  const w = document.getElementById('word'), n = document.getElementById('num');
  const sc = el => { const m = /scale\(([\d.]+)\)/.exec(el.style.transform); return m ? +m[1] : 1; };
  strokeText(w.textContent, W / 2, 340, 80, '#fff', 14, sc(w));
  strokeText(n.textContent, W / 2, 448, 96, n.style.color || '#fff', 16, sc(n));
}
window.frameData = () => out.toDataURL('image/jpeg', .9);
window.ready = document.fonts.ready.then(() => render(0));
</script>
</body>
</html>
