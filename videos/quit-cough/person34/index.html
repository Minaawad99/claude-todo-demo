<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Three-quarter person test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600;700;800;900&family=Noto+Serif:wght@800&display=swap" rel="stylesheet">
<style>html, body { margin: 0; background: #eee5d0; } svg { display: block; width: 360px; height: 640px; }</style></head><body>
<svg id="v" viewBox="0 0 640 1138"></svg>
<script>window.TIMING = { lines: [], duration: 10.2 }; window.VIDEO_END = 10.2;</script>
<script src="../../_templates/sketch/_helpers.js"></script>
<script src="../../_templates/people/person.js"></script>
<script>
// ── A 10 s test of a new three-quarter person for the «اسكتش» episodes, after the moving boy in the user's reference clip
// (an illustrated classroom/street film): real adult proportions, the body turned ~30° (near shoulder on the viewer's right),
// a sweater over a collared shirt, cel light and shadow, a calm natural face with small eyes, thick hair in locks,
// five-finger hands from the shared kit. Beats follow the narrator: looks at his cigarette → hand to the chin → coughs.

var SK = "#c8906c", SKD = "#a56e4f", SKL = "#dcab88", HAIR = "#2a201b", HAIRL = "#4a3a30", SW = "#3f5885", SWD = "#2c3f63", SWL = "#5874a3",
    ARM = "#4b6797", COL = "#cfdceb", COLD = "#a8bdd4", LIP = "#9c5a4a";
// beats (s, from the narration): line 0 0.19–3.1, line 1 3.48–5.84, cough line 6.71–9.24
var H = 1500;   // the standing height in px at this shot (medium shot: waist up)
// ---------- tiny geometry helpers ----------
function pt(x, y) { return [x, y]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function smooth(pts, close) { var d = "M" + f(pts[0][0]) + " " + f(pts[0][1]); for (var i = 1; i < pts.length; i++) { var m = [(pts[i - 1][0] + pts[i][0]) / 2, (pts[i - 1][1] + pts[i][1]) / 2]; d += " Q" + f(pts[i - 1][0]) + " " + f(pts[i - 1][1]) + " " + f(m[0]) + " " + f(m[1]); } var L = pts[pts.length - 1]; return d + (close ? " Q" + f(L[0]) + " " + f(L[1]) + " " + f(pts[0][0]) + " " + f(pts[0][1]) + " Z" : " L" + f(L[0]) + " " + f(L[1])); }
function shape(pts, fill, sw, close) { return '<path d="' + smooth(pts, close !== false) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw || 2.6) + '" stroke-linejoin="round"/>'; }
function shade(pts, fill, op) { return '<path d="' + smooth(pts, true) + '" fill="' + fill + '" opacity="' + (op || 1) + '"/>'; }
function line(pts, col, w, op) { return '<path d="' + smooth(pts, false) + '" fill="none" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (op ? ' opacity="' + op + '"' : "") + '/>'; }
// a tapered limb from a list of centre points and widths (one outline, the joint hidden inside)
function limb(pts, ws, fill, sw) {
  var Lp = [], Rp = [], n = pts.length;
  for (var i = 0; i < n; i++) { var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d; Lp.push([pts[i][0] + nx * ws[i] / 2, pts[i][1] + ny * ws[i] / 2]); Rp.push([pts[i][0] - nx * ws[i] / 2, pts[i][1] - ny * ws[i] / 2]); }
  var ring = Lp.concat(Rp.reverse());
  return '<path d="' + smooth(ring, true) + '" fill="' + fill + '"/>' + '<path d="' + smooth(Lp, false) + '" fill="none" stroke="' + INK + '" stroke-width="' + (sw || 2.6) + '" stroke-linecap="round"/><path d="' + smooth(Rp.reverse(), false) + '" fill="none" stroke="' + INK + '" stroke-width="' + (sw || 2.6) + '" stroke-linecap="round"/>';
}
function along2(a, b, k, off) { var dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1; return [a[0] + dx * k - dy / d * (off || 0), a[1] + dy * k + dx / d * (off || 0)]; }

// ---------- the pose over time ----------
function pose(t) {
  var p = { breath: (Math.sin(t * 1.7) + 1) / 2, tilt: 0, nod: 0, look: [-.2, .1], eyes: 1, brows: 0, mouth: "neutral", arm: "cig", jerk: 0, shrug: 0 };
  p.blink = (t % 3.1 > 2.95) || (t > 5.2 && t < 5.32);
  if (t < 3.3) {   // looks down at the cigarette in his hand, then lifts his eyes to us
    var k = ease((t - 1.6) / .6); p.nod = lerp(.5, .05, k); p.look = [lerp(.35, -.15, k), lerp(.9, 0, k)]; p.tilt = lerp(5, 0, k); p.brows = lerp(0, .6, k); p.mouth = t > 2.2 ? "o" : "neutral";
    p.armK = 0;
  } else if (t < 6.5) {   // the cigarette goes down, the hand comes up to the chin: thinking
    var k2 = ease((t - 3.4) / .7); p.arm = "chin"; p.armK = k2; p.tilt = lerp(0, -6, k2); p.look = [lerp(-.15, -.45, k2), lerp(0, -.35, k2)]; p.brows = lerp(.6, .9, k2); p.mouth = "frown"; p.nod = .02;
  } else {   // the cough: fist to the mouth, eyes squeezed, shoulders jump with each cough
    var k3 = ease((t - 6.5) / .45), c = t > 7.2 ? Math.max(0, Math.sin((t - 7.2) * Math.PI * 2 * 1.35)) : 0;
    p.arm = "cough"; p.armK = k3; p.jerk = c; p.nod = .12 + .25 * c; p.tilt = -4 + 6 * c; p.eyes = k3 > .5 ? .12 : 1; p.brows = -.6 * k3; p.mouth = c > .35 ? "o" : "frown"; p.shrug = c; p.look = [-.2, .3];
  }
  return p;
}

// ---------- the body (origin: the pit of the neck N) ----------
function person34(t) {
  var p = pose(t), s = "", br = p.breath, j = p.jerk;
  var N = [318, 470 + 6 * j - 2 * br];
  // shoulders: real biacromial width .23H, turned 30° → .2H across; the far one shorter and a little higher in the picture
  var nearS = add(N, [178 + 2 * br, 48 - 10 * p.shrug]), farS = add(N, [-136, 38 - 10 * p.shrug]);
  var hip = [N[0] + 8, N[1] + .30 * H];
  // far arm: hangs behind the torso, only its outer edge and sleeve show
  s += limb([add(farS, [-4, 10]), add(farS, [-26, 150]), add(farS, [-22, 300]), add(farS, [-6, 420])], [92, 80, 70, 62], SWD, 2.6);
  // torso: sweater, chest turned, the near side wider; light from the upper right
  var tor = [add(N, [-46, -6]), add(N, [-92, 8]), farS, add(farS, [-10, 70]), add(farS, [-2, 210]), [hip[0] - 128, hip[1] - 30], [hip[0] - 120, hip[1] + 60], [hip[0] + 150, hip[1] + 60], [hip[0] + 160, hip[1] - 30], add(nearS, [18, 230]), add(nearS, [26, 80]), nearS, add(N, [110, 14]), add(N, [56, -6])];
  s += shape(tor, SW, 2.8);
  s += shade([add(N, [-92, 10]), farS, add(farS, [-6, 140]), [hip[0] - 120, hip[1] + 60], [hip[0] - 40, hip[1] + 60], add(N, [-40, 260]), add(N, [-50, 60])], SWD, .85);   // shadow side
  s += shade([add(nearS, [-40, 20]), add(nearS, [6, 60]), add(nearS, [-6, 200]), add(nearS, [-50, 150])], SWL, .7);   // light on the near chest
  s += line([add(N, [-20, 170]), add(N, [10, 200]), add(N, [40, 190])], SWD, 2.2) + line([add(N, [-60, 330]), add(N, [-24, 350])], SWD, 2);   // folds
  // neck with the shadow under the jaw, the shirt collar points over the sweater's crew neck
  var hc = headCentre(N, p);
  s += shape([add(N, [-40, 6]), add(hc, [-34, 60]), add(hc, [30, 66]), add(N, [44, 4])], SK, 2.6) + shade([add(N, [-40, 6]), add(hc, [-34, 62]), add(hc, [26, 76]), add(N, [10, 0])], SKD, .75);
  s += shape([add(N, [-62, -2]), add(N, [-30, 22]), add(N, [36, 24]), add(N, [72, -2]), add(N, [44, 10]), add(N, [-30, 10])], SWD, 2.4);   // ribbed crew neck
  s += shape([add(N, [-50, -14]), add(N, [-8, 26]), add(N, [-30, 34]), add(N, [-64, 0])], COL, 2.2) + shape([add(N, [56, -14]), add(N, [10, 26]), add(N, [36, 34]), add(N, [74, 0])], COL, 2.2);
  // the head
  s += head(hc, p, t);
  // near arm (in front): shoulder → elbow (down at the side) → hand
  s += nearArm(t, p, nearS, hc);
  return s;
}
function headCentre(N, p) { return [N[0] - 8 - 10 * p.tilt * .3, N[1] - 160 + 26 * p.nod]; }

// ---------- the head, three-quarter, facing the viewer's left ----------
function head(c, p, t) {
  var W = 150, Hh = 196, s = "", rot = p.tilt;
  function P(x, y) { return [c[0] + x * W, c[1] + y * Hh]; }
  var g = "";
  // back hair mass behind the head
  g += shape([P(.05, -.55), P(.42, -.46), P(.56, -.2), P(.52, .08), P(.38, .1), P(-.2, -.2)], HAIR, 2.6);
  // ear (near side)
  g += shape([P(.38, -.02), P(.5, -.06), P(.55, .06), P(.5, .2), P(.4, .22)], SK, 2.4) + line([P(.45, .02), P(.49, .1), P(.44, .16)], SKD, 2);
  // face: far cheek, jaw to the chin, near jaw back to the ear
  var face = [P(-.36, -.22), P(-.42, 0), P(-.38, .17), P(-.27, .37), P(-.1, .5), P(.04, .5), P(.24, .4), P(.4, .22), P(.42, 0), P(.36, -.3), P(0, -.42)];
  g += shape(face, SK, 2.8);
  g += shade([P(.12, .28), P(.24, .4), P(.4, .22), P(.42, .0), P(.3, .1)], SKD, .55);       // shadow under the near cheekbone toward the ear
  g += shade([P(-.16, .48), P(.04, .5), P(.16, .45), P(-.02, .44)], SKD, .6);            // under the chin
  g += shade([P(.06, -.32), P(.3, -.26), P(.36, -.06), P(.2, -.14)], SKL, .5);           // light on the near forehead
  // eyes: the far one smaller and narrower; lids, iris looking with p.look, highlight
  [[-.23, .02, .7], [.1, .02, 1]].forEach(function (e) {
    var ex = e[0], sc = e[2], ew = .15 * sc, op = p.blink ? 0 : p.eyes;
    var cx = P(ex, e[1]);
    if (op < .2) { g += line([P(ex - ew / 2, e[1] + .01), P(ex, e[1] + .03), P(ex + ew / 2, e[1] + .01)], INK, 2.8); return; }
    var top = -.045 * op, bot = .035;
    var eye = [P(ex - ew / 2, e[1]), P(ex - ew * .15, e[1] + top * 1.2), P(ex + ew * .3, e[1] + top), P(ex + ew / 2, e[1] + .004), P(ex + ew * .2, e[1] + bot), P(ex - ew * .2, e[1] + bot)];
    g += shape(eye, "#f7f1e6", 1.6);
    var ir = [cx[0] + p.look[0] * ew * W * .28, cx[1] + p.look[1] * 3 + 1];
    g += '<circle cx="' + f(ir[0]) + '" cy="' + f(ir[1]) + '" r="' + f(8.5 * sc) + '" fill="#3b2a20"/><circle cx="' + f(ir[0] + 2.5) + '" cy="' + f(ir[1] - 3) + '" r="' + f(2.4 * sc) + '" fill="#fff"/>';
    g += line([P(ex - ew / 2 - .01, e[1] - .005), P(ex - ew * .1, e[1] + top * 1.35), P(ex + ew / 2 + .01, e[1])], INK, 3.4);   // upper lid
  });
  // brows (p.brows: +1 raised/worried … −1 squeezed down)
  var bR = -.1 - .035 * p.brows;
  g += '<path d="' + smooth([P(-.32, bR + .02), P(-.24, bR - .02), P(-.15, bR + .005 - .02 * Math.max(0, p.brows))], false) + '" stroke="' + HAIR + '" stroke-width="7" fill="none" stroke-linecap="round"/>';
  g += '<path d="' + smooth([P(.01, bR + .005 - .02 * Math.max(0, p.brows)), P(.12, bR - .03), P(.24, bR + .01)], false) + '" stroke="' + HAIR + '" stroke-width="8" fill="none" stroke-linecap="round"/>';
  // nose: the bridge from between the brows, the tip just past the far cheek line, the nostril wing
  g += line([P(-.08, -.04), P(-.16, .12), P(-.22, .21), P(-.16, .25), P(-.07, .24)], INK, 2.6) + shade([P(-.08, -.02), P(-.03, .14), P(-.06, .24), P(-.14, .2)], SKD, .35);
  // mouth
  var mw = .2, my = .34, m = "";
  if (p.mouth === "o") m = shape([P(-.12, my - .02), P(-.06, my - .04), P(0, my - .01), P(-.02, my + .05), P(-.1, my + .05)], "#5a2a24", 2.2);
  else if (p.mouth === "frown") m = line([P(-.17, my + .02), P(-.07, my - .005), P(.04, my + .025)], LIP, 3.2);
  else m = line([P(-.17, my), P(-.06, my + .012), P(.04, my - .005)], LIP, 3.2) + line([P(-.1, my + .05), P(-.02, my + .055)], SKD, 2, .7);
  g += m;
  // front hair: thick locks falling on the forehead, strands
  g += shape([P(-.4, -.18), P(-.44, -.36), P(-.24, -.56), P(.12, -.6), P(.4, -.46), P(.46, -.22), P(.38, -.12), P(.3, -.26), P(.16, -.22), P(.06, -.3), P(-.06, -.18), P(-.18, -.27), P(-.28, -.14)], HAIR, 2.8);
  g += line([P(-.2, -.46), P(-.05, -.38), P(.08, -.42)], HAIRL, 2.4) + line([P(.12, -.5), P(.26, -.4), P(.32, -.3)], HAIRL, 2.4) + line([P(-.34, -.32), P(-.22, -.3)], HAIRL, 2.2);
  g += line([P(.4, -.1), P(.4, .02)], HAIR, 7);   // sideburn
  return G("rotate(" + f(rot) + " " + f(c[0]) + " " + f(c[1] + 80) + ")", g);
}

// ---------- the near arm and hand (five-finger hand from the shared kit) ----------
var HS = H / 400;   // kit hand scale
function nearArm(t, p, sh, hc) {
  var s = "", el, wr, hand = "relaxed", rot = -80;
  var elRest = add(sh, [40, 200]), wrCig = add(sh, [-110, 70]);        // forearm across the belly, cigarette in the fingers
  var elChin = add(sh, [-40, 250]), wrChin = add(hc, [-20, 150]);      // hand under the chin
  var elCough = add(sh, [-50, 240]), wrCough = add(hc, [-40, 128]);    // fist at the mouth
  if (p.arm === "cig") { el = elRest; wr = add(wrCig, [0, -6 * Math.sin(t * 1.2)]); hand = "relaxed"; rot = 190; }
  else if (p.arm === "chin") { el = L2(elRest, elChin, p.armK); wr = L2(wrCig, wrChin, p.armK); hand = p.armK > .6 ? "flat" : "relaxed"; rot = lerp(190, 250, p.armK); }
  else { el = L2(elChin, elCough, p.armK); wr = add(L2(wrChin, wrCough, p.armK), [0, 8 * p.jerk]); hand = "fist"; rot = 245; }
  // sleeve: shoulder → elbow → cuff, one flowing outline; folds inside the bend
  var cuff = along2(el, wr, .8);
  // upper arm first, then the forearm over it with a round elbow: a bent arm stays readable even when the hand comes up to the face
  s += limb([add(sh, [0, 6]), along2(sh, el, .5), along2(sh, el, 1.04)], [100, 88, 80], ARM, 3) + shade([along2(sh, el, .15, 30), along2(sh, el, .9, 30), along2(sh, el, .9, 8), along2(sh, el, .15, 6)], SWD, .6);
  s += '<circle cx="' + f(el[0]) + '" cy="' + f(el[1]) + '" r="39" fill="' + ARM + '" stroke="' + INK + '" stroke-width="3"/>';
  s += limb([along2(el, cuff, -.06), along2(el, cuff, .5), cuff], [78, 72, 64], ARM, 3) + line([along2(el, cuff, .05, -18), along2(el, cuff, .2, -4)], SWD, 2.4) + line([along2(el, cuff, .12, -20), along2(el, cuff, .26, -2)], SWD, 2.2);
  s += limb([along2(el, cuff, .97), cuff], [60, 60], SWD, 2.2);   // ribbed cuff
  // the hand
  var ang = rot * Math.PI / 180, hcol = Object.assign({}, PERSON.colors, { skin: SK, skinD: SKD, skinL: SKL });
  s += PERSON.hand([wr[0], wr[1]], ang, hand, -1, HS * .72, hcol);
  if (p.arm === "cig" || (p.arm === "chin" && p.armK < .3)) s += cigarette(wr, t, p.arm === "chin" ? 1 - p.armK / .3 : 1);
  if (p.arm === "cough" && p.jerk > .3) for (var i = 0; i < 3; i++) s += line([add(hc, [-150 - i * 8, 40 + i * 34]), add(hc, [-196 - i * 8, 30 + i * 40])], INK, 4, p.jerk);
  return s;
}
function L2(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }
function cigarette(w, t, op) {
  var a = [w[0] - 64, w[1] + 18], b = [w[0] - 150, w[1] + 4];
  var s = '<path d="M' + f(a[0]) + ' ' + f(a[1]) + ' L' + f(b[0]) + ' ' + f(b[1]) + '" stroke="' + INK + '" stroke-width="15" stroke-linecap="round"/><path d="M' + f(a[0]) + ' ' + f(a[1]) + ' L' + f(b[0]) + ' ' + f(b[1]) + '" stroke="#f6f2ea" stroke-width="10"/>' +
    '<path d="M' + f(a[0]) + ' ' + f(a[1]) + ' L' + f(a[0] - 24) + ' ' + f(a[1] - 4) + '" stroke="#d79a52" stroke-width="10"/><circle cx="' + f(b[0]) + '" cy="' + f(b[1]) + '" r="6" fill="' + ORANGE + '"/>';
  for (var i = 0; i < 4; i++) { var q = (t * .45 + i / 4) % 1; s += '<path d="M' + f(b[0] - 4 + 14 * Math.sin(q * 7 + i)) + ' ' + f(b[1] - 14 - q * 150) + ' q14 -14 0 -28" stroke="#9a958c" stroke-width="4" fill="none" stroke-linecap="round" opacity="' + f(.75 * (1 - q)) + '"/>'; }
  return G("", s, op);
}

// ---------- the card (episode look: cream paper, frame, panel, caption under a rule) ----------
var CAPS = [[0, "إيه اللي هيحصل لجسمك… لو بطّلت سجاير مرة واحدة؟"], [3.45, "وليه ناس كتير بتكح أكتر… بعد ما تبطّل؟"], [6.6, "وطريقه الوحيد بره… هو الكحة."]];
var KEYW = { "بطّلت": ORANGE, "بتكح": ORANGE, "الكحة.": ORANGE };
function capAt(t) { var i = 0; while (i < CAPS.length - 1 && CAPS[i + 1][0] <= t) i++; return [CAPS[i][1], t - CAPS[i][0]]; }
function renderAt(t) {
  window.__t = t; CLIPN = 0;
  var cx = 330 + 8 * Math.sin(t * .9), cy = 470 + 6 * Math.cos(t * .7), z = 1.5 + .06 * (t / 10) + .01 * Math.sin(t * 1.3);
  var s = '<rect width="640" height="1138" fill="' + PAPER + '"/><clipPath id="pc"><rect x="34" y="34" width="572" height="790"/></clipPath><g clip-path="url(#pc)">' +
    '<rect x="0" y="0" width="640" height="1138" fill="url(#grid)"/>' +
    '<g transform="translate(320 430) scale(' + z.toFixed(4) + ') translate(' + f(-cx) + ' ' + f(-cy + 90) + ')">' + person34(t) + '</g></g>';
  s += '<rect x="34" y="34" width="572" height="790" fill="none" stroke="' + INK + '" stroke-width="2"/>';
  s += '<rect x="16" y="16" width="608" height="1106" fill="none" stroke="' + INK + '" stroke-width="2"/>';
  var cp = capAt(t), k = ease(cp[1] / .35), words = cp[0].split(" ").map(function (w) { return '<tspan fill="' + (KEYW[w] || INK) + '">' + w + '</tspan>'; }).join(" ");
  s += '<path d="M80 880 H560" stroke="' + INK + '" stroke-width="1.6"/>' + G("translate(0 " + f(8 * (1 - k)) + ")", '<text x="320" y="950" text-anchor="middle" style="font:800 25px Noto Sans Arabic">' + words + '</text>', k);
  s += T("إيه الحكاية؟", 590, 1090, 18, INK, 700, "start") + T("تجربة الشخصية الجديدة", 60, 1090, 16, ORANGE, 700, "end");
  document.getElementById("v").innerHTML = DEFS + s + '<rect width="640" height="1138" filter="url(#paperN)" pointer-events="none"/>';
}
var DEFS = '<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" stroke="#dccfb2" stroke-width="1" fill="none"/></pattern>' +
  '<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" stroke="#2a2016" stroke-width="1" opacity=".18"/></pattern>' +
  '<filter id="paperN"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .06 0"/></filter></defs>';
renderAt(0);
</script></body></html>
